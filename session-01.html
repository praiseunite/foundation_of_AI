<script>
'use strict';
const STORAGE='aptech-ai-session1-v1';
const fresh={slide:0,labels:['Orange','Orange','Orange','Mango','Mango','Mango'],query:150,gap:35,answers:{},worksheet:{},code:'message = "Hello, AI!"\nprint(message)',codeOutput:'',workflow:['train','problem','use','collect','evaluate','prepare'],evaluated:false};
let state;try{state={...structuredClone(fresh),...JSON.parse(localStorage.getItem(STORAGE)||'null')};}catch(e){state=structuredClone(fresh);}
if(!Array.isArray(state.labels)||state.labels.length!==6)state.labels=[...fresh.labels];
const weights=[85,110,125,180,210,235];
const sections=[{name:'Start with a problem',time:10,start:0},{name:'What AI means',time:15,start:4},{name:'Data and examples',time:15,start:9},{name:'How learning works',time:25,start:13},{name:'The ML workflow',time:15,start:19},{name:'Your first Python',time:20,start:22},{name:'Build and explain',time:20,start:28}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true;}catch(e){return false;}}
function sectionFor(i){return sections.filter(s=>s.start<=i).at(-1);}
function note(t){return '<div class="note">'+t+'</div>';}
function panel(title,text,classes=''){return '<article class="panel stack '+classes+'"><h3>'+title+'</h3><p>'+text+'</p></article>';}
function field(key,label,placeholder=''){return '<label>'+label+'<textarea class="answer" data-field="'+key+'" placeholder="'+esc(placeholder)+'">'+esc(state.worksheet[key]||'')+'</textarea></label>';}
function quiz(id,question,options,correct,why){const choice=state.answers[id];return '<div class="stack"><h3>'+question+'</h3><div class="choices">'+options.map((o,i)=>'<button data-quiz="'+id+'" data-choice="'+i+'" aria-pressed="'+(choice===i)+'">'+o+'</button>').join('')+'</div><div class="feedback '+(choice!==undefined&&choice!==correct?'bad':'')+'" id="feedback-'+id+'" aria-live="polite">'+(choice===undefined?'':(choice===correct?'Yes. ':'Try the reasoning again. ')+why)+'</div></div>';}
const quizData={automation:{correct:2,why:'A recommender using patterns in past viewing is a machine-learning example. A fixed timer and basic calculator follow predetermined operations; automation alone does not establish AI.'},split:{correct:1,why:'Unseen examples test whether the method can generalise. Repeating familiar examples mainly checks its performance on material it already has.'},choose:{correct:0,why:'A fixed rule is appropriate when the instruction is exact and reliable. Learning becomes useful when examples reveal patterns that are difficult to specify completely.'},exit1:{correct:1,why:'Machine learning uses examples to build a method for new cases. A programmer can also write rules directly; that is a different approach.'},exit2:{correct:2,why:'Labels are the known answers associated with training examples. They tell supervised learning what outcome each example represents.'},exit3:{correct:0,why:'A change in examples can change predictions. Check labels, representative coverage, and results on new cases before trusting the change.'}};
const slides=[
{title:'What if a computer could learn from examples?',kicker:'A practical first step',html:()=>'<div class="grid two cover-layout"><div class="stack"><h1>AI begins with<br>a good question.</h1><p class="lead">Today: solve a small problem, teach a tiny classifier, and write your first lines of Python.</p><div class="row"><span class="tag">No experience needed</span><span class="tag">2-hour class</span><span class="tag">Works offline</span></div><p class="muted">Bring curiosity. We will build the meaning before the code.</p></div><div class="panel dark cover-art"><div class="rings"><div class="seed"><span>AI</span></div><div class="orbit">Examples → patterns</div><div class="orbit right">Try · change · explain</div></div></div></div>'},
{title:'What you will be able to do',kicker:'Evidence of understanding',html:()=>'<div class="grid two">'+panel('Understand the idea','Explain AI, machine learning, and their relationship using a familiar example.')+panel('Work with examples','Identify a feature, a label, training data, and test data.')+panel('Make and inspect a prediction','Change a small classifier’s examples and explain what changes.')+panel('Begin programming','Store a value, display it, and explain the syntax in a tiny Python program.')+'</div>'+note('Success means: “I can explain why, predict what happens, and try a new example.”')},
{title:'Our two-hour route',kicker:'One idea builds on another',html:()=>'<div class="panel">'+sections.map((s,i)=>'<div class="agenda-row"><span class="muted">0'+(i+1)+'</span><button data-go="'+s.start+'">'+s.name+'</button><span class="time">'+s.time+' min</span></div>').join('')+'</div>'+note('Questions and practicals are included in these times. Try the practicals, explain your reasoning, and use the interactive feedback to check your understanding.')},
{title:'You are the message sorter',kicker:'Try before we define',html:()=>'<p class="lead">A class receives hundreds of messages. Which deserve a closer look?</p><div class="grid two">'+['“Can I borrow your class notes?”','“Win a FREE phone! Claim now!”','“Our library has free textbooks.”','“Your parcel is waiting. Pay the release fee.”'].map((m,i)=>'<button class="tile-button" data-message="'+i+'" aria-pressed="'+(state.answers['message'+i]===true)+'">'+m+'<br><span class="small muted">Tap to mark for review</span></button>').join('')+'</div>'+note('Discuss your reason. One word such as “free” cannot explain the whole message. We have limited context.')},
{title:'What is artificial intelligence?',kicker:'An idea, then a definition',html:()=>'<div class="grid two">'+panel('Everyday meaning','We build computer systems to perform tasks such as recognising patterns, reasoning through a problem, or generating useful content.','dark')+panel('A careful definition','AI is a field concerned with building systems that perform tasks involving abilities such as perception, reasoning, learning, and language.')+'</div><div class="flow">'+panel('Input','Information enters: a picture, a message, or observations.')+'<span class="flow-arrow">→</span>'+panel('Method','Rules, search, or a model process the information.')+'<span class="flow-arrow">→</span>'+panel('Output','A decision, prediction, action, or generated response.')+'</div>'+note('An AI system can make mistakes. Useful behaviour does not establish human-like understanding.')},
{title:'Where could you meet AI?',kicker:'Purpose and application',html:()=>'<div class="grid three">'+panel('Recognise','Speech-to-text converts audio into words. Ask: what happens with background noise?')+panel('Recommend','A learning-based recommender suggests films or products from patterns in data. Ask: whose preferences are represented?')+panel('Generate','A language model produces text from a prompt. Ask: how will we check the answer?')+'</div><div class="grid two">'+panel('Why use it?','A useful system may handle large amounts of information, find patterns, or support a repeated task.')+panel('What changes for people?','It may save time and change tasks. Errors, privacy, and uneven performance can affect the people using it.')+'</div>'},
{title:'Does automatic mean intelligent?',kicker:'Quick check · explain your choice',html:()=>quiz('automation','Which example clearly describes machine learning?',['A light switches on every day at 6 pm.','A calculator multiplies two numbers.','A system learns viewing patterns to recommend films.'],2,quizData.automation.why)},
{title:'Why learn from examples?',kicker:'The problem creates the need',html:()=>'<div class="grid two">'+panel('Write every rule','A programmer gives explicit instructions. This is useful when the required behaviour is clear and reliable.','soft')+panel('Use examples','A learning method uses examples to support predictions for new cases. This helps when useful patterns are hard to capture in a complete rule list.','green')+'</div>'+note('For a fruit sorter, “heavy means mango” may be useful—but a small mango and a large orange can break that rule.')+'<p class="lead">The next step is to test the idea on examples it has never seen.</p>'},
{title:'AI, machine learning, and types',kicker:'Keep the ideas connected',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>AI is the wider field.</h3><p>Machine learning is one approach within AI.</p><p>Deep learning is a part of machine learning using neural networks with multiple layers.</p><span class="tag">AI ⊃ machine learning ⊃ deep learning</span><p class="small muted">The symbol ⊃ means “contains”. Neural networks come in Session 2.</p></div><div class="stack">'+panel('Narrow AI','Designed for particular tasks. The examples in this class are narrow systems.')+panel('General AI / superintelligence','Broader human-level capability across tasks, or capability beyond humans. These are concepts, not achievements demonstrated by our toy systems.')+'</div></div><details><summary>Another classification you may meet</summary><p>Functional categories: reactive systems respond to current information; limited-memory systems also use some past information. “Theory of mind” and “self-aware” AI refer to proposed capabilities, not evidence that today’s systems have human mental states.</p></details>'},
{title:'Meet our fruit-sorting problem',kicker:'One small problem we can inspect',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>Goal</h3><p>Guess whether a fruit is an orange or a mango using its weight.</p><div class="row"><span class="fruit-shape" aria-label="Orange illustration"></span><span>Orange</span><span class="fruit-shape mango" aria-label="Mango illustration"></span><span>Mango</span></div><p class="small muted">Fictional classroom data. Real fruit weights overlap.</p></div><div class="stack">'+panel('What information can we measure?','Weight in grams. For example: 110 g.')+panel('What answer do we want?','A fruit name: Orange or Mango. The person who inspected each example supplies this answer.')+'</div></div>'+note('We chose one simple measurement so we can understand every decision. Weight alone cannot reliably identify all fruit.')},
{title:'Three words that unlock the example',kicker:'Vocabulary with a purpose',html:()=>'<div class="grid three">'+panel('Data','Recorded information. Our dataset contains several fruit examples and their observed weights.')+panel('Feature','An input characteristic the method uses. Here the feature is weight in grams.')+panel('Label','The known answer attached to an example. Here the label is its fruit name.')+'</div><div class="panel dark row between"><div><span class="eyebrow">One labelled example</span><p class="lead">110 g → Orange</p></div><div class="small">Feature value: 110 g<br>Label: Orange</div></div>'+note('A label is the observed answer, not the computer’s guess. A prediction is the computer’s proposed answer for a case.')},
{title:'Which part is which?',kicker:'Practice the meaning',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>A fruit record</h3><p class="big-number">180 g</p><p>Known fruit: Mango</p><p class="small muted">Choose what each piece of information represents.</p></div><div class="stack">'+quiz('feature','“180 g” is…',['A feature value','A label'],0,'Weight is information the method uses as input. Mango is the known answer, or label.')+quiz('label','“Mango” is…',['A program command','A label'],1,'It names the known fruit associated with the example.')+'</div></div>'},
{title:'What enters? What leaves?',kicker:'Trace one decision',html:()=>'<div class="flow">'+panel('New input','An unknown fruit weighs 150 g.')+'<span class="flow-arrow">→</span>'+panel('Compare','Look at the weights of known, labelled fruit.')+'<span class="flow-arrow">→</span>'+panel('Prediction','Use the label of the nearest example.')+'</div><div class="grid two">'+panel('Method / algorithm','A sequence of steps. Our method: compare distances, find the nearest known weight, use its label.')+panel('Model','The learned representation used to make predictions. For this simple method, the stored labelled examples are the representation.')+'</div>'+note('This nearest-neighbour method is deliberately simple. More complex methods learn different representations.')},
{title:'Three ways to use examples',kicker:'The kind of data changes the task',html:()=>'<div class="grid three">'+panel('Supervised','Examples include known answers. Learn how inputs relate to those answers.<br><br><b>Example:</b> weight + known fruit name.','green')+panel('Unsupervised','Examples have no answer labels. Look for structure such as groups of similar items.<br><br><b>Example:</b> group similar weights.')+panel('Semi-supervised','Use some labelled examples together with many unlabelled examples.<br><br><b>Example:</b> a few named fruit plus many unnamed measurements.')+'</div>'+note('Groups do not automatically tell us fruit names. Unlabelled data can help only under assumptions that need checking.')},
{title:'Teach our tiny fruit classifier',kicker:'Live lab · supervised learning',html:()=>'<div class="lab-layout"><p>Change the query weight. The method chooses the <b>nearest labelled example</b>. You can also change a training label.</p><div class="fruit-row">'+weights.map((w,i)=>'<div class="fruit-card" id="fruit-'+i+'"><span class="fruit-shape '+(state.labels[i]==='Mango'?'mango':'')+'" aria-hidden="true"></span><div class="weight">'+w+' g</div><select aria-label="Training label for '+w+' grams" data-label="'+i+'"><option'+(state.labels[i]==='Orange'?' selected':'')+'>Orange</option><option'+(state.labels[i]==='Mango'?' selected':'')+'>Mango</option></select></div>').join('')+'</div><div class="panel stack"><label for="queryWeight">New fruit weight: <b id="queryValue">'+state.query+' g</b></label><input id="queryWeight" type="range" min="70" max="260" step="1" value="'+state.query+'"><svg id="fruitChart" class="lab-chart" role="img" aria-label="Training weights and new query on a number line"></svg><div id="prediction" class="prediction" aria-live="polite"></div></div><div class="row"><button id="resetFruit">Restore original examples</button><span class="small muted">Browser computation · 1 nearest neighbour · no internet</span></div></div>'},
{title:'Remembering is not the whole test',kicker:'Evaluate on new examples',html:()=>'<div class="grid two"><div class="stack">'+panel('Training examples','The method already has these examples. Correct answers here may simply reflect recognising stored examples.')+panel('Held-out test examples','We reserved new cases. Their known labels are used to check the predictions, not to teach this model.')+'<button id="evaluateBtn" class="accent">Compare training and test results</button></div><div class="panel stack" id="testResults" aria-live="polite"><h3>Predict first</h3><p>Will a method that gets every training example right also get every new example right?</p><p class="small muted">Test set: 105 g, 190 g, 150 g, 225 g. Labels are revealed when you evaluate.</p></div></div>'+quiz('split','Why reserve unseen examples?',['To make the dataset look larger.','To check performance beyond familiar examples.','To guarantee the system will never make a mistake.'],1,quizData.split.why)},
{title:'Find a failure. Improve the idea.',kicker:'Mistakes teach us something',html:()=>'<div class="grid three">'+panel('Incomplete features','A small mango can resemble an orange in weight. What other measurement could help?')+panel('Incorrect labels','Changing a correct label can change a prediction. Who checks the examples?')+panel('Unrepresentative examples','If examples contain only large mangoes, what happens with small mangoes?')+'</div><div class="worksheet">'+field('improve','Your improvement: what would you change, and how would you test it?','Example: collect colour and shape, then reserve new fruit examples for testing.')+'</div>'+note('More data helps only when it is relevant and reasonably reliable. A useful improvement must be checked on new cases.')},
{title:'What if the names were missing?',kicker:'Live lab · unsupervised grouping',html:()=>'<p class="lead">These measurements have no fruit labels. Group neighbouring weights that are close together.</p><div class="panel stack"><label for="groupGap">Maximum gap between neighbours: <b id="gapValue">'+state.gap+' g</b></label><input id="groupGap" type="range" min="10" max="65" value="'+state.gap+'"><div class="group-list" id="groups" aria-live="polite"></div></div>'+note('This toy clustering method groups a chain of neighbouring weights. A group name such as “Group 1” does not identify a fruit species.')+'<p>Try 20 g, 35 g, then 60 g. Explain why the groups change.</p>'},
{title:'Some answers, many unnamed examples',kicker:'Semi-supervised learning',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>Imagine 1,000 fruit photos</h3><p>People have labelled 50. The remaining 950 have no names attached.</p><p>A semi-supervised method uses information from both sets.</p></div><div class="stack">'+panel('Why might this help?','Obtaining labels can take time. Unlabelled examples may reveal useful structure.')+panel('What assumption needs checking?','Similar-looking examples may share labels—but similarity can also mislead.')+'</div></div>'+note('Pair task: name another situation with a few known answers and many unlabelled examples. Explain one possible error.')},
{title:'A prediction needs a whole workflow',kicker:'From a useful question to useful behaviour',html:()=>'<div class="grid three">'+panel('01 · Define the problem','State the goal, inputs, desired output, and what counts as useful.')+panel('02 · Collect examples','Gather relevant, representative information and labels where needed.')+panel('03 · Prepare and split','Check errors, organise inputs, and reserve evaluation examples.')+panel('04 · Train','Apply the learning method to the training examples.')+panel('05 · Evaluate','Compare predictions with known answers on reserved cases.')+panel('06 · Use and review','Use it in the intended setting, monitor mistakes, and revisit earlier steps.')+'</div>'+note('Why a foundation? Each later step depends on decisions made earlier. A model cannot repair an unclear goal or unreliable labels by magic.')},
{title:'Put the workflow in order',kicker:'Interactive challenge',html:()=>'<div class="grid two"><div class="workflow-list" id="workflowList"></div><div class="panel dark stack"><h3>Build it from the foundations.</h3><p>Move each step using the up and down buttons. Then check the order.</p><button id="checkWorkflow">Check my order</button><div class="feedback" id="workflowFeedback" aria-live="polite"></div><p class="small muted">After deployment, errors can send us back to an earlier step. This exercise checks the first pass.</p></div></div>'},
{title:'Should we use machine learning?',kicker:'Choose the method for the problem',html:()=>'<div class="grid two">'+quiz('choose','A shop always gives 10% off purchases above a fixed amount. What is a sensible starting method?',['Write the exact discount rule.','Collect examples and train a model to guess the rule.'],0,quizData.choose.why)+panel('Compare a different task','The shop wants to forecast demand from past sales, seasons, and other relevant information. Here a learning method might help, but it needs useful data and evaluation.','dark')+'</div>'+note('Discuss: what data exists, what errors matter, and could a simple method already solve the task?')},
{title:'Before Python: give clear instructions',kicker:'Your first programming foundation',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>Human instruction</h3><p>“Remember this message, then show it.”</p></div><div class="panel stack"><h3>Program steps</h3><ol><li>Store the text under a name.</li><li>Tell the computer to display the value stored under that name.</li></ol></div></div>'+note('A program is a set of instructions. Python is a programming language with specific syntax: the rules for writing those instructions.')+'<p class="lead">We are learning to store and display information. This tiny program does not learn a model.</p>'},
{title:'A variable gives a value a name',kicker:'Why store information?',html:()=>'<pre class="code"><span class="var">message</span> = <span class="str">"Hello, AI!"</span></pre><div class="grid three">'+panel('message','A name we choose. It lets later instructions refer to the stored value.')+panel('=','Assignment: store the value on the right under the name on the left. It is not an equality question.')+panel('"Hello, AI!"','A string: a text value. Quotation marks show where that text starts and ends.')+'</div>'+note('Try explaining the whole line: “Store the text Hello, AI! under the name message.”')},
{title:'Run your first two lines',kicker:'Live coding · predict before running',html:()=>'<div class="grid two"><div class="stack"><label for="codeEditor">Change the message, then run:</label><textarea id="codeEditor" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off">'+esc(state.code)+'</textarea><div class="row"><button id="runCode" class="accent">Run example</button><button id="restoreCode">Restore example</button></div><p class="small muted">A limited teaching interpreter in this page: assignment, strings, numbers, and print(). It is not a complete Python runtime.</p></div><div class="stack"><h3>Output</h3><div id="codeOutput" class="console" aria-live="polite">'+esc(state.codeOutput||'Predict what will appear here.')+'</div>'+panel('Explain before you click','What is stored? Which instruction asks for output? Will the variable name itself be printed?')+'</div></div>'+note('In real Python: save these lines in a file named first_steps.py and run python first_steps.py in a terminal, after Python is installed. Your teacher can guide the setup.')},
{title:'Why are the symbols there?',kicker:'Tap each part to inspect its purpose',html:()=>'<div class="row" id="symbols">'+[['name','message'],['assign','='],['quotes','"text"'],['print','print'],['parens','(message)']].map(([id,text])=>'<button class="symbol" data-symbol="'+id+'" aria-pressed="false">'+esc(text)+'</button>').join('')+'</div><div class="panel detail stack" id="symbolDetail" aria-live="polite"><h3>Choose a piece of the program.</h3><p>We use a symbol because it has a job. Explain the job, then identify what breaks if it is missing.</p></div><pre class="code">message = "Hello, AI!"\nprint(message)</pre>'},
{title:'A mistake is a clue',kicker:'Debugging begins with a question',html:()=>'<div class="tabs"><button data-bug="quotes">Missing quote</button><button data-bug="name">Wrong name</button><button data-bug="output">Unexpected output</button></div><div id="bugDetail" class="grid two"></div>'+note('Read the error or output. Find the relevant line. Explain the cause. Change one thing and rerun.')},
{title:'Make it yours, then explain it',kicker:'Small independent code task',html:()=>'<div class="grid two"><div class="panel stack"><h3>Your task</h3><ol><li>Store your first name under the name student_name.</li><li>Display its value using print().</li><li>Add a second named text value about what you want to learn.</li><li>Display that value too.</li></ol><button data-go="24">Open the coding exercise →</button></div><div class="worksheet">'+field('codeReason','Explain: why do we use quotes, a variable, and print()?','Use your own words.')+'<details><summary>Hint</summary><p>Start with student_name = "Ada". Use print(student_name). Change Ada to your name.</p></details></div></div>'},
{title:'Design a small learning problem',kicker:'Independent challenge · 8 minutes',html:()=>'<p>Choose fruit sorting, classifying fictional messages, or another simple classroom task. Keep the examples fictional.</p><div class="worksheet grid two">'+field('problem','1. What problem and output do you want?','Example: predict whether an item is an orange or a mango.')+field('features','2. Which input features could help?','Name the measurements and explain why they might be useful.')+field('data','3. Write 6 examples with known labels.','Reserve 2 examples for testing; use the other 4 for training.')+field('testplan','4. How will you test it?','Describe an unusual case and explain why it matters.')+'</div><div class="row"><button id="downloadWork" class="primary">Download my worksheet</button><span class="saved" id="saveStatus">Answers are saved in this browser when storage is available.</span></div>'},
{title:'Teach the idea back',kicker:'Pair explanation · 3 minutes',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>Explain to a classmate</h3><p>“Our input is ___. Our label is ___. The method uses ___ to predict ___. We reserve new examples because ___.”</p></div><div class="panel stack"><h3>Your partner asks</h3><ul><li>Why did you choose that feature?</li><li>What if a label is wrong?</li><li>What example could fool the method?</li><li>When would a fixed rule be enough?</li></ul></div></div><div class="worksheet">'+field('reflection','One idea you understand now, and one question you still have:')+'</div>'},
{title:'Exit ticket: show the meaning',kicker:'Individual check · 5 minutes',html:()=>'<div class="grid three">'+quiz('exit1','What describes machine learning?',['A machine follows every rule we type.','A method uses examples to support predictions for new cases.'],1,quizData.exit1.why)+quiz('exit2','What is a training label?',['A file name.','The computer’s new guess.','The known answer for an example.'],2,quizData.exit2.why)+quiz('exit3','A new model behaves worse. What should you inspect?',['Examples, labels, and results on new cases.','Only whether the program runs.'],0,quizData.exit3.why)+'</div><div class="worksheet">'+field('exitWhy','Explain why perfect training results do not guarantee good results on new cases:')+'</div>'},
{title:'You have laid the first foundation.',kicker:'Continue with small, deliberate practice',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>What you built today</h3><p>A definition with examples. A small classifier you can inspect. A way to test its limits. Your first program.</p><p class="small muted">Next session: how neural networks combine information—and why their design matters.</p></div><div class="panel stack"><h3>Self-study · 75 minutes</h3><ul><li><b>30 min:</b> recreate and explain your Python example; change a value and fix one error.</li><li><b>45 min:</b> finish your dataset task, reserve test examples, and explain one failure.</li></ul><p class="small muted">Part of Self-study Block S1 (120 min). Its remaining 45 min follow Session 2.</p><button id="downloadFinal" class="primary">Download my work and reflection</button></div></div><div class="copyright">Aligned with the supplied Aptech Foundations of AI presenter’s outline, April 2026 v1.0. Original supplementary lesson; full textbook questions were not supplied.</div>'}

quizData.feature={correct:0,why:'Weight is information the method uses as input. Mango is the known answer, or label.'};quizData.label={correct:1,why:'It names the known fruit associated with the example.'};
const stage=document.getElementById('stage');let lastFocus=null,timerInterval=null,seconds=120*60,timerRunning=false;
function go(index){state.slide=Math.max(0,Math.min(slides.length-1,Number(index)||0));save();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const i=state.slide,s=slides[i],section=sectionFor(i);document.title='Session 01 · '+s.title;stage.innerHTML='<article class="slide '+(i===14?'compact-lab':'')+'"><div class="slide-head"><div class="section-label"><span class="rule"></span><span class="eyebrow">'+esc(s.kicker)+'</span></div>'+(i===0?'':'<h2>'+esc(s.title)+'</h2>')+'</div>'+s.html()+'</article>';document.getElementById('pageLabel').textContent=(i+1)+' / '+slides.length+' · '+section.name;document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===slides.length-1;document.getElementById('progressFill').style.width=((i+1)/slides.length*100)+'%';document.getElementById('progress').setAttribute('aria-valuenow',i+1);if(i===14)updateFruit();if(i===15&&state.evaluated)showTests();if(i===17)updateGroups();if(i===20)renderWorkflow();if(i===26)showBug('quotes');}
function nearest(query){let closest=0;for(let i=1;i<weights.length;i++)if(Math.abs(weights[i]-query)<Math.abs(weights[closest]-query))closest=i;return {index:closest,weight:weights[closest],label:state.labels[closest],distance:Math.abs(weights[closest]-query)};}
function updateFruit(){const q=Number(state.query),n=nearest(q);document.getElementById('queryValue').textContent=q+' g';document.getElementById('prediction').innerHTML='<span class="fruit-shape '+(n.label==='Mango'?'mango':'')+'" aria-hidden="true"></span><div><strong>Prediction: '+esc(n.label)+'</strong><div class="small">Nearest example: '+n.weight+' g · distance: '+n.distance+' g · use its label</div></div>';weights.forEach((w,i)=>document.getElementById('fruit-'+i).classList.toggle('closest',i===n.index));const svg=document.getElementById('fruitChart'),width=Math.max(250,svg.clientWidth),height=svg.clientHeight,baseline=height<80?22:32,x=w=>20+(w-70)/190*(width-40);svg.setAttribute('viewBox','0 0 '+width+' '+height);svg.setAttribute('aria-label','Training weights on a number line. The triangle marks the new fruit at '+q+' grams. Nearest example: '+n.weight+' grams.');svg.innerHTML='<line x1="20" x2="'+(width-20)+'" y1="'+baseline+'" y2="'+baseline+'" stroke="var(--line)" stroke-width="2"/>'+weights.map((w,i)=>'<circle cx="'+x(w)+'" cy="'+baseline+'" r="'+(i===n.index?9:6)+'" fill="'+(state.labels[i]==='Mango'?'#648034':'#c56820')+'"/><text x="'+x(w)+'" y="'+(i%2===0?baseline+20:baseline+36)+'" font-size="14" fill="var(--ink)" text-anchor="middle">'+w+'</text>').join('')+'<path d="M '+x(q)+' 12 l -7 -10 h 14 Z" fill="var(--accent)"/><line x1="'+x(q)+'" x2="'+x(q)+'" y1="13" y2="'+(baseline-5)+'" stroke="var(--accent)" stroke-dasharray="3 3"/>';}
function showTests(){const tests=[{w:105,label:'Orange'},{w:190,label:'Mango'},{w:150,label:'Mango'},{w:225,label:'Orange'}];let correct=0;const rows=tests.map(t=>{const p=nearest(t.w).label,ok=p===t.label;if(ok)correct++;return '<tr><td>'+t.w+' g</td><td>'+t.label+'</td><td>'+p+'</td><td>'+(ok?'✓ Match':'✕ Miss')+'</td></tr>';}).join('');const train=weights.filter((w,i)=>nearest(w).label===state.labels[i]).length;document.getElementById('testResults').innerHTML='<h3>Training: '+train+'/6 · New cases: '+correct+'/4</h3><table class="metric-table"><thead><tr><th>Weight</th><th>Known</th><th>Prediction</th><th>Result</th></tr></thead><tbody>'+rows+'</tbody></table><p class="small">150 g is a small mango; 225 g is a large orange. Similar weights can have different labels.</p>';}
function updateGroups(){const gap=Number(state.gap),groups=[[]];weights.forEach((w,i)=>{if(i&&w-weights[i-1]>gap)groups.push([]);groups.at(-1).push(w);});document.getElementById('gapValue').textContent=gap+' g';document.getElementById('groups').innerHTML=groups.map((g,i)=>'<div class="cluster stack"><h3>Group '+(i+1)+'</h3><div class="row">'+g.map(w=>'<span class="data-dot">'+w+' g</span>').join('')+'</div></div>').join('');}
const steps={problem:'Define the problem',collect:'Collect examples',prepare:'Prepare and split',train:'Train',evaluate:'Evaluate',use:'Use and review'};
function renderWorkflow(){document.getElementById('workflowList').innerHTML=state.workflow.map((k,i)=>'<div class="workflow-item"><b>'+(i+1)+'</b><span>'+steps[k]+'</span><button data-move="'+i+'" data-dir="-1" aria-label="Move '+steps[k]+' up" '+(i===0?'disabled':'')+'>↑</button><button data-move="'+i+'" data-dir="1" aria-label="Move '+steps[k]+' down" '+(i===5?'disabled':'')+'>↓</button></div>').join('');}
const symbolInfo={name:['message · the variable name','This name lets us refer to the stored value later. We choose a readable name and must use it consistently.','If you write print(mesage), Python cannot find the intended name.'],assign:['= · assignment','Store the value on the right under the name on the left. This line gives a value to message.','Removing = makes this assignment invalid. == asks an equality question; it does not perform this assignment.'],quotes:['Quotation marks · text boundaries','Matching quotes identify a string literal. The words inside them are data. The quotes themselves are not part of the output.','An unmatched quote leaves the text unfinished. print("message") prints the literal word message.'],print:['print · a built-in function','A function is a reusable operation. print displays the value supplied to it.','Storing a value alone does not ask for output. print(message) makes that value visible.'],parens:['(message) · an argument inside parentheses','The parentheses hold the information passed to print. Here that information is the value named message.','This Python call needs parentheses. print(message) displays the value; print("message") displays text.' ]};
const bugs={quotes:{code:'message = "Hello, AI!\nprint(message)',title:'Text never closes',detail:'The first quote starts a string. Without its matching end quote, Python cannot read the instruction correctly.',fix:'Add the closing quote after the exclamation mark.',output:'SyntaxError: unfinished string (simplified)'},name:{code:'message = "Hello, AI!"\nprint(mesage)',title:'The names do not match',detail:'You stored message but asked for mesage. They are different names.',fix:'Use print(message).',output:'NameError: mesage is not defined (simplified)'},output:{code:'message = "Hello, AI!"\nprint("message")',title:'It runs, but prints different text',detail:'Quotes turn message into literal text instead of a reference to the variable.',fix:'Remove the quotes inside print().',output:'message'}};
function showBug(id){const b=bugs[id];document.querySelectorAll('[data-bug]').forEach(btn=>btn.setAttribute('aria-pressed',btn.dataset.bug===id));document.getElementById('bugDetail').innerHTML='<div class="stack"><pre class="code">'+esc(b.code)+'</pre><div class="console">'+esc(b.output)+'</div></div><div class="panel stack"><h3>'+b.title+'</h3><p>'+b.detail+'</p><p><b>Fix:</b> '+b.fix+'</p></div>';}
function runTeachingCode(source){const env=Object.create(null),outputs=[],lines=source.replace(/\r/g,'').split('\n');function expression(raw,line){const v=raw.trim();if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'"))){const quote=v[0];if(v.length<2||v.slice(1,-1).includes(quote)||v.includes('\\'))throw new Error('Line '+line+': this teaching interpreter supports plain text with matching quotes; use real Python for escapes.');return v.slice(1,-1);}if(v.startsWith('"')||v.startsWith("'"))throw new Error('Line '+line+': SyntaxError — close the text with a matching quote.');if(/^-?\d+(\.\d+)?$/.test(v))return Number(v);if(/^[A-Za-z_]\w*$/.test(v)){if(Object.hasOwn(env,v))return env[v];throw new Error('Line '+line+': NameError — '+v+' has not been given a value.');}throw new Error('Line '+line+': unsupported expression. This page supports simple values and variable names.');}try{for(let i=0;i<lines.length;i++){const line=lines[i].trim();if(!line||line.startsWith('#'))continue;const assignment=line.match(/^([A-Za-z_]\w*)\s*=\s*(?!=)(.+)$/),print=line.match(/^print\((.*)\)$/);if(assignment)env[assignment[1]]=expression(assignment[2],i+1);else if(print)outputs.push(print[1].trim()?String(expression(print[1],i+1)):'');else throw new Error('Line '+(i+1)+': SyntaxError or unsupported instruction. Use name = value and print(value).');}return outputs.length?outputs.join('\n'):'No output. A value may be stored; use print() to display it.';}catch(e){return (outputs.length?outputs.join('\n')+'\n':'')+e.message;}}
const glossary=[['AI','A field concerned with systems that perform tasks involving abilities such as perception, reasoning, learning, and language.'],['Machine learning','An approach that uses examples to build a method for predictions or other data-driven behaviour.'],['Deep learning','Machine learning using neural networks with multiple layers; explored in Session 2.'],['Dataset','A collection of recorded examples.'],['Feature','An input characteristic a method uses, such as weight.'],['Label','A known answer associated with an example.'],['Prediction','An answer proposed by a model for a case.'],['Algorithm','A sequence of steps for performing a task.'],['Model','A representation used to make predictions; our toy method stores labelled examples.'],['Training','Applying a learning method to training examples.'],['Test data','Reserved examples used to evaluate predictions beyond training examples.'],['Supervised learning','Learning with examples that have known answer labels.'],['Unsupervised learning','Finding structure in examples without answer labels.'],['Semi-supervised learning','Using labelled and unlabelled examples together.'],['Generalisation','Performance on new cases beyond the familiar examples.'],['Variable','A name that refers to a stored value.'],['String','A text value, written with matching quotation marks in these examples.'],['Syntax','The rules for writing instructions in a programming language.'],['Function','A reusable operation; print() displays supplied information.'],['Argument','Information supplied to a function call.'],['Debugging','Investigating and correcting a program’s errors or unintended behaviour.']];
function download(){const parts=['FOUNDATIONS OF AI · SESSION 01','Student worksheet · '+new Date().toLocaleDateString(),''];const names={problem:'Problem and desired output',features:'Features and reasons',data:'Six labelled examples (four training, two test)',testplan:'Test plan and unusual case',improve:'Classifier improvement',codeReason:'Why the code is written this way',reflection:'Understanding and remaining question',exitWhy:'Why training success is not enough'};Object.entries(names).forEach(([k,label])=>parts.push(label+'\n'+(state.worksheet[k]||'[Not answered]')+'\n'));parts.push('MY CODE\n'+state.code+'\n','LAST TEACHING-INTERPRETER OUTPUT\n'+(state.codeOutput||'[Not run]')+'\n','QUICK CHECKS');Object.entries(quizData).forEach(([id,q])=>{const a=state.answers[id];parts.push(id+': '+(a===undefined?'not answered':a===q.correct?'correct':'review needed'));});const blob=new Blob([parts.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='session-01-my-worksheet.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openDrawer(type){lastFocus=document.activeElement;const drawer=document.getElementById('drawer'),title=document.getElementById('drawerTitle'),body=document.getElementById('drawerBody');drawer.hidden=false;if(type==='outline'){title.textContent='Session contents';body.innerHTML='<div class="panel stack"><div class="row between"><h3>Class timer</h3><b id="timerValue">'+formatTime()+'</b></div><div class="row"><button id="timerToggle">'+(timerRunning?'Pause':'Start')+'</button><button id="timerReset">Reset 120 min</button></div><p class="small muted">Optional pacing aid. It keeps counting while you navigate.</p></div>'+slides.map((s,i)=>'<button class="outline-button '+(i===state.slide?'current':'')+'" data-outline-go="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+esc(s.title)+'</button>').join('');}else{title.textContent='Word bank';body.innerHTML='<label for="wordSearch" class="small">Find a word</label><input id="wordSearch" type="text" placeholder="Feature, model, variable…"><div id="wordList">'+glossaryHTML('')+'</div>';}document.getElementById('closeDrawer').focus();}
function glossaryHTML(query){return glossary.filter(g=>g.join(' ').toLowerCase().includes(query.toLowerCase())).map(([word,meaning])=>'<div class="glossary-item"><b>'+word+'</b><p>'+meaning+'</p></div>').join('')||'<p>No matching word. Try another term.</p>';}
function closeDrawer(){document.getElementById('drawer').hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
function formatTime(){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function updateTimer(){const el=document.getElementById('timerValue');if(el)el.textContent=formatTime();const btn=document.getElementById('timerToggle');if(btn)btn.textContent=timerRunning?'Pause':'Start';}
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)return go(b.dataset.go);if(b.dataset.message!==undefined){const key='message'+b.dataset.message;state.answers[key]=!state.answers[key];b.setAttribute('aria-pressed',state.answers[key]);save();}if(b.dataset.quiz){const id=b.dataset.quiz,a=Number(b.dataset.choice);state.answers[id]=a;save();document.querySelectorAll('[data-quiz="'+id+'"]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.choice)===a));const f=document.getElementById('feedback-'+id),q=quizData[id];f.textContent=(a===q.correct?'Yes. ':'Try the reasoning again. ')+q.why;f.classList.toggle('bad',a!==q.correct);}if(b.id==='resetFruit'){state.labels=[...fresh.labels];save();render();}if(b.id==='evaluateBtn'){state.evaluated=true;save();showTests();}if(b.dataset.move!==undefined){const i=Number(b.dataset.move),j=i+Number(b.dataset.dir);if(j>=0&&j<6){[state.workflow[i],state.workflow[j]]=[state.workflow[j],state.workflow[i]];save();renderWorkflow();document.getElementById('workflowFeedback').textContent='';document.querySelector('[data-move="'+j+'"][data-dir="'+b.dataset.dir+'"]').focus();}}if(b.id==='checkWorkflow'){const correct=['problem','collect','prepare','train','evaluate','use'],ok=state.workflow.every((k,i)=>k===correct[i]),f=document.getElementById('workflowFeedback');f.textContent=ok?'Correct first pass. Now explain why we split before training and evaluate before use.':'Revisit the dependencies: define → collect → prepare and split → train → evaluate → use and review.';f.classList.toggle('bad',!ok);}if(b.id==='runCode'){state.code=document.getElementById('codeEditor').value;state.codeOutput=runTeachingCode(state.code);save();document.getElementById('codeOutput').textContent=state.codeOutput;}if(b.id==='restoreCode'){state.code=fresh.code;state.codeOutput='';save();render();}if(b.dataset.symbol){const info=symbolInfo[b.dataset.symbol];document.querySelectorAll('[data-symbol]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('symbolDetail').innerHTML='<h3>'+esc(info[0])+'</h3><p>'+esc(info[1])+'</p><p class="small muted">'+esc(info[2])+'</p>';}if(b.dataset.bug)showBug(b.dataset.bug);if(b.id==='downloadWork'||b.id==='downloadFinal')download();});
stage.addEventListener('input',e=>{const t=e.target;if(t.id==='queryWeight'){state.query=Number(t.value);save();updateFruit();}if(t.id==='groupGap'){state.gap=Number(t.value);save();updateGroups();}if(t.dataset.field){state.worksheet[t.dataset.field]=t.value;const stored=save(),s=document.getElementById('saveStatus');if(s)s.textContent=stored?'Saved in this browser. Download to keep a separate copy.':'Browser storage is unavailable. Download your worksheet before leaving.';}if(t.id==='codeEditor'){state.code=t.value;save();}});
stage.addEventListener('change',e=>{if(e.target.dataset.label!==undefined){state.labels[Number(e.target.dataset.label)]=e.target.value;save();render();}});
document.getElementById('prevBtn').onclick=()=>go(state.slide-1);document.getElementById('nextBtn').onclick=()=>go(state.slide+1);document.getElementById('outlineBtn').onclick=()=>openDrawer('outline');document.getElementById('glossaryBtn').onclick=()=>openDrawer('glossary');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('fullscreenBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fullscreenBtn').textContent='Use browser full screen';}};
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer();const b=e.target.closest('button');if(!b)return;if(b.dataset.outlineGo!==undefined){closeDrawer();go(b.dataset.outlineGo);}if(b.id==='timerToggle'){timerRunning=!timerRunning;if(timerRunning){timerInterval=setInterval(()=>{if(seconds>0)seconds--;else{timerRunning=false;clearInterval(timerInterval);}updateTimer();},1000);}else clearInterval(timerInterval);updateTimer();}if(b.id==='timerReset'){seconds=7200;timerRunning=false;clearInterval(timerInterval);updateTimer();}});
document.getElementById('drawer').addEventListener('input',e=>{if(e.target.id==='wordSearch')document.getElementById('wordList').innerHTML=glossaryHTML(e.target.value);});
document.addEventListener('keydown',e=>{const drawer=document.getElementById('drawer');if(e.key==='Escape'&&!drawer.hidden){closeDrawer();return;}if(!drawer.hidden){if(e.key==='Tab'){const els=[...drawer.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.slide-1);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(slides.length-1);}});
window.addEventListener('resize',()=>{if(state.slide===14)updateFruit();});
state.slide=Math.max(0,Math.min(slides.length-1,Number(state.slide)||0));render();

// Bright and dark themes share a local preference across the course.
function applyTheme(mode){const dark=mode==='dark';document.documentElement.dataset.theme=dark?'dark':'bright';const b=document.getElementById('themeBtn');if(b){b.textContent=dark?'☀ Bright theme':'☾ Dark theme';b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label','Switch to '+(dark?'bright':'dark')+' theme');}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#101c1c':'#f4f2e9';try{localStorage.setItem('aptech-ai-theme',dark?'dark':'bright');}catch(e){}}
let preferredTheme='bright';try{preferredTheme=localStorage.getItem('aptech-ai-theme')||'bright';}catch(e){}applyTheme(preferredTheme);
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'bright':'dark'));
</script>
