function requestResult(packet){if(!packet.model.trim())return {ok:false,text:'Demo error: choose a model ID.'};if(retired.includes(packet.model))return {ok:false,text:'Demo error: this course model ID is retired. Compare it historically, then choose the current documented example.'};if(!packet.input.trim())return {ok:false,text:'Demo error: provide a question in input.'};return {ok:true,id:'demo_response_1',text:mockExplain(packet.input)};}

function requestHTML(){return '<div class="lab05"><div class="stack"><div class="control05"><label class="field05">Model<select id="requestModel">'+[['gpt-6-astra','gpt-6-astra · docs example'],['gpt-3.5-turbo','gpt-3.5-turbo · retired'],['gpt-4-turbo-preview','gpt-4-turbo-preview · retired']].map(([v,n])=>'<option value="'+v+'" '+(state.requestModel===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label class="field05">Scripted topic<select id="requestTopic"><option value="custom">Custom input</option><option value="variable">Python variable</option><option value="api">API</option><option value="precision">Precision</option></select></label><label class="field05 wide">Instructions<textarea id="requestInstructions" maxlength="600">'+esc(state.requestInstructions)+'</textarea></label><label class="field05 wide">Input<textarea id="requestQuestion" maxlength="600">'+esc(state.requestQuestion)+'</textarea></label></div><div class="row"><button id="requestStep" class="accent">Next request step</button><button id="requestRun">Show all steps</button><button id="requestReset">Reset</button></div><p class="caption">Offline request simulation. No HTTP request, API key, billing, or AI model runs. Instructions appear in the packet but do not alter this canned answer.</p></div><div class="stack"><pre id="requestPacket" class="request05"></pre><div id="requestTrace" class="trace05"></div><p id="requestDetail" class="trace-detail05"></p><div id="requestOutput" class="output05" aria-live="polite"></div></div></div>';}
function updateRequest(){document.getElementById('requestTopic').value=/precision/i.test(state.requestQuestion)?'precision':/api/i.test(state.requestQuestion)?'api':/variable/i.test(state.requestQuestion)?'variable':'custom';const packet=requestPacket();document.getElementById('requestPacket').textContent=JSON.stringify(packet,null,2);document.getElementById('requestTrace').innerHTML=requestSteps.map((t,i)=>'<div class="trace-step05 '+(state.requestStep>i?'done':state.requestStep===i?'active':'')+'"><b>'+String(i+1)+'</b>'+t+'</div>').join('');document.getElementById('requestDetail').textContent=requestSteps[Math.min(4,state.requestStep)];const out=document.getElementById('requestOutput');if(state.requestStep<5){out.textContent='Predict the packet and response before completing the trace.';out.classList.remove('bad');}else{const r=requestResult(packet);state.requestOutput=r.text;save();out.classList.toggle('bad',!r.ok);out.innerHTML='<span>'+esc(r.text)+'</span><small>'+esc(r.ok?r.id+' · scripted output': 'Local demonstration error, not an API response')+'</small>';}document.getElementById('requestStep').disabled=state.requestStep>=5;}
const codeLines=[['from openai import OpenAI','Import the OpenAI client class from the installed openai package. from identifies the package. import brings a named tool into this file.'],['client = OpenAI()','Call the client constructor and store the client object. In this minimal live snippet, it reads OPENAI_API_KEY from the environment. Constructing a client alone does not generate an answer.'],['prompt = "Explain a Python variable in one sentence."','Assign a text string to the variable prompt. Quotation marks define the text. A meaningful variable name helps us reuse or change the value.'],['response = client.responses.create(','Follow the client’s responses interface and call its create method. The opening parenthesis begins the argument list. This is the line that starts the model request when real Python reaches it.'],['    model="gpt-6-astra",','Pass a named argument: model is the parameter name, the quoted value is a model ID. The comma separates it from the next argument. This is the current documentation example, not a promise of access or lowest price.'],['    instructions="Teach a beginner using simple words.",','Supply the intended behaviour separately from the user’s current task. Instructions have higher priority than conflicting input text, though outputs still need checking.'],['    input=prompt,','Pass the value stored in prompt. Without quotes, Python looks up the variable. input="prompt" would instead send the literal word prompt.'],['    max_output_tokens=512,','Set an upper bound on generated tokens, including reasoning tokens where applicable. It is a token count, not 512 words and not a guaranteed answer length.'],['    store=False,','Request that the response object not be saved for later retrieval. This does not mean every service log is disabled or that context is never retained by your application.'],[')','Close the argument list. Python allows a multiline call inside parentheses. Indentation here improves readability and differs from the required block indentation after if.'],['print(response.output_text)','Access the returned object’s text helper and display it. The full object contains more fields. A refusal or incomplete response may need separate handling.']];
function promptText(p){return [['Task',p.task],['Audience',p.audience],['Output format',p.format],['Provided facts',p.evidence],['Limits',p.constraints]].filter(([,v])=>v.trim()).map(([k,v])=>k+': '+v.trim()).join('\n\n');}
function promptChecks(p){return [['Task stated',Boolean(p.task.trim())],['Audience stated',Boolean(p.audience.trim())],['Format stated',Boolean(p.format.trim())],['Evidence supplied',Boolean(p.evidence.trim())],['Limits stated',Boolean(p.constraints.trim())]];}
function promptHTML(){return '<div class="lab05"><div class="stack"><div class="prompt-fields05">'+[['task','Task'],['audience','Audience'],['format','Output format'],['evidence','Provided facts'],['constraints','Limits']].map(([k,n])=>'<label class="field05 '+(k==='constraints'?'wide':'')+'">'+n+'<textarea data-prompt-field="'+k+'" maxlength="900">'+esc(state.prompt[k])+'</textarea></label>').join('')+'</div><div class="row"><button id="weakPrompt">Vague example</button><button id="strongPrompt">Clear example</button><button id="downloadPrompt" class="accent">Download prompt</button></div></div><div class="stack"><pre id="promptOutput" class="prompt-output05"></pre><div id="promptChecks" class="checklist05"></div><p class="caption">This checklist checks whether fields contain text. It does not measure a model’s answer quality or verify your evidence.</p></div></div>';}
function updatePrompt(){document.getElementById('promptOutput').textContent=promptText(state.prompt)||'Add a task and relevant details.';document.getElementById('promptChecks').innerHTML=promptChecks(state.prompt).map(([n,v])=>'<div class="check-item05 '+(v?'pass':'')+'">'+(v?'✓ ':'○ ')+n+'</div>').join('');}
const examples=[{topic:'BOOKING',input:'Please reserve Lab 2.'},{topic:'HOURS',input:'When does the lab open?'},{topic:'SAFETY',input:'Is safety training required?'}];
const fewInputs={booking:'Can you book a practice slot tomorrow?',hours:'At what time does Lab 2 close?',safety:'Do I need safety training for entry?',unknown:'Can I bring a guest?'};
function topicFor(text){return /safety|training/i.test(text)?'SAFETY':/when|time|open|close|hours/i.test(text)?'HOURS':/book|reserve|slot/i.test(text)?'BOOKING':'UNKNOWN';}
function scriptedLabel(text,labels,useExamples=true){const topic=topicFor(text);return !useExamples?'This seems to be a '+topic.toLowerCase()+' question.':topic==='UNKNOWN'?'UNKNOWN':labels[topic];}
function fewPacket(){const messages=state.useExamples?examples.flatMap(e=>[{role:'user',content:e.input},{role:'assistant',content:state.fewLabels[e.topic]}]):[];messages.push({role:'user',content:fewInputs[state.fewQuestion]});return messages;}
function fewHTML(){return '<div class="lab05"><div class="stack"><h3>Example inputs and outputs</h3><div class="few-demo05">'+examples.map(e=>'<label class="few-row05"><span>'+e.input+'<small>Example topic: '+e.topic+'</small></span><select data-few-label="'+e.topic+'">'+['BOOKING','HOURS','SAFETY','UNKNOWN'].map(v=>'<option value="'+v+'" '+(v===state.fewLabels[e.topic]?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</div><label class="row"><input id="useExamples" type="checkbox" '+(state.useExamples?'checked':'')+'> Include these examples</label><label class="field05">New input<select id="fewQuestion">'+Object.entries(fewInputs).map(([k,v])=>'<option value="'+k+'" '+(k===state.fewQuestion?'selected':'')+'>'+v+'</option>').join('')+'</select></label><button id="fewRun" class="accent">Show scripted classification</button><p class="caption">The stand-in uses visible keyword rules and your example-label mapping. It is not a language model. Real few-shot results can differ.</p></div><div class="stack"><pre id="fewPacket" class="request05"></pre><div id="fewOutput" class="output05" aria-live="polite">'+esc(state.fewOutput||'Predict a label before showing it.')+'</div></div></div>';}
function updateFew(){document.getElementById('fewPacket').textContent='[\n'+fewPacket().map(m=>'  '+JSON.stringify(m)).join(',\n')+'\n]';}
function validateJSON(text,expected='HOURS'){let obj;try{obj=JSON.parse(text);}catch(e){return {syntax:false,schema:false,meaning:false,message:'JSON syntax failed. Use double quotes, balanced braces, and no trailing comma.'};}if(!obj||Array.isArray(obj)||typeof obj!=='object'||Object.keys(obj).length!==1||!Object.hasOwn(obj,'label')||!['BOOKING','HOURS','SAFETY','UNKNOWN'].includes(obj.label))return {syntax:true,schema:false,meaning:false,message:'JSON syntax passed. Shape failed: use exactly one key, label, with an allowed label.'};const meaning=obj.label===expected;return {syntax:true,schema:true,meaning,message:'JSON syntax passed. Allowed shape passed. '+(meaning?'Meaning matches the hours question.':'Meaning failed: this hours question should have label HOURS.')};}
function jsonHTML(){return '<div class="lab05"><div class="stack"><p>Question: “At what time does Lab 2 close?”</p><textarea id="jsonEditor" class="json-editor05" spellcheck="false" aria-label="JSON to validate">'+esc(state.jsonText)+'</textarea><div class="tabs05"><button data-json-example="correct">Correct</button><button data-json-example="syntax">Trailing comma</button><button data-json-example="shape">Wrong key</button><button data-json-example="meaning">Wrong meaning</button></div><button id="validateJSON" class="accent">Check syntax, shape, and meaning</button></div><div class="stack"><div id="jsonResult" class="output05" aria-live="polite">'+esc(state.jsonOutput||'Predict which checks should pass.')+'</div>'+panel('Three different checks','A response can be valid JSON while using the wrong fields or giving the wrong answer.')+sourceLink('structured','Further reading: Structured Outputs')+'</div></div>';}
function historyMessages(name){return [{role:'user',content:'My name is '+name+'.'},{role:'assistant',content:'Thanks. I will use that name in this conversation.'},{role:'user',content:'Greet me by name.'}];}
function historyAnswer(messages){let name=null;for(const m of messages){if(m.role==='user'){const found=m.content.match(/^My name is (.+)\.$/);if(found)name=found[1];}}return name?'Hello, '+name+'!':'What name would you like me to use?';}
function historyHTML(){return '<div class="lab05"><div class="stack"><label class="field05">First-turn name<input id="studentName" type="text" maxlength="60" value="'+esc(state.studentName)+'"></label><div id="historyMessages" class="history-log05"></div><label class="row"><input id="includeHistory" type="checkbox" '+(state.includeHistory?'checked':'')+'> Send the earlier two messages with the follow-up</label><button id="historyRun" class="accent">Show scripted follow-up</button><p class="caption">A scripted illustration of supplied context. It reads the name from the included user message. This is not a model or persistent personal memory.</p></div><div class="stack"><h3>What this request includes</h3><pre id="historyPacket" class="request05"></pre><div id="historyOutput" class="output05" aria-live="polite">'+esc(state.historyOutput||'Will the new request contain the name?')+'</div></div></div>';}
function updateHistory(){const all=historyMessages(state.studentName||'Amina'),sent=state.includeHistory?all:all.slice(-1);document.getElementById('historyMessages').innerHTML=all.map((m,i)=>'<div class="history-item05 '+(m.role==='user'?'user ':'')+(!state.includeHistory&&i<2?'excluded':'')+'"><b>'+m.role+(i<2&&!state.includeHistory?' · excluded from this request':'')+'</b>'+esc(m.content)+'</div>').join('');document.getElementById('historyPacket').textContent='[\n'+sent.map(m=>'  '+JSON.stringify(m)).join(',\n')+'\n]';}
function contextBudget(turns){const input=40+80*turns,reserved=160,windowSize=1024,total=input+reserved;return {input,reserved,total,windowSize,remaining:windowSize-total,overflow:total>windowSize};}
function contextHTML(){return '<div class="stack"><label class="field05" for="contextTurns">Conversation turns in this fictional example: <output id="contextTurnsValue"></output><input id="contextTurns" type="range" min="0" max="20" step="1" value="'+state.contextTurns+'"></label><div id="contextStats" class="context-stats05"></div><div class="meter05" id="contextMeter"><div id="contextFill"></div></div><div id="contextResult" class="output05" aria-live="polite"></div><p class="caption">Toy budget: 40 instruction tokens, 80 per turn, 160 reserved output/reasoning tokens, 1,024 total capacity. These are fictional counts, not a current OpenAI model’s limits.</p></div>';}
function updateContext(){const b=contextBudget(state.contextTurns);document.getElementById('contextTurnsValue').textContent=state.contextTurns;document.getElementById('contextStats').innerHTML=[['Input budget',b.input],['Output reserved',b.reserved],['Capacity remaining',b.remaining]].map(([n,v])=>'<div class="context-stat05">'+n+'<b>'+v+'</b></div>').join('');document.getElementById('contextFill').style.width=Math.min(100,b.total/b.windowSize*100)+'%';document.getElementById('contextMeter').classList.toggle('over',b.overflow);const f=document.getElementById('contextResult');f.classList.toggle('bad',b.overflow);f.textContent=b.overflow?'The toy request exceeds its budget. Select relevant context or summarise carefully before sending.':'The toy request fits. Sending a larger history still uses more input tokens.';}
const evaluationCases=[{input:'Could I reserve a place in Lab 2?',expected:'BOOKING'},{input:'Tell me the opening hours.',expected:'HOURS'},{input:'Must I complete the safety course?',expected:'SAFETY'},{input:'Is there a visitor fee?',expected:'UNKNOWN'}];
function evaluateLabels(labels,useExamples){const rows=evaluationCases.map(t=>{const actual=scriptedLabel(t.input,labels,useExamples);return {...t,actual,correct:actual===t.expected,format:['BOOKING','HOURS','SAFETY','UNKNOWN'].includes(actual)};});return {rows,correct:rows.filter(r=>r.correct).length,format:rows.filter(r=>r.format).length,total:rows.length};}

{title:'A variable holds a value',kicker:'Why quotes change what print displays',html:variableHTML,notes:'4 minutes. Initially topic stores Python variables. print(topic) displays the value; print("topic") displays the word topic. The browser illustrates exactly those statements using local code. A valid Python identifier cannot start with a digit or contain spaces. The bundled string_foundations.py is real Python with no SDK dependency.'},
{title:'Lists, dictionaries, and method calls',kicker:'The shapes used for conversation input',html:()=>'<div class="grid two"><div class="panel stack"><h3>One message is a dictionary</h3><pre class="code">message = {\n    "role": "user",\n    "content": "Hello"\n}</pre><p>Keys name the fields. Colons connect keys to values. Commas separate entries.</p></div><div class="panel stack"><h3>A conversation is a list</h3><pre class="code">history = [message]\nhistory.append({\n    "role": "user",\n    "content": "Tell me more"\n})</pre><p>Square brackets make an ordered list. append adds one item at the end.</p></div></div>'+note('A dot selects an attribute or method on an object. Parentheses call a method, such as history.append(...).'),notes:'5 minutes. Reconnect lists and .extend/.pop from Session3. Dictionaries add named fields, unlike positional list values. message is a variable that refers to a dictionary. The user role marks supplied messages, not all-powerful application instructions. Advanced response output items have richer shapes than this beginner text-only history.'},
{title:'The smallest request worth understanding',kicker:'Real Python syntax · read before running',html:()=>'<div class="lab05"><pre class="code">'+esc(CORE_CODE)+'</pre><div class="stack">'+panel('Before this live snippet runs','Install the SDK and set OPENAI_API_KEY privately. The downloadable version supplies an offline stand-in by default.')+panel('After the request','The returned response is an object. output_text provides its text output for this simple workflow.')+sourceLink('reference','Responses API field reference')+'</div></div>'+note('Change one thing at a time. Predict the request’s contents before predicting the answer.'),notes:'4 minutes. This displayed snippet uses the real SDK. No code is executed by displaying it. It needs a real key in the environment if run directly. Recommend the bundle’s default offline version first. max_output_tokens512 is a teaching bound, not an exact cost promise, and can produce incomplete output. The runner uses low reasoning effort for supported GPT6 models and checks response status.'},
{title:'A request packet you can inspect',kicker:'Interactive simulation · follow the values',html:requestHTML,notes:'6 minutes. First inspect model, instructions, input, token bound, and store flag. Then step through the trace. Model processing and transport are simulated. Changing instructions shows the packet change but does not cause genuine inference. Choose either legacy ID to demonstrate the local retired-model error. Empty input also raises a local example error. Do not interpret these as observed HTTP errors.'},
{title:'Constructing a client and sending a request',kicker:'Each operation has a different effect',html:()=>'<div class="grid three">'+panel('Import','Makes the SDK’s OpenAI class available in this Python file.')+panel('Construct','OpenAI() creates a client object configured for the service.')+panel('Call','client.responses.create(...) sends the model request when real Python runs it.')+'</div>'+note('Assigning a new prompt does not automatically send another request. The program must call create again.'),notes:'3 minutes. Ask students to point to the exact call that triggers remote generation. Python function calls evaluate argument expressions before making the call. The response assignment stores the returned object after the synchronous call finishes. Networking can fail or take time.'},
{title:'The returned object has useful fields',kicker:'Text, identity, status, and usage',html:()=>'<table class="small-table"><thead><tr><th>Field</th><th>Why inspect it?</th></tr></thead><tbody><tr><td>response.output_text</td><td>Read the text helper for the simple text example.</td></tr><tr><td>response.id</td><td>Identify a response or link supported conversation state.</td></tr><tr><td>response.status</td><td>Check completion, failure, or incomplete output.</td></tr><tr><td>response.usage</td><td>Inspect actual token usage when reported.</td></tr></tbody></table>'+note('The full output can include richer items. A plain text helper does not replace checking refusals, errors, or tool outputs.')+sourceLink('reference','Official response object reference'),notes:'3 minutes. Do not assume output[0] is always the final assistant text. Text-only examples can use output_text. The runner handles incomplete or empty output with a clear message, while production software may need richer status and item processing. Tokens and billing come from actual usage and applicable pricing, not the canned browser response.'},
{title:'Why each line has that form',kicker:'Interactive line-by-line explanation',html:()=>'<div class="line-buttons05">'+codeLines.map((_,i)=>'<button data-code-line="'+i+'" aria-pressed="'+(i===0)+'">Line '+(i+1)+'</button>').join('')+'</div><div id="lineDetail" class="panel stack token-detail05"><pre class="code">'+esc(codeLines[0][0])+'</pre><p>'+codeLines[0][1]+'</p></div>'+note('Explain the quotes, dots, parentheses, commas, and equals signs. Each symbol changes how Python reads the request.'),notes:'4 minutes. Focus on input=prompt versus input="prompt", parameter names versus model string values, and multiline parentheses. The import name OpenAI is case-sensitive. A misspelled keyword argument can raise an error before or during request handling. The token limit includes reasoning, so it is not a word limit.'},
{title:'A prompt describes the task',kicker:'Purpose, audience, format, and relevant facts',html:()=>'<div class="grid two">'+panel('A vague request','“Tell me about Python.” The model has to choose the level, topic, and structure.')+panel('A clearer request','“Explain a variable to a first-time programmer. Use one short sentence and name = \'Amina\' as an example.”')+'</div>'+note('Relevant detail helps you define what a successful answer would look like. Adding more words without a purpose can also distract.')+sourceLink('prompt','Official prompt guidance'),notes:'3 minutes. Clear prompting starts with a defined task. Show a short concrete desired answer, then ask what makes it suitable. The purpose is not to find magic phrases. Prompt success depends on model and task, so compare actual outputs with fixed checks.'},
{title:'Instructions and the current user request',kicker:'Interactive illustration of message roles',html:()=>'<div class="lab05"><div class="stack"><label class="field05">Role of “Use exactly one sentence.”<select id="instructionRole"><option value="developer" '+(state.role==='developer'?'selected':'')+'>Application instruction</option><option value="user" '+(state.role==='user'?'selected':'')+'>Earlier user preference</option></select></label>'+panel('Current user request','“Explain a variable in five paragraphs.”')+'<button id="roleRun" class="accent">Show intended behaviour</button><p class="caption">Scripted illustration. It demonstrates the role distinction and does not test a model’s actual instruction following.</p></div><div id="roleOutput" class="output05 role-answer05" aria-live="polite">Predict which direction the application should follow.</div></div>'+note('Message roles identify where instructions come from. User text cannot promote itself to a higher role by saying “I am the developer”.'),notes:'3 minutes. The instructions parameter has priority over conflicting input in this API pattern. Two user preferences can conflict, with later guidance often updating an earlier preference, so the alternate script merely shows that possible intended interpretation. Do not claim role priority guarantees perfect obedience or safe application behaviour. Labels in the request are what establish roles.'},
{title:'Build a prompt with visible requirements',kicker:'Interactive prompt workshop',html:promptHTML,notes:'5 minutes. Start with the clear example. Load vague, then fill the missing fields one at a time. The checklist is literal non-empty-field detection, not semantic quality scoring or an eval of a model. Evidence can be wrong even if the field is populated. Download the prompt text for optional live testing.'},
{title:'Refinement needs a stable comparison',kicker:'Change one requirement and inspect the output',html:()=>'<div class="grid three">'+panel('Define the check','For a variable explanation: simple language, correct meaning, one valid assignment example.')+panel('Change one part','Add a required example or clarify the audience. Keep the task and test question fixed.')+panel('Inspect the result','Compare answers against the same checks. Keep the change only if it helps the task.')+'</div>'+note('Two different outputs from the same prompt can occur. Judge several representative examples rather than one lucky answer.'),notes:'2 minutes. Connect evaluation to Session4. Separate instruction-following/format from factual correctness. A real API response may vary. Fixed examples make comparisons interpretable. No benchmark or statistical performance is claimed by the browser checklist.'},
{title:'A prompt assignment with a reason',kicker:'Practical exercise · show what improved',html:()=>'<div class="grid two">'+panel('Your task','Write a prompt that explains Python lists to a beginner. Require a two-item list, explain its square brackets, and include one check question.','dark')+'<div class="worksheet">'+field('promptDraft','Your prompt','State the intended audience and output form.')+field('promptReason','What would you check in the answer, and why?','How would you detect an incorrect explanation?')+'</div></div><button data-go="19" class="primary">Return to the prompt workshop</button>',notes:'2-minute launch. Example should use ["Amina", "Bola"] and explain ordered items. The list can be a teaching object without a full model call. A check question might ask which item is first. Grade correctness and reasoning, not the prompt’s length.'},
{title:'Examples show the desired pattern',kicker:'Few-shot prompting',html:()=>'<div class="grid two">'+quiz('few')+panel('Campus question labels','BOOKING for reserving a slot, HOURS for opening times, SAFETY for training requirements, UNKNOWN for other requests.')+'</div>'+note('Examples belong in the request context. Keep input/output pairs correct and show a useful range of cases.')+sourceLink('prompt','Official few-shot guidance'),notes:'3 minutes. Zero-shot describes no demonstrations, one-shot one, few-shot several. They can steer task style or format without modifying weights. Context is still finite and not a guarantee of generalisation. Here the labels are a deliberately simple fictional taxonomy.'},
{title:'An example can help or mislead',kicker:'Interactive few-shot stand-in',html:fewHTML,notes:'5 minutes. Start correct and show HOURS. Change the hours example’s output to BOOKING: the transparent stand-in maps a new hours input to that bad label. That illustrates how incorrect demonstrations can steer behaviour, but does not predict exact LLM behaviour. The no-example branch intentionally returns prose to illustrate format mismatch, not to claim zero-shot models cannot output labels. Actual model tests should compare identical instructions with and without examples.'},
{title:'Formatted output still needs a meaning check',kicker:'Interactive JSON validation',html:jsonHTML,notes:'4 minutes. Correct JSON passes3checks. Trailing comma fails syntax. Wrong key fails shape. BOOKING label passes syntax/shape but fails the hours meaning. Structured Outputs can enforce supported schema constraints with appropriate API configuration; merely requesting JSON in a prompt does not enable schema enforcement. The bundled few-shot script validates an allowed plain-text label for simpler practice.'},
{title:'Few-shot code uses ordered messages',kicker:'Read the input/output pattern',html:()=>'<div class="lab05"><pre class="code">examples = [\n    {"role": "user", "content": "When is the lab open?"},\n    {"role": "assistant", "content": "HOURS"},\n]\nexamples.append({\n    "role": "user",\n    "content": "At what time does Lab 2 close?"\n})\nresponse = client.responses.create(\n    model=model, instructions=rules,\n    input=examples, store=False\n)\nprint(response.output_text)</pre><div class="stack">'+panel('Why these roles?','The user messages show example inputs. The assistant messages show desired outputs. The final user message is the new task.')+panel('Why this order?','Each output follows its corresponding example input. The new input comes after the demonstrations.')+'</div></div>'+note('The complete bundle provides three examples, a token limit, and output validation.'),notes:'3 minutes. model and rules here are previously defined variables in the complete file. They are not special Python keywords. The example assistant role provides a demonstration; it is not a live response generated during list construction. .append adds the new user task. This text-only list is accepted by Responses input.'},
{title:'A follow-up needs supplied context',kicker:'Conversation flow is an application choice',html:()=>'<div class="grid two">'+quiz('history')+panel('Two separate questions','First: “My name is Amina.” Later: “Greet me by name.” The follow-up contains no name by itself.','dark')+'</div>'+note('Relevant history can resolve a pronoun, reference, or preference. Send only the context needed for the task.'),notes:'2 minutes. Models do not automatically access arbitrary Python variables or earlier independent calls. Passing a linked response ID or using conversation state is a deliberate application action. History can contain irrelevant or incorrect content, so selection and checking matter.'},
{title:'What does this follow-up actually receive?',kicker:'Interactive context experiment',html:historyHTML,notes:'4 minutes. Include history then show greeting. Exclude it: the name is absent from the packet and the stand-in asks which name. Change the first-turn name then re-run. The stand-in scans exact supplied user messages, not a model. Real generation may require instructions to avoid guessing missing information.'},
{title:'Send a text conversation explicitly',kicker:'Real Python pattern · keep the ordered list',html:()=>'<div class="lab05"><pre class="code">history = [{"role": "user", "content": "My name is Amina."}]\nfirst = client.responses.create(\n    model=model, instructions=rules,\n    input=history, store=False\n)\nhistory.append({"role": "assistant",\n                "content": first.output_text})\nhistory.append({"role": "user",\n                "content": "Greet me by name."})\nsecond = client.responses.create(\n    model=model, instructions=rules,\n    input=history, store=False\n)</pre><div class="stack">'+panel('The application keeps history','The list lives in your Python program. Each independent call receives the selected text messages.')+panel('This is a simple text lesson','Advanced tools and reasoning outputs can require richer output items. This example keeps a small text exchange.')+'</div></div>',notes:'3 minutes. Explain first.output_text becomes a new assistant message. Then append follow-up and call create again. rules are provided on each call. store=False disables saving response objects for retrieval, not all service logging. This simple manual text history is deliberately scoped, and the complete bundle checks response completion before appending output.'},
{title:'Link to a previous response',kicker:'A supported alternative to resending a text list',html:()=>'<div class="lab05"><pre class="code">first = client.responses.create(\n    model=model, instructions=rules,\n    input="My name is Amina.", store=True\n)\nsecond = client.responses.create(\n    model=model, instructions=rules,\n    previous_response_id=first.id,\n    input="Greet me by name.", store=True\n)\nprint(second.output_text)</pre><div class="stack">'+panel('What the ID does','Links the new request to supported prior response context.')+panel('What you must repeat','Previous instructions are not carried over through previous_response_id. Supply them again if they should still apply.')+sourceLink('history','Official conversation state guidance')+'</div></div>'+note('Stored response objects support later retrieval or linking. Review data-retention settings. Linking prior context still uses input tokens.'),notes:'2 minutes. This example explicitly store=True and may send2live requests. Context is provided by the linked response, not by the application merely remembering the id locally. previous_response_id cannot be combined with conversation. No Conversations API is needed for this beginner example. The bundle supplies offline stand-in and optional live chain.'},
{title:'Managing a conversation step by step',kicker:'Keeping history clear and useful',html:()=>'<div class="grid three">'+panel('Add the user turn','Record the new message and its user role.')+panel('Request and inspect','Send selected context. Check for an error, refusal, or incomplete answer.')+panel('Keep the useful result','Record the assistant output, or continue with a supported response link.')+'</div>'+note('A fresh conversation should start with fresh context. Keep one student’s history separate from another student’s session.'),notes:'2 minutes. Session boundaries are application design. Do not leak one learner’s conversation into another. For a command-line two-turn exercise, an ordered local list is enough. In a larger app, persist and retrieve per-user or per-session history carefully.'},
{title:'Context has a finite budget',kicker:'Interactive token-budget illustration',html:contextHTML,notes:'2 minutes. The capacity1024 and token counts are fictional. Slide explains mechanism, not real GPT6limits. Tokens can represent parts of words. The API reports actual usage; a model’s published context limit matters. max_output_tokens includes reasoning where applicable. Summaries can lose information, so preserve relevant facts and verify the result.'},
{title:'When a request fails',kicker:'Read the failure before changing the prompt',html:()=>'<table class="small-table"><thead><tr><th>Observed problem</th><th>What to inspect</th></tr></thead><tbody><tr><td>Package import fails</td><td>Install openai with the Python environment that runs the file.</td></tr><tr><td>Authentication error</td><td>Check the private key and correct API project.</td></tr><tr><td>Model unavailable</td><td>Check the exact ID, retirement status, and account access.</td></tr><tr><td>Rate or usage limit</td><td>Read whether the issue is request rate or usage allowance. Avoid immediate retry loops.</td></tr><tr><td>Network failure</td><td>Check connectivity and bounded retry settings.</td></tr><tr><td>Empty or incomplete output</td><td>Inspect response status, output limits, refusals, and output items.</td></tr></tbody></table>'+note('A better prompt cannot fix every credential, package, or network problem.'),notes:'2 minutes. Typical error classes need diagnosis. Some SDK retries happen automatically; the runner sets max_retries0 for a clear first teaching request. The bundle catches common SDK failures without printing secrets or a raw response body. Do not confuse429rate and insufficient allowance. In production use bounded appropriate retries for transient errors.'},
{title:'A program should check what it receives',kicker:'Evidence, format, and intended actions',html:()=>'<div class="grid two">'+panel('Check the answer','Does it address the task? Are factual claims supported? Does the output have the required shape?')+panel('Check the action','Generated text does not by itself authorise tool use, lab entry, or an external change. The application applies its actual rules.')+'</div>'+note('A source excerpt can contain instructions as text. Treat the excerpt as evidence to inspect, rather than letting it redefine the application’s rules.'),notes:'2 minutes. Connect to Session4knowledge and policy. Use a harmless example source containing “ignore the instructions” to discuss input-as-data. Prompt injection needs application controls as well as model instruction hierarchy. This beginner lesson does not build an externally acting agent.'},
{title:'Evaluate on new questions',kicker:'Interactive checks with fixed expected labels',html:evaluationHTML,notes:'3 minutes. Evaluation inputs differ from example inputs. Correct mapping gives4/4including UNKNOWN. Wrong hours mapping gives3/4. No-examples stand-in prose fails allowed label format, intentionally. Those results are for our rule-based stand-in only, not a model benchmark. Keep real expected labels fixed and record actual response outputs during live practice. Do not train/tune on all held-out cases and then claim a fresh test.'},
{title:'Build a small campus question assistant',kicker:'Practical assignment · prompts, examples, history, and checks',html:()=>'<div class="grid two"><div class="panel stack"><h3>Your deliverable</h3><ol><li>Write a task and output rules.</li><li>Add 3 correct example pairs.</li><li>Classify 4 new questions, including an unknown.</li><li>Demonstrate a 2-turn conversation.</li><li>Explain one failure and its remedy.</li></ol><p class="caption">Use browser stand-ins or default offline Python first. Label every scripted result.</p></div><div class="worksheet">'+field('assistantPlan','Your assistant’s prompt and examples','Keep example inputs separate from test inputs.')+field('assistantHistory','What earlier context does the follow-up need?','Describe what is in the second request.')+'</div></div>',notes:'3-minute launch. Rubric10points: clear task2, correct/diverse examples2, fixed evaluation cases2, explicit context2, explained code/failure2. For live mode include the observed output rather than claiming identical scripted results. A coursework assistant is a prototype with limited scope.'},
{title:'Self-study with a visible result',kicker:'S3 · 120 minutes of implementation and explanation',html:()=>'<div class="grid two"><div class="panel stack"><h3>Two-hour practice plan</h3><ul><li>20 min: run the string and first-request exercises.</li><li>30 min: improve and test a prompt.</li><li>30 min: few-shot labels and 4 held-out cases.</li><li>25 min: conversation with and without context.</li><li>15 min: explain failures and submit results.</li></ul></div><div class="panel stack"><h3>What you submit</h3><p>Your code changes, prompt, example pairs, observed or scripted outputs, and explanations.</p><button id="downloadWork" class="primary">Download my worksheet</button><a href="session-05-python.zip" download>Download the complete Python bundle</a><p class="caption">Default Python runs need no API key or SDK. Optional live runs need separate API access.</p></div></div>',notes:'1minute. This is the120-minute S3 self-study block. S1 followed classes1/2; S2 followed3/4. These original supplementary tasks fit the presenter’s6total self-study hours but do not reproduce official ProConnect assignments. Allow browser-based participation if Python cannot be installed yet.'},
{title:'A practical Python toolkit',kicker:'Download, run, predict, and explain',html:()=>'<div class="kit05">'+panel('Strings and first request','<a href="string_foundations.py" download>string_foundations.py</a><a href="first_openai_request.py" download>first_openai_request.py</a>Practice stored text and a complete request.')+panel('Few-shot labels','<a href="few_shot_labels.py" download>few_shot_labels.py</a>Ordered examples, a new input, and an allowed-label check.')+panel('Conversation context','<a href="conversation_context.py" download>conversation_context.py</a><a href="response_chain.py" download>response_chain.py</a>Manual history and previous-response linking.')+panel('Extract the whole bundle first','<a href="session-05-python.zip" download>Complete Python bundle</a>Includes the shared runner and a plain-text guide. Keep its files together.')+'</div>'+note('Running without --live returns a labelled local stand-in. Adding --live makes actual requests and can incur API usage charges.'),notes:'1minute. Individual scripts using the shared runner require session05_runtime.py beside them; the ZIP is the simplest path. string_foundations is standalone. --live makes1request for first/fewshot and2for conversation/chain. The guide gives setup, key handling, and limits. Real model output may vary.'},
{title:'Exit ticket: explain the connection',kicker:'A request is useful when you understand its parts',html:()=>'<div class="grid two"><div class="stack">'+quiz('exit1')+quiz('exit2')+'</div>'+quiz('exit3')+'</div>',notes:'2minutes. Correct: prompt variable supplies text; JSON validity is insufficient; previous instructions must be repeated. Ask for explanations and a code line that supports each answer. Revisit a demonstration if a large share of students still guess.'},
{title:'Bring your foundations together',kicker:'Next class · practise and consolidate',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>Your explanation of a complete request</h3><p>State the task, prepare relevant context, choose a supported model, send the request, inspect the response, and evaluate the result.</p><p class="muted">Session 6 brings the course concepts into guided practice and original revision exercises.</p></div><div class="worksheet">'+field('exitWhy','Why is understanding the request better than copying an API snippet?','Explain a mistake you could now find and fix.')+'<div class="row"><button id="downloadFinal" class="primary">Download my work</button><button id="sourcesBtn">Sources and coverage</button></div></div></div>'+note('Keep one habit: explain what every value and line contributes to the task.'),notes:'1minute. Official Session6 covers the textbook’s Try It Yourself questions across sessions1–7. Those exact questions were not supplied, so future revision supplements must be labelled original rather than invented official questions. End with a student explanation of request construction, context, and evidence.'}

const glossary=[['API','Application programming interface: a defined way for programs to request a service and receive results.'],['SDK','Software development kit: tools such as the Python client for using an API.'],['Client','An object configured to interact with a service.'],['Model ID','The string that identifies which model a request should use.'],['Import','Make tools from a Python package available to a source file.'],['Package','Installable Python code that supplies reusable functionality.'],['Virtual environment','A separate Python package environment for a project.'],['Terminal','A place to issue commands and inspect program output.'],['API key','A private credential that authorises API requests.'],['Environment variable','A named configuration value made available to a process.'],['String','A text value enclosed by quotation marks in Python source.'],['Variable','A name associated with a stored value in a program.'],['Dictionary','A mapping from keys to values, written with braces in Python.'],['List','An ordered collection of items, written with square brackets.'],['Named argument','A parameter name with the value passed to a function or method call.'],['Method','An operation accessed through an object, such as history.append(...).'],['Prompt','Instructions and task content supplied to guide a model response.'],['Instructions','Higher-priority behaviour guidance supplied through the Responses instructions parameter in this lesson.'],['Message role','A label identifying whether content comes from a user, assistant, or other supported source.'],['Few-shot prompting','Including a few input/output demonstrations in the model context.'],['Fine-tuning','A separate training process that updates model parameters, unlike ordinary few-shot context.'],['Response object','The returned structured result with fields such as id, status, output, and usage.'],['output_text','A Python SDK helper that gathers text output for a response.'],['JSON','A structured data notation with rules for objects, arrays, strings, and other values.'],['Schema','A definition of the allowed structure and values of data.'],['Conversation history','Earlier turns deliberately supplied or linked as context for a follow-up.'],['previous_response_id','Responses parameter that links a request to a prior supported response.'],['Token','A processing unit that may be a piece of a word, rather than one word.'],['Context window','A model’s finite token capacity for the context and generated content under its rules.'],['max_output_tokens','A Responses upper bound on generated tokens, including reasoning where applicable.'],['store=False','Requests that a response object not be saved for later retrieval; it does not disable all service logs.'],['Mock / stand-in','Local scripted behaviour used to practise program flow without calling a real model.'],['Held-out case','A test example kept separate from the demonstrations used to guide the system.'],['Rate limit','A restriction on request or token throughput.'],['Refusal','A response that declines to fulfil a request rather than providing the requested content.'],['Incomplete response','A result that stopped without a completed answer and needs status/detail inspection.']];
const stage=document.getElementById('stage');let lastFocus=null,seconds=7200,timerRunning=false,timerInterval=null;
function go(i){state.slide=Math.max(0,Math.min(slides.length-1,Number(i)||0));save();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){const i=state.slide,s=slides[i];document.title='Session 05 · '+s.title;stage.innerHTML='<article class="slide session05"><div class="slide-head"><div class="section-label"><span class="rule"></span><span class="eyebrow">'+esc(s.kicker)+'</span></div>'+(i===0?'':'<h2>'+esc(s.title)+'</h2>')+'</div>'+s.html()+'</article>';document.getElementById('pageLabel').textContent=(i+1)+' / '+slides.length+' · '+sectionFor(i).name;document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===slides.length-1;document.getElementById('progressFill').style.width=((i+1)/slides.length*100)+'%';document.getElementById('progress').setAttribute('aria-valuenow',i+1);document.getElementById('progress').setAttribute('aria-valuemax',slides.length);if(i===10)updateVariable();if(i===13)updateRequest();if(i===19)updatePrompt();if(i===23)updateFew();if(i===27)updateHistory();if(i===31)updateContext();if(i===34)updateEvaluation();}
function downloadText(name,body){const url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadWork(){const labels={promptDraft:'Prompt assignment',promptReason:'Prompt evaluation and reason',assistantPlan:'Campus assistant prompt and examples',assistantHistory:'Follow-up context',exitWhy:'Why understanding the request matters'};const p=['FOUNDATIONS OF AI · SESSION 05','Student worksheet · '+new Date().toLocaleDateString()];for(const [k,n] of Object.entries(labels))p.push(n+'\n'+(state.worksheet[k]||'[Not answered]'));p.push('ASSEMBLED PROMPT\n'+promptText(state.prompt),'REQUEST SIMULATION\n'+JSON.stringify(requestPacket(),null,2),'LAST SCRIPTED REQUEST OUTPUT\n'+(state.requestOutput||'[Not run]'),'FEW-SHOT EXAMPLE LABELS\n'+JSON.stringify(state.fewLabels),'LAST SCRIPTED FEW-SHOT OUTPUT\n'+(state.fewOutput||'[Not run]'),'JSON CHECK\n'+state.jsonText+'\n'+state.jsonOutput,'CONTEXT EXPERIMENT\n'+(state.historyOutput||'[Not run]'),'LAST SCRIPTED EVALUATION\n'+JSON.stringify(state.evalOutput||'[Not run]'),'QUICK CHECKS');for(const [id,q] of Object.entries(quizData))p.push(id+': '+(state.answers[id]===undefined?'not answered':state.answers[id]===q.correct?'correct':'review needed'));p.push('All browser outputs are local illustrations, scripted stand-ins, or explicit format checks. No model requests were made by this page.');downloadText('session-05-my-worksheet.txt',p.join('\n\n'));}
function glossaryHTML(query=''){return glossary.filter(x=>x.join(' ').toLowerCase().includes(query.toLowerCase())).map(([w,m])=>'<div class="glossary-item"><b>'+esc(w)+'</b><p>'+esc(m)+'</p></div>').join('')||'<p>No matching term.</p>';}
function timerText(){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function updateTimer(){const v=document.getElementById('timerValue'),b=document.getElementById('timerToggle');if(v)v.textContent=timerText();if(b)b.textContent=timerRunning?'Pause':'Start';}
function openDrawer(type){lastFocus=document.activeElement;document.getElementById('drawer').hidden=false;const title=document.getElementById('drawerTitle'),body=document.getElementById('drawerBody');if(type==='notes'){title.textContent='Teacher notes · '+(state.slide+1);body.innerHTML='<span class="teacher-pill">'+esc(sectionFor(state.slide).name)+' · '+sectionFor(state.slide).time+'-minute block</span><h3>'+esc(slides[state.slide].title)+'</h3><p>'+esc(slides[state.slide].notes)+'</p><hr class="divider"><h3>Explain the foundation</h3><p>Ask what value is stored, what the next operation does, what goes into the request, and what would establish a useful result. Require a prediction before running or revealing.</p>';}else if(type==='outline'){title.textContent='Session contents';body.innerHTML='<div class="panel stack"><div class="row between"><h3>Class timer</h3><b id="timerValue">'+timerText()+'</b></div><div class="row"><button id="timerToggle">'+(timerRunning?'Pause':'Start')+'</button><button id="timerReset">Reset 120 min</button></div></div>'+slides.map((s,i)=>'<button class="outline-button '+(i===state.slide?'current':'')+'" data-outline-go="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+esc(s.title)+'</button>').join('');}else if(type==='sources'){title.textContent='Sources and coverage';body.innerHTML='<p>Official Aptech class 5 covers Book Session 7: comparison of gpt-3.5-turbo and gpt-4-turbo-preview, Python API conversations, prompt creation/refinement, few-shot examples, and historical context.</p><p>The manual’s exact models remain in the historical comparison. Official documentation checked on 8 November 2026 shows both IDs retired. The current Responses example uses the model ID shown in the official quickstart.</p>'+Object.entries({quick:'OpenAI Python quickstart',legacy35:'GPT-3.5 Turbo historical specification',legacy4:'GPT-4 Turbo Preview historical specification',deprecations:'Official retirement dates',prompt:'Prompt engineering and few-shot guidance',history:'Conversation state and token context',reference:'Python Responses API reference',structured:'Structured Outputs guidance'}).map(([k,n])=>'<a class="source-link05" href="'+docs[k]+'" target="_blank" rel="noopener">'+n+'</a>').join('')+'<p>These activities supplement the supplied presenter’s outline. The full textbook and official question banks were not supplied. Browser activities make no model calls. The Python bundle defaults to local stand-ins and enables network requests only with --live.</p><p>Live response wording, account access, pricing, and limits vary. Read the current documentation and API project settings before class.</p>';}else{title.textContent='Word bank';body.innerHTML='<label for="wordSearch" class="small">Find a term</label><input id="wordSearch" type="text" placeholder="SDK, context, token…"><div id="wordList">'+glossaryHTML()+'</div>';}document.getElementById('closeDrawer').focus();}
function closeDrawer(){document.getElementById('drawer').hidden=true;if(lastFocus?.isConnected)lastFocus.focus();}
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)return go(b.dataset.go);if(b.dataset.quiz){const id=b.dataset.quiz,a=Number(b.dataset.choice),q=quizData[id];state.answers[id]=a;save();document.querySelectorAll('[data-quiz="'+id+'"]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.choice)===a));const f=document.getElementById('feedback-'+id);f.textContent=(a===q.correct?'Yes. ':'Review the reason. ')+q.why;f.classList.toggle('bad',a!==q.correct);}if(b.id==='assignPrint')updateVariable();if(b.id==='requestStep'){state.requestStep=Math.min(5,state.requestStep+1);save();updateRequest();}if(b.id==='requestRun'){state.requestStep=5;save();updateRequest();}if(b.id==='requestReset'){state.requestStep=0;state.requestOutput='';save();updateRequest();}if(b.dataset.codeLine!==undefined){const i=Number(b.dataset.codeLine);document.querySelectorAll('[data-code-line]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('lineDetail').innerHTML='<h3>Line '+(i+1)+'</h3><pre class="code">'+esc(codeLines[i][0])+'</pre><p>'+codeLines[i][1]+'</p>';}if(b.id==='roleRun'){document.getElementById('roleOutput').textContent=state.role==='developer'?'Intended: follow the one-sentence application instruction, such as “A variable is a name for a stored value.”':'Illustration: the later user request may update the earlier user preference to five paragraphs. The application should define its desired rules clearly.';}if(b.id==='weakPrompt'||b.id==='strongPrompt'){state.prompt=b.id==='weakPrompt'?{task:'Tell me about Python.',audience:'',format:'',evidence:'',constraints:''}:structuredClone(fresh.prompt);save();render();}if(b.id==='downloadPrompt')downloadText('session-05-my-prompt.txt',promptText(state.prompt));if(b.id==='fewRun'){state.fewOutput=scriptedLabel(fewInputs[state.fewQuestion],state.fewLabels,state.useExamples);save();document.getElementById('fewOutput').textContent=state.fewOutput;}if(b.dataset.jsonExample){const texts={correct:'{"label":"HOURS"}',syntax:'{"label":"HOURS",}',shape:'{"category":"HOURS"}',meaning:'{"label":"BOOKING"}'};state.jsonText=texts[b.dataset.jsonExample];state.jsonOutput='';save();render();}if(b.id==='validateJSON'){const r=validateJSON(state.jsonText);state.jsonOutput=r.message;save();const f=document.getElementById('jsonResult');f.textContent=r.message;f.classList.toggle('bad',!r.meaning);}if(b.id==='historyRun'){const all=historyMessages(state.studentName||'Amina'),sent=state.includeHistory?all:all.slice(-1);state.historyOutput=historyAnswer(sent);state.historyPacket=JSON.stringify(sent);save();document.getElementById('historyOutput').textContent=state.historyOutput;}if(b.id==='evaluateLabels'){state.evalOutput=evaluateLabels(state.fewLabels,state.useExamples);save();updateEvaluation();}if(b.id==='resetExamples'){state.fewLabels=structuredClone(fresh.fewLabels);state.useExamples=true;state.evalOutput=null;save();updateEvaluation();}if(b.id==='downloadWork'||b.id==='downloadFinal')downloadWork();if(b.id==='sourcesBtn')openDrawer('sources');});
stage.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){state.worksheet[t.dataset.field]=t.value;save();}if(t.dataset.promptField){state.prompt[t.dataset.promptField]=t.value;save();updatePrompt();}if(t.id==='variableName'||t.id==='variableValue'){state[t.id]=t.value;save();}if(t.id==='requestQuestion'||t.id==='requestInstructions'){state[t.id]=t.value;state.requestStep=0;state.requestOutput='';save();updateRequest();}if(t.id==='jsonEditor'){state.jsonText=t.value;state.jsonOutput='';save();document.getElementById('jsonResult').textContent='Run the checks for the edited value.';document.getElementById('jsonResult').classList.remove('bad');}if(t.id==='studentName'){state.studentName=t.value;state.historyOutput='';save();updateHistory();document.getElementById('historyOutput').textContent='Predict the follow-up with the new context.';}if(t.id==='contextTurns'){state.contextTurns=Number(t.value);save();updateContext();}});
stage.addEventListener('change',e=>{const t=e.target;if(t.id==='literalPrint'){state.literalPrint=t.checked;save();updateVariable();}if(t.id==='requestModel'){state.requestModel=t.value;state.requestStep=0;state.requestOutput='';save();updateRequest();}if(t.id==='requestTopic'){state.requestQuestion={variable:'Explain a Python variable in one sentence.',api:'Explain an API in one sentence.',precision:'Explain precision in one sentence.'}[t.value]||state.requestQuestion;state.requestStep=0;state.requestOutput='';save();document.getElementById('requestQuestion').value=state.requestQuestion;updateRequest();}if(t.id==='instructionRole'){state.role=t.value;save();document.getElementById('roleOutput').textContent='Predict the intended behaviour before showing it.';}if(t.dataset.fewLabel||t.id==='useExamples'||t.id==='fewQuestion'){if(t.dataset.fewLabel)state.fewLabels[t.dataset.fewLabel]=t.value;else if(t.id==='useExamples')state.useExamples=t.checked;else state.fewQuestion=t.value;state.fewOutput='';state.evalOutput=null;save();updateFew();document.getElementById('fewOutput').textContent='Predict the new output.';}if(t.id==='includeHistory'){state.includeHistory=t.checked;state.historyOutput='';save();updateHistory();document.getElementById('historyOutput').textContent='Predict whether the name is in this request.';}});
document.getElementById('prevBtn').onclick=()=>go(state.slide-1);document.getElementById('nextBtn').onclick=()=>go(state.slide+1);document.getElementById('outlineBtn').onclick=()=>openDrawer('outline');document.getElementById('glossaryBtn').onclick=()=>openDrawer('glossary');document.getElementById('teacherBtn').onclick=()=>openDrawer('notes');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('fullscreenBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fullscreenBtn').textContent='Use browser full screen';}};
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer();const b=e.target.closest('button');if(!b)return;if(b.dataset.outlineGo!==undefined){closeDrawer();go(b.dataset.outlineGo);}if(b.id==='timerToggle'){timerRunning=!timerRunning;if(timerRunning)timerInterval=setInterval(()=>{if(seconds>0)seconds--;else{timerRunning=false;clearInterval(timerInterval);}updateTimer();},1000);else clearInterval(timerInterval);updateTimer();}if(b.id==='timerReset'){seconds=7200;timerRunning=false;clearInterval(timerInterval);updateTimer();}});
document.getElementById('drawer').addEventListener('input',e=>{if(e.target.id==='wordSearch')document.getElementById('wordList').innerHTML=glossaryHTML(e.target.value);});
document.addEventListener('keydown',e=>{const drawer=document.getElementById('drawer');if(e.key==='Escape'&&!drawer.hidden){closeDrawer();return;}if(!drawer.hidden){if(e.key==='Tab'){const all=[...drawer.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.slide-1);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(slides.length-1);}if(e.key.toLowerCase()==='n')openDrawer('notes');});
state.slide=Math.max(0,Math.min(slides.length-1,Number(state.slide)||0));render();

// Bright and dark themes share a local preference across the course.
function applyTheme(mode){const dark=mode==='dark';document.documentElement.dataset.theme=dark?'dark':'bright';const b=document.getElementById('themeBtn');if(b){b.textContent=dark?'☀ Bright theme':'☾ Dark theme';b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label','Switch to '+(dark?'bright':'dark')+' theme');}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#101c1c':'#f4f2e9';try{localStorage.setItem('aptech-ai-theme',dark?'dark':'bright');}catch(e){}}
let preferredTheme='bright';try{preferredTheme=localStorage.getItem('aptech-ai-theme')||'bright';}catch(e){}applyTheme(preferredTheme);
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'bright':'dark'));
</script></body></html>
