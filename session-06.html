const quizData={warm:{q:'A campus assistant knows the lab hours but has no training record for Amina. What should it do?',options:['Invent a training status because it can write fluent sentences.','Answer the hours question from evidence and ask for the missing training record.'],correct:1,why:'Knowledge can be complete for one question and incomplete for another. An answer should stay within the available evidence.'},types:{q:'Which statement about AI categories is accurate?',options:['A text generator is automatically an artificial general intelligence.','Generative describes producing content. It does not establish general human-level capability.'],correct:1,why:'Task capability and the kind of output are different distinctions. Current examples can generate content without establishing general intelligence.'},learning:{q:'You have examples with labels, such as “spam” and “normal”. Which learning setup fits?',options:['Supervised learning.','Unsupervised learning because all data involves uncertainty.'],correct:0,why:'Supervised learning uses example input/target pairs. Unsupervised methods look for structure without those target labels.'},leakage:{q:'Which feature would leak the outcome when predicting whether a booking will be cancelled?',options:['Information available when the prediction is requested.','A field added after the cancellation outcome is already known.'],correct:1,why:'A future or outcome-derived field can make evaluation look strong while being unavailable at the real prediction time.'},deep:{q:'Which description correctly relates deep learning and machine learning?',options:['Deep learning is a part of machine learning that uses neural networks with multiple layers.','Every machine-learning task requires a deep neural network.'],correct:0,why:'Deep learning is one approach within machine learning. Data type, task, available examples, and resources affect the method choice.'},stock:{q:'For a stock-price prediction evaluated as a future forecast, how should we split examples?',options:['Use later dates for training and earlier dates as “future” tests.','Train on earlier dates, tune on a later validation period, and test on a still later period.'],correct:1,why:'Chronological splits reflect the intended forecasting situation and avoid training on future information. A good test does not guarantee future investment returns.'},state:{q:'Which describes a state rather than an action in a campus route problem?',options:['The agent is at Library.','Move from Gate to Library.'],correct:0,why:'A state describes the current situation. An action changes it. The representation must retain information relevant to valid moves and the goal.'},search:{q:'When roads have unequal costs, does the fewest-move route necessarily cost the least?',options:['Yes. Fewer moves always means less total cost.','No. We need to add road costs and choose a method suited to that objective.'],correct:1,why:'BFS prioritises depth. Uniform-cost search prioritises accumulated cost. A short route can include an expensive road.'},unknown:{q:'If a training fact is unknown, does NOT trained automatically become True?',options:['Yes. Unknown and False are the same.','No. In our explicit three-valued model, NOT Unknown remains Unknown.'],correct:1,why:'Missing evidence does not prove the opposite. This lesson distinguishes True, False, and Unknown deliberately.'},reason:{q:'The courtyard is wet. Rain is one possible explanation. What kind of reasoning is that?',options:['A guaranteed deduction that rain occurred.','Abduction: a possible explanation that needs further evidence.'],correct:1,why:'Several causes can produce a wet courtyard. A possible explanation is not guaranteed by the observation.'},metric:{q:'You mainly want to know how much real spam the filter catches. Which denominator belongs in that measure?',options:['All actual spam: TP + FN.','All predicted spam: TP + FP.'],correct:0,why:'Recall uses actual positives as its denominator. Precision uses predicted positives.'},evidence:{q:'The excerpt states weekday hours but says nothing about a fee. What answer about fees is supported?',options:['“The fee is ₦2,000.”','“The supplied excerpt does not state a fee.”'],correct:1,why:'A precise-sounding invented amount is still unsupported. Report the evidence limit and identify where to check.'},prompt:{q:'What do ordinary few-shot examples do?',options:['Supply task patterns in the request context.','Permanently retrain the model during a normal request.'],correct:0,why:'Example input/output pairs guide the current request. Model training or fine-tuning is a separate process.'},history:{q:'A new request contains only “Greet me by name.” Where should the name come from?',options:['The model should guess a name.','The application should send relevant history or supported linked context, or ask if it is missing.'],correct:1,why:'An independent call does not automatically inherit every earlier call. Context must be supplied or linked deliberately.'},exit1:{q:'What connects a good problem representation to a good solution?',options:['It retains the facts, actions, constraints, and objective needed to choose valid steps.','It uses the largest number of technical words.'],correct:0,why:'The representation should support the task. Missing relevant information can make a valid-looking plan inappropriate.'},exit2:{q:'A model returns valid JSON containing a wrong label. What passed and what failed?',options:['Format may have passed. Correctness failed.','Everything passed because JSON is machine-readable.'],correct:0,why:'Syntax, allowed structure, and task correctness are separate checks.'},exit3:{q:'What is the strongest evidence of understanding a code example?',options:['Reciting it exactly without knowing what changes its output.','Predicting its behaviour, explaining each part, and adapting it to a new case.'],correct:1,why:'Understanding lets you explain a mechanism and its limits, not merely reproduce a familiar example.'}};

function neuronValues(n){const t1=n.x1*n.w1,t2=n.x2*n.w2,z=t1+t2+n.b,output=n.activation==='relu'?Math.max(0,z):z>=0?1:0;return {t1,t2,z,output};}

function updateNeuron(){const n=state.neuron,v=neuronValues(n);for(const k of ['x1','x2','w1','w2','b'])document.getElementById('value-'+k).textContent=num(n[k]);document.getElementById('neuronFormula').textContent='score = x1*w1 + x2*w2 + b\n      = '+num(v.t1)+' + '+num(v.t2)+' + '+num(n.b)+'\n      = '+num(v.z)+'\n\n'+(n.activation==='relu'?'output = max(0, score)':'output = 1 if score ≥ 0, else 0');document.getElementById('neuronResult').innerHTML='<span>'+(n.activation==='relu'?'ReLU output':'Binary-step output')+'</span><b>'+num(v.output)+'</b><small>'+(n.activation==='relu'?'ReLU keeps positive scores and returns zero for negative scores.':'Our step convention returns 1 at exactly zero as well as for positive scores.')+'</small>';}
const neuronLines=[['x1 = 0.8','Store the first numeric input. A decimal point represents a fraction.'],['w1 = 1.2','Store the weight multiplying that input. A weight is a parameter, rather than the input itself.'],['x2 = 0.4','Store the second input independently of the first.'],['w2 = 0.6','Store the second input’s weight. Different inputs can contribute by different amounts.'],['bias = -0.5','Store an offset added even when both inputs are zero. A negative sign changes the direction of the offset.'],['score = x1 * w1 + x2 * w2 + bias','Multiply each input by its weight, then add the contributions and bias. Python evaluates multiplication before addition here.'],['output = max(0, score)','Call max with two arguments separated by a comma. This implements the toy ReLU: use the larger of zero and score.'],['print(output)','Display the stored output so we can compare it with our hand calculation.']];
const mapNodes={A:{name:'Gate',x:12,y:50},B:{name:'Library',x:43,y:18},C:{name:'Lab',x:43,y:82},D:{name:'Delivery',x:87,y:50}};
const mapEdges=[['A','B',1],['A','C',4],['B','C',1],['B','D',8],['C','D',2]];
const roadSets={open:[],gate:['A-B'],isolated:['B-D','C-D']};
function neighbours(node,mode,blocked=[]){return mapEdges.filter(([a,b])=>(a===node||b===node)&&!blocked.includes(a+'-'+b)).map(([a,b,w])=>({node:a===node?b:a,cost:mode==='unit'?1:w})).sort((a,b)=>a.node.localeCompare(b.node));}
function makeSearch(algorithm='bfs',mode='weighted',blocked=[]){return {algorithm,mode,blocked:[...blocked],frontier:[{node:'A',path:['A'],cost:0,seq:0}],seen:['A'],best:{A:0},expanded:[],seq:1,current:null,steps:0,result:null,message:'Gate is the first waiting candidate.'};}
function ordered(e){return e.frontier.slice().sort((a,b)=>e.algorithm==='ucs'?a.cost-b.cost||a.seq-b.seq:a.seq-b.seq);}
function stepSearch(e){if(e.result)return e;if(!e.frontier.length){e.result={found:false,path:[],cost:null};e.message='No valid route remains. The frontier is empty.';return e;}const selected=ordered(e)[0];e.frontier=e.frontier.filter(r=>r.seq!==selected.seq);e.current=selected.node;e.steps++;if(selected.node==='D'){e.result={found:true,path:selected.path,cost:selected.cost};e.message='Goal selected. '+selected.path.join(' → ')+', total cost '+selected.cost+'.';return e;}e.expanded.push(selected.node);const added=[];for(const next of neighbours(selected.node,e.mode,e.blocked)){const cost=selected.cost+next.cost;if(e.algorithm==='ucs'){if(cost>=(e.best[next.node]??Infinity))continue;e.best[next.node]=cost;e.frontier=e.frontier.filter(r=>r.node!==next.node);}else if(e.seen.includes(next.node))continue;if(!e.seen.includes(next.node))e.seen.push(next.node);e.frontier.push({node:next.node,path:[...selected.path,next.node],cost,seq:e.seq++});added.push(next.node);}e.message='Expand '+selected.node+'. '+(added.length?'Add or improve '+added.join(', ')+'.':'No new candidates.')+' Next: '+(e.algorithm==='bfs'?'earliest queued candidate.':'lowest accumulated cost.');return e;}
function runSearch(algorithm='ucs',mode='weighted',blocked=[]){const e=makeSearch(algorithm,mode,blocked);for(let i=0;i<50&&!e.result;i++)stepSearch(e);return e;}
function resetSearch(){state.engine=makeSearch(state.algorithm,state.costMode,roadSets[state.roads]);save();}
function mapHTML(e){const route=e.result?.found?e.result.path:[],routeEdges=route.slice(1).map((n,i)=>[route[i],n].sort().join('-'));return '<div class="map06"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+mapEdges.map(([a,b])=>'<line class="road06 '+(e.blocked.includes(a+'-'+b)?'closed-road06 ':'')+(routeEdges.includes(a+'-'+b)?'route-road06':'')+'" x1="'+mapNodes[a].x+'" y1="'+mapNodes[a].y+'" x2="'+mapNodes[b].x+'" y2="'+mapNodes[b].y+'"/>').join('')+'</svg>'+mapEdges.map(([a,b,w])=>'<span class="cost06" style="left:'+((mapNodes[a].x+mapNodes[b].x)/2+(a==='B'&&b==='C'?5:0))+'%;top:'+((mapNodes[a].y+mapNodes[b].y)/2)+'%">'+(e.blocked.includes(a+'-'+b)?'×':e.mode==='unit'?1:w)+'</span>').join('')+Object.entries(mapNodes).map(([id,n])=>'<button class="node06 '+(e.current===id?'current06 ':'')+(route.includes(id)||e.frontier.some(r=>r.node===id)?'waiting06':e.expanded.includes(id)?'visited06':'')+'" data-map-node="'+id+'" style="left:'+n.x+'%;top:'+n.y+'%"><b>'+id+'</b>'+n.name+'</button>').join('')+'</div>';}
function searchHTML(){return '<div class="lab06"><div class="stack"><div id="searchMap"></div><div class="controls06"><label class="field06">Method<select id="searchAlgorithm"><option value="bfs" '+(state.algorithm==='bfs'?'selected':'')+'>Breadth-first search</option><option value="ucs" '+(state.algorithm==='ucs'?'selected':'')+'>Uniform-cost search</option></select></label><label class="field06">Cost mode<select id="costMode"><option value="weighted" '+(state.costMode==='weighted'?'selected':'')+'>Unequal road costs</option><option value="unit" '+(state.costMode==='unit'?'selected':'')+'>Every road costs 1</option></select></label><label class="field06 wide">Roads<select id="roads">'+[['open','All open'],['gate','Gate–Library closed'],['isolated','Delivery isolated']].map(([v,n])=>'<option value="'+v+'" '+(state.roads===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label></div><div class="row"><button id="searchStep" class="accent">Step</button><button id="searchRun">Run to result</button><button id="searchReset">Reset</button></div><p id="nodeDetail" class="caption">Select a node to inspect its available neighbours.</p></div><div class="stack"><h3>Waiting candidates, in selection order</h3><div id="frontier" class="queue06" aria-live="polite"></div><div id="searchResult" class="result06" aria-live="polite"></div><div id="searchMetrics" class="search-metrics06"></div>'+panel('Explain the choice','Why was this candidate selected? Does the method optimise moves or accumulated cost?')+'</div></div>';}
function updateSearch(){const e=state.engine;document.getElementById('searchMap').innerHTML=mapHTML(e);document.getElementById('frontier').innerHTML=ordered(e).map(r=>'<span>'+r.node+' · cost '+r.cost+'</span>').join('')||'<span>No waiting candidates</span>';const f=document.getElementById('searchResult');f.classList.toggle('bad',e.result?.found===false);f.textContent=e.message;document.getElementById('searchMetrics').innerHTML=[['Selections',e.steps],['Moves',e.result?.found?e.result.path.length-1:'—'],['Total cost',e.result?.found?e.result.cost:'—']].map(([n,v])=>'<div class="stat06">'+n+'<b>'+v+'</b></div>').join('');document.getElementById('searchStep').disabled=Boolean(e.result);}
function and3(...values){return values.includes(false)?false:values.includes(null)?null:true;}
function not3(value){return value===null?null:!value;}
const truth=v=>v===null?'Unknown':v?'True':'False';

const sortCards=[{id:'M1',actual:true,predicted:true},{id:'M2',actual:false,predicted:true},{id:'M3',actual:true,predicted:false},{id:'M4',actual:false,predicted:false},{id:'M5',actual:true,predicted:true},{id:'M6',actual:false,predicted:false},{id:'M7',actual:false,predicted:true},{id:'M8',actual:false,predicted:false}];

function computeMetrics(c){const values=['tp','fp','fn','tn'].map(k=>c[k]);if(values.some(v=>typeof v!=='number'||!Number.isInteger(v)||v<0))return {valid:false};const {tp,fp,fn,tn}=c,total=tp+fp+fn+tn;return {valid:true,total,accuracy:total?(tp+tn)/total:null,precision:tp+fp?tp/(tp+fp):null,recall:tp+fn?tp/(tp+fn):null,f1:2*tp+fp+fn?2*tp/(2*tp+fp+fn):null};}

function updateMetrics(){const c=state.counts,m=computeMetrics(c);if(!m.valid){document.getElementById('metricResults').innerHTML='';document.getElementById('metricReason').textContent='Use whole, nonnegative counts in every field.';document.getElementById('metricReason').classList.add('bad');return;}document.getElementById('metricReason').classList.remove('bad');document.getElementById('metricResults').innerHTML=[['Accuracy',m.accuracy,(c.tp+c.tn)+' / '+m.total],['Precision',m.precision,c.tp+' / '+(c.tp+c.fp)],['Recall',m.recall,c.tp+' / '+(c.tp+c.fn)],['F1',m.f1,2*c.tp+' / '+(2*c.tp+c.fp+c.fn)]].map(([n,v,calc])=>'<div class="metric-cell06">'+n+'<b>'+pct(v)+'</b><small>'+calc+(v===null?' · zero denominator':'')+'</small></div>').join('');document.getElementById('metricReason').textContent=state.metricScenario==='imbalance'?'Accuracy is 95%, but the filter catches none of the 5 spam messages. Precision is undefined because it flags nothing.':m.total===0?'No examples means no evidence for these ratios. All four are undefined.':'Name the group in each denominator, then explain what kind of mistake matters for your task.';}

function capstoneAnswer(config){const facts={enrolled:config.enrolled,trained:config.trained,suspended:config.suspended},permission=accessDecision(facts);if(config.question==='hours')return {kind:'evidence',text:'Lab 2 opens from 09:00 to 17:00 on weekdays. [F1]',permission,route:null};if(config.question==='fee')return {kind:'unknown',text:'The supplied handbook excerpt does not state a fee. Ask the campus office or check the full handbook.',permission,route:null};if(permission===null)return {kind:'unknown',text:'I need the missing enrolment, training, or suspension record before recommending lab entry.',permission,route:null};if(permission===false)return {kind:'blocked',text:'The fictional access condition is not satisfied. Check the required enrolment, training, and no-suspension facts.',permission,route:null};const route=runSearch('ucs','weighted',roadSets[config.roads]).result;if(!route.found)return {kind:'unreachable',text:'The access condition is satisfied, but no route to Delivery exists with these road closures. Ask for a permitted alternative.',permission,route};return {kind:'ready',text:'The fictional access condition is satisfied. A lowest-cost route to Delivery is '+route.path.join(' → ')+', total cost '+route.cost+'. This plans a route; it does not confirm a completed booking or delivery.',permission,route};}
function capstoneHTML(){const c=state.capstone;return '<div class="lab06"><div class="stack"><label class="field06">Question<select id="capstoneQuestion">'+[['entry','Can I enter and plan a route to Delivery?'],['hours','When is Lab 2 open?'],['fee','What is the lab fee?']].map(([v,n])=>'<option value="'+v+'" '+(c.question===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label><div class="tri06">'+triSelect('capstone','enrolled','Enrolled',c.enrolled)+triSelect('capstone','trained','Trained',c.trained)+triSelect('capstone','suspended','Suspended',c.suspended)+'</div><label class="field06">Roads<select id="capstoneRoads">'+[['open','All open'],['gate','Gate–Library closed'],['isolated','Delivery isolated']].map(([v,n])=>'<option value="'+v+'" '+(c.roads===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label><div class="claim06">Lab 2 opens from 09:00 to 17:00 on weekdays.<small>F1 · fictional handbook excerpt</small></div><button id="runCapstone" class="accent">Run the local assistant</button></div><div class="stack"><div class="capstone-stages06"><div><b>Represent</b>Read relevant facts.</div><div><b>Reason / search</b>Apply a rule or find a route.</div><div><b>Answer / check</b>Keep the claim within evidence.</div></div><div id="capstoneOutput" class="result06 capstone-answer06" aria-live="polite">'+esc(state.capstoneResult?.text||'Predict which facts matter for this question, then run.')+'</div><p class="caption">This assistant uses local rules and uniform-cost search. It contains no trained model, API request, or generated language. The map task’s goal is Delivery.</p></div></div>';}

{title:'Put the foundations to work',kicker:'Session 06 · practical consolidation',html:()=>'<div class="grid hero06"><div class="stack"><h1>Predict the result.<br><em>Explain the reason.</em></h1><p class="lead">Solve small challenges across the course, then connect the ideas in one campus assistant.</p><div class="row"><span class="tag">2-hour class</span><span class="tag">Offline activities</span><span class="tag">Bright + dark</span></div></div><div class="hero06-board"><div><b>01</b>Understand the task</div><div><b>02</b>Trace the mechanism</div><div><b>03</b>Change one assumption</div><div><b>04</b>Check the result</div><p>Original revision exercises aligned to Book Sessions 1–7.</p></div></div>',notes:'Official class6 requires the textbook Try It Yourself questions from Book Sessions1–7. The full questions were not supplied. This presentation provides original revision exercises aligned to the outline, not invented official questions. Use the Book checklist to record actual references and coverage when the questions are available. All browser activities run locally without an account or SDK.'},
{title:'How this revision lesson maps to the manual',kicker:'Seven book topics · six taught classes',html:()=>'<div class="grid two"><div class="panel stack"><h3>The manual’s requirement</h3><p>Work through the “Try It Yourself” questions from Book Sessions 1–7.</p><p class="caption">The supplied outline lists the topics but does not contain those questions.</p><button id="openCoverage" class="primary">Open the teacher’s book checklist</button></div><div class="panel stack"><h3>Today’s practical supplements</h3><p>AI and ML, deep learning, problem solving, search, knowledge representation, reasoning and metrics, and Python model requests.</p><p>Each activity asks for a prediction, an explanation, and a changed case.</p></div></div>'+note('Original exercises support revision. Record official questions separately when using the textbook.'),notes:'2minutes. Do not mark original activities as completed official textbook questions. The book numbering differs from classroom numbering: class3 combines Book3/4; class4 combines Book5/6; class5 covers Book7. Checklist entries begin empty and unchecked. Teacher marks only actual official work.'},
{title:'The route through this class',kicker:'120 minutes · short stations and an integrated challenge',html:()=>'<div class="grid two"><div class="panel stack"><h3>How to work</h3><p>Think first. Explain to a partner. Run or reveal. Change one input. Explain the new result.</p><p>One student operates the controls while the other predicts. Swap roles at the next station.</p></div><div class="panel agenda06">'+sections.map((s,i)=>'<div class="agenda-row"><span>'+String(i+1)+'</span><button data-go="'+s.start+'">'+s.name+'</button><span class="time">'+s.time+' min</span></div>').join('')+'</div></div>',notes:'Time blocks:10 reconnect,15 ML,15 DL,20 agents/search,15 knowledge,15 metrics/evidence,15 Python/prompts,15 integrated practice. Slides are short prompts for activity, not separate lectures. Pause for explanations rather than reading every note aloud.'},
{title:'The assistant has one missing fact',kicker:'Warm-up · one question can have partial evidence',html:()=>'<div class="grid two">'+quiz('warm')+panel('Explain the boundary','The lab’s hours and a student’s eligibility are separate claims. Knowing one does not automatically establish the other.','dark')+'</div>',notes:'3minutes. Ask students to state the supported hours answer and a precise follow-up for training. This reconnects Session4grounding/unknown facts with Session5prompts. Invite an example where some information is enough for one answer but not another.'},
{title:'AI categories describe different things',kicker:'Station 1 · meaning before labels',html:()=>'<div class="grid two">'+quiz('types')+panel('Explain with an example','A narrow spam filter performs a defined task. A generator produces content. General intelligence is a broader capability claim.')+'</div>'+note('Role-play: one student says what a system does. Another identifies what that description establishes, and what it leaves unproven.'),notes:'3minutes. Keep narrow/general capability separate from generative output. Explain applications and effects: helpful automation can still make errors, affect people, and need evaluation. Do not equate a humanlike chat response with human understanding.'},
{title:'Labels change the learning setup',kicker:'Supervised, unsupervised, semi-supervised, and reinforcement learning',html:()=>'<div class="grid two">'+quiz('learning')+'<table class="small-table"><thead><tr><th>Setup</th><th>Example evidence</th></tr></thead><tbody><tr><td>Supervised</td><td>Message plus known spam/normal label</td></tr><tr><td>Unsupervised</td><td>Unlabelled messages grouped by similarities</td></tr><tr><td>Semi-supervised</td><td>A few labelled messages with many unlabelled ones</td></tr><tr><td>Reinforcement</td><td>An agent learns from rewards following actions</td></tr></tbody></table></div>'+note('Ask what information reaches the learning procedure, rather than choosing a method because its name sounds advanced.'),notes:'3minutes. Correctsupervised. Some tasks can use explicit rules rather than training. Reinforcement feedback follows actions and need not be a supplied target label for every input. Semi-supervised uses both labelled and unlabelled data, which does not guarantee improvement in every setting.'},
{title:'The workflow needs the right dependencies',kicker:'Interactive workflow challenge',html:workflowHTML,notes:'5minutes. Simplified order:task,data,prepare,train,tune,test,monitor. Allow students to move steps and select explanations. A preprocessing fit must not use held-out data. Real workflows iterate, but the specific challenge assesses separation between fitting, tuning, and final evaluation.'},
{title:'A suspiciously perfect feature',kicker:'Find the leakage',html:()=>'<div class="grid two">'+quiz('leakage')+panel('The task','Predict cancellation before a booking date. A “cancelled_at” field arrives only after the outcome. It cannot serve as an ordinary available predictor.','soft')+'</div>'+note('Detective game: invent a field that looks helpful but would be unavailable at the moment the prediction is needed.'),notes:'2minutes. A future/outcome-derived feature can leak the target. Ask students to identify the prediction time, then check every feature against it. Leakage can also happen through preprocessing or repeated use of the test set. Legitimate information available beforehand is potentially usable, but still must be appropriate.'},
{title:'Choose a method for a useful task',kicker:'ML practice · justify the foundation',html:()=>'<div class="grid two"><div class="panel stack"><h3>Your case</h3><p>A campus wants to predict how many seats each practice session will need.</p><p>State the input data, target, a baseline, and a way to test a future prediction.</p></div><div class="worksheet">'+field('mlPlan','Your data, target, baseline, and evaluation','Explain what information is available at prediction time.')+'</div></div>'+note('A simple baseline might use last week’s attendance. Show why a more complex method would need better evidence.'),notes:'2minute launch. Numeric targetsuggests regression. Inputs may include session time, course, and registered attendance known before class. Baseline lastweek or historicalmean. Use a chronological evaluation if claiming future forecasts. MAE gives errors in seats; evaluate usefulness rather than claiming every MLsystem needs deep learning.'},
{title:'Deep learning is part of machine learning',kicker:'Station 2 · choose by task and data',html:()=>'<div class="grid two">'+quiz('deep')+panel('Explain the choice','A few tabular records may suit a simple baseline. A large image task may benefit from learned visual features and neural networks.')+'</div>'+note('A model family is a tool choice. Compare data, errors, resources, and a suitable baseline before calling one method best.'),notes:'3minutes. Deep learning uses multilayer neural networks. A large image task can also use a pretrained model rather than training from scratch. Good performance depends on task/data/pretraining/evaluation, not just “deep” in the name.'},
{title:'Calculate one neuron, then change it',kicker:'Interactive toy-unit lab',html:neuronHTML,notes:'5minutes. Default contributions .96+.24−.50=.70 and ReLUoutput .70. Zero inputs give score=bias. Changing weight has no contribution through a zero input. Negative z returns0 underReLU. Binary-step convention here is1forz>=0. Sliders manually set parameters; no training occurs. This illustrates computation without claiming singleunit reproduces deep-network ability.'},
{title:'Why the neuron code works',kicker:'Line-by-line explanation',html:()=>'<div class="line-buttons06">'+neuronLines.map((_,i)=>'<button data-neuron-line="'+i+'" aria-pressed="'+(i===0)+'">Line '+(i+1)+'</button>').join('')+'</div><div id="neuronLineDetail" class="panel stack"><pre class="code">'+esc(neuronLines[0][0])+'</pre><p>'+neuronLines[0][1]+'</p></div>'+note('Before running Python, calculate each multiplication and sum on paper. Check the same values in the browser lab.'),notes:'3minutes. * multiplies,+adds,=assigns,maxisafunctionwithcomma-separatedarguments. The filename session06_practice.py contains the full real calculation with comments. Different weights affect different contributions; the activation creates a chosen output rule.'},
{title:'A model family should fit its input',kicker:'Recall applications and the stock example',html:()=>'<div class="grid two"><table class="small-table"><thead><tr><th>Family</th><th>Useful idea to explain</th></tr></thead><tbody><tr><td>CNN</td><td>Convolutions can learn spatial patterns.</td></tr><tr><td>RNN / LSTM</td><td>Sequence processing and remembered state.</td></tr><tr><td>Transformer</td><td>Attention combines relevant context.</td></tr><tr><td>GAN</td><td>Generator and discriminator train in competition.</td></tr></tbody></table>'+quiz('stock')+'</div>'+note('For a stock forecast, explain chronological evaluation and uncertainty. A convincing chart cannot guarantee future returns.'),notes:'2minutes. These are common revision examples rather than an exhaustive official algorithm list. CNNforimages,RNN/LSTMforsequences,Transformersforcontext,GANforgenerationcan overlap applications. Stockpricesare uncertain; evaluation must avoid futureleakage.'},
{title:'Explain a changed neuron result',kicker:'DL practice · a prediction with a reason',html:()=>'<div class="grid two">'+panel('Your challenge','In the neuron lab, make the ReLU output zero. Then change only one parameter so it becomes positive. Explain the contribution that changed.','dark')+'<div class="worksheet">'+field('neuronReason','Your settings, predicted output, and explanation','Which multiplication or offset changed the score?')+'</div></div><button data-go="10" class="primary">Return to the neuron lab</button>',notes:'2minutes. Accept any mathematically valid example with explanation. For x1=x2=0, bias−1gives0andbias+1gives1. That case proves the offset’srole without claiming it is a trained model. Rubric emphasises changed contribution and chosen activation.'},

{title:'An agent observes and chooses an action',kicker:'Recall goals, memory, preferences, and learning',html:()=>'<div class="recap06">'+panel('Reflex and model-based','A reflex uses the current percept. An internal model can track observations, but it can become stale.')+panel('Goal and utility','A goal defines success. A preference or utility distinguishes acceptable outcomes by what matters.')+panel('Learning','Feedback can improve behaviour. Learning can enhance other agent designs rather than forming a separate exclusive category.')+'</div>'+note('Partner challenge: a robot remembers a room as clean. Someone dirties it unseen. Explain why memory and the actual world now disagree.'),notes:'3minutes. Revisit Session3roomdemonstration. Name an observation/actionfortrafficcontrolorbooking. Avoid implying storedstateishumanconsciousness. Utilityweightsmust matchtaskpreferences; learning doesnotautomaticallyrepairbadgoals.'},

// Teaching notes are concise prompts for discussion, prediction, and explanation.
const teacherNotes06=[
  'Session 6 requires the textbook Try It Yourself questions from Book Sessions 1–7. Those questions were not supplied. These are original revision exercises. Record actual official references in the Book checklist when available. Browser activities require no account or SDK.',
  '2 minutes. Explain the mapping: classroom Session 3 combines Book 3/4; classroom Session 4 combines Book 5/6; classroom Session 5 covers Book 7. Keep official question coverage separate from supplementary practice.',
  'Eight blocks total 120 minutes: 10 reconnect, 15 ML, 15 deep learning, 20 agents/search, 15 knowledge, 15 metrics/evidence, 15 Python/context, 15 integrated practice. Use slides as activity prompts. Swap operator and predictor roles.',
  '3 minutes. Ask for a supported answer and a precise follow-up about the missing training record. Knowing the hours does not establish eligibility. Invite another example of partial evidence.',
  '3 minutes. Separate task capability from output type. Generating text does not establish general intelligence. Helpful automation can still make errors and affect people; ask what evidence would establish usefulness.',
  '3 minutes. Supervised learning uses known targets. Unsupervised learning seeks structure without target labels. Semi-supervised combines labelled and unlabelled data. Reinforcement feedback follows actions. Some tasks can use rules without training.',
  '5 minutes. Target order: task, data, prepare/split, train, tune, test, monitor. Ask why each dependency exists. Fit learned preprocessing using training data. Real workflows iterate; keep final evaluation separate from fitting and tuning.',
  '2 minutes. Establish the prediction time, then inspect whether each feature would exist at that time. An outcome-derived cancellation field leaks the answer. Leakage can also arise through preprocessing or repeated test-set tuning.',
  '2-minute launch. Seat demand is numeric, suggesting regression. Inputs must exist before the session. A last-week or historical-mean baseline gives a comparison. Chronological evaluation suits future forecasts; MAE expresses error in seats.',
  '3 minutes. Deep learning uses multilayer neural networks within ML. Image work may reuse a pretrained model. Task, data, resources, and evaluation matter more than choosing the most elaborate name.',
  '5 minutes. Default: 0.96 + 0.24 − 0.50 = 0.70. Zero inputs give score = bias. Changing a weight on a zero input adds nothing. ReLU returns zero for negative scores. Our binary step returns 1 at score ≥ 0. Sliders do not train.',
  '3 minutes. = assigns, * multiplies, + adds. max calls a function with comma-separated arguments. Predict each intermediate value on paper. The commented session06_practice.py contains real runnable Python.',
  '2 minutes. Use earlier dates for training, a later validation period for tuning, and a still later test period when evaluating a forecast. Avoid training on the future. Good historical performance does not guarantee future returns.',
  '2 minutes. Ask which change affected a contribution, the offset, or the activation. Require both old and new calculations. Inputs and parameters have different jobs; this is one manually configured toy unit.',
  '3 minutes. If the task requires picking up a package, state may need location plus a package flag. Our map assumes the package is already carried. A goal must retain all required completion conditions.',
  '3 minutes. Revisit the unseen dirty-room example from Session 3. Stored state can be stale. Goal, utility, and learning are compatible design ideas; learning alone does not repair an unsuitable goal.',
  '8 minutes. Weighted BFS: A–B–D, 2 moves, cost 9. UCS: A–B–C–D, 3 moves, cost 4. Unit costs: both 2 moves, cost 2. Close A–B: UCS cost 6. Isolate Delivery: no route. Ask for the next candidate before each step.',
  '3 minutes. BFS optimises depth for equal-cost moves; UCS accumulated cost for nonnegative costs. DFS does not guarantee shortest or cheapest. Greedy uses h; A* uses g+h with suitable heuristic and graph-search handling. Only BFS/UCS run here.',
  '3-minute launch. A timetable state could be a partial assignment; an action adds a valid slot. A puzzle state is an arrangement; an action moves a piece. Explain constraints and the objective. State-space search is broader than web search.',
  '3 minutes. Facts need context and provenance. Rules specify conditions and conclusions. Frames group attributes; semantic networks name relationships; ontologies define shared concepts and constraints. More facts alone do not ensure sound decisions.',
  '5 minutes. Initial training Unknown gives Unknown. Enrolled False with training Unknown gives False because an AND requirement explicitly fails. Suspension True also fails. This is a deliberately chosen three-valued rule, not a theorem prover.',
  '3 minutes. Wet ground permits several explanations: rain is abductive, not guaranteed. Induction generalises uncertainly. Deduction follows valid rules under premises. One witness proves an existential claim; it cannot establish a universal claim.',
  '2 minutes. NOT Unknown stays Unknown here. Classical propositional logic uses True/False; missing-evidence handling is an extra modelling choice. A closed-world assumption may fit a complete register, but not arbitrary missing records.',
  '2 minutes. Suspension False→True changes NOT suspended True→False, so access fails. Other facts need not change. New information must reach dependent decisions instead of leaving an old recommendation in place.',
  '5 minutes. Reference counts: TP2 FP2 FN1 TN3. True/false describes prediction correctness; positive/negative describes the prediction class. Read actual and predicted separately. Loading reference counts does not prove that student sorting was correct.',
  '4 minutes. Accuracy 5/8 = 62.5%; precision 2/4 = 50%; recall 2/3 ≈ 66.7%; F1 4/7 ≈ 57.1%. Always-normal: 95% accuracy, undefined precision, 0 recall, 0 F1. No examples: all undefined. Reject invalid counts.',
  '2 minutes. Recall measures actual positives caught. Precision measures predicted positives that are real positives. Error costs guide the choice. Tune thresholds on validation data. Latency, task completion, and numeric prediction errors may also matter.',
  '2 minutes. The excerpt supports hours, but no fee. Report the limit and identify where to check. Generation and retrieval still require evidence checks. Multimodal models and tool-using agents also require task definition and evaluation.',
  '2-minute launch. Precision is 50%; recall is about 66.7%. Either error priority can be justified by costs. A factual-answer check might inspect source currency, support for the claim, or an invented fee.',
  '5 minutes. Correct choices: input=prompt, print(response.output_text), input=history. Quotes send a literal word; output_text selects the text attribute; the last-message slice loses the name. This is local value inspection, not API execution.',
  '3 minutes. Few-shot examples guide the current request context, not permanent weight training. Use correct input/output pairs and separate evaluation inputs. JSON syntax, allowed structure, and meaning require separate checks.',
  '3 minutes. Relevant ordered history or supported response linking supplies context. previous_response_id does not automatically retain earlier instructions, so repeat them when needed. Linked context still uses a finite token budget. Refer to Session 5 for API details.',
  '2-minute launch. Distinguish SDK/setup failures from prompt failures. Keys authorise requests and belong in private setup, never worksheets or HTML. A saved response ID is not a key. Session 5 covers retired IDs and explicit optional live calls.',
  '2 minutes. Download the offline Python bundle. Predict the eight-line neuron output, run, then change one value. Read the rule functions in the capstone before the optional search internals. No SDK or network is required.',
  '6 minutes. Supported access plus open roads: route cost 4. Unknown training: ask. Suspended True: condition fails. Isolated Delivery: no route. Hours use F1; fee is not stated. A planned route does not confirm booking or delivery. This is local rules/search.',
  '2 minutes. These are functional tests for a transparent local assistant, not LLM accuracy measurements. Try closing Gate–Library for cost 6. A changed task may require different facts and a different goal representation.',
  '2-minute launch. Not every problem needs ML or search. Suggested 10-point rubric: task/facts 2, rule/unknown 2, method reason 2, evaluation 2, changed cases 2. Full Python is optional stretch; grade explanations rather than copied code.',
  '1 minute. Require a demonstration or explanation before ticking. These self-reported checks support further practice; they are not a certificate or exam result. Use Contents to revisit an uncertain foundation.',
  '2 minutes. Answers concern relevant representation, format versus correctness, and prediction/explanation/adaptation. Ask for new examples and assign targeted follow-up based on observed misunderstandings.',
  'End of the 120-minute class. The earlier S1/S2/S3 activities already total the manual’s six self-study hours. Download original explanations and reflections. Actual book questions and ProConnect assignments must be completed separately with the teacher.'
];

const glossary=[['Problem representation','Keep the states, actions, constraints, goal, and cost needed to solve a task.'],['Supervised learning','Learn from example inputs paired with known target labels.'],['Unsupervised learning','Find structure in examples without supplied target labels.'],['Semi-supervised learning','Use labelled and unlabelled examples in learning.'],['Reinforcement learning','Learn behaviour from feedback or rewards following actions.'],['Leakage','Information used in learning or evaluation that would not properly be available at prediction time.'],['Deep learning','Machine learning based on neural networks with multiple layers.'],['Weight','A parameter multiplying an input contribution.'],['Bias','An offset added to a weighted sum.'],['ReLU','The activation max(0, score): positive values pass through and negative values become zero.'],['State','A representation of the current situation relevant to a problem.'],['Frontier','Discovered candidates waiting for selection in a search.'],['BFS','Breadth-first search: select by fewest steps from the start using queue order.'],['Uniform-cost search','Select by lowest accumulated path cost; used here with nonnegative costs.'],['Heuristic','An estimate or rule of thumb used to guide a choice.'],['A*','A search method selecting by cost so far g plus estimated remaining cost h.'],['Knowledge representation','A format for meaningful facts, relationships, rules, or beliefs.'],['Unknown','A deliberately separate value when the required evidence is missing.'],['Provenance','The source and relevant context of a fact or claim.'],['Deduction','A conclusion justified by valid rules under the given premises.'],['Induction','Generalising from examples with uncertainty.'],['Abduction','A plausible explanation for observations rather than a guaranteed cause.'],['Predicate','A property or relation applied to an entity or entities.'],['Recall','TP/(TP+FN): fraction of actual positives caught.'],['Precision','TP/(TP+FP): fraction of predicted positives that are real positives.'],['Accuracy','(TP+TN)/total: fraction of correct predictions.'],['F1','2TP/(2TP+FP+FN): combines precision and recall when the ratio is defined.'],['MAE','Mean absolute error: average absolute difference in the target’s units.'],['Grounding','Connect a factual answer to relevant supporting evidence.'],['Few-shot prompting','Input/output demonstrations included in a request’s context.'],['Conversation context','Earlier messages or supported linked state deliberately supplied to a follow-up.'],['Token','A model-processing unit that may be a part of a word.'],['Capstone','An integrated practice task connecting several course concepts.'],['Official question coverage','Teacher-recorded work on actual textbook questions, separate from original supplementary exercises.']];

ledge; Book6 reasoning/metrics/emerging AI; Book7 Python prompts/context.</p><a class="source-link06" href="https://aima.cs.berkeley.edu/" target="_blank" rel="noopener">Artificial Intelligence: A Modern Approach · teacher reading</a><a class="source-link06" href="https://scikit-learn.org/stable/modules/model_evaluation.html" target="_blank" rel="noopener">scikit-learn · metric definitions</a><a class="source-link06" href="https://developers.openai.com/api/docs/guides/conversation-state" target="_blank" rel="noopener">Official OpenAI conversation-state guidance</a><a class="source-link06" href="session-05.html">Session 5 · current API references and Python examples</a><p>Facts, graph costs, labels, and numerical examples are fictional. Every interactive calculation is local. No API or language model runs here. The three-valued rule is a deliberately chosen teaching model.</p><p>The earlier S1, S2, and S3 activities total the manual’s six self-study hours. No additional required self-study block is created by this revision class.</p>';}else{title.textContent='Word bank';body.innerHTML='<label for="wordSearch" class="small">Find a term</label><input id="wordSearch" type="text" placeholder="Bias, recall, context…"><div id="wordList">'+glossaryHTML()+'</div>';}document.getElementById('closeDrawer').focus();}
function closeDrawer(){document.getElementById('drawer').hidden=true;if(lastFocus?.isConnected)lastFocus.focus();}
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)return go(b.dataset.go);if(b.dataset.exitTab!==undefined){state.exitTab=Number(b.dataset.exitTab);save();render();return;}if(b.dataset.quiz){const id=b.dataset.quiz,a=Number(b.dataset.choice),q=quizData[id];state.answers[id]=a;save();document.querySelectorAll('[data-quiz="'+id+'"]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.choice)===a));const f=document.getElementById('feedback-'+id);f.textContent=(a===q.correct?'Yes. ':'Review the reason. ')+q.why;f.classList.toggle('bad',a!==q.correct);}if(b.dataset.workflowMove!==undefined){const i=Number(b.dataset.workflowMove),j=i+Number(b.dataset.direction);if(j>=0&&j<state.workflow.length){[state.workflow[i],state.workflow[j]]=[state.workflow[j],state.workflow[i]];state.workflowChecked=false;save();updateWorkflow();}}if(b.dataset.workflowInfo){const s=workflowSteps.find(s=>s.id===b.dataset.workflowInfo);document.getElementById('workflowReason').innerHTML='<h3>'+s.title+'</h3><p>'+s.why+'</p>';}if(b.id==='checkWorkflow'){state.workflowChecked=true;save();updateWorkflow();}if(b.id==='resetWorkflow'){state.workflow=structuredClone(fresh.workflow);state.workflowChecked=false;save();updateWorkflow();}if(b.id==='resetNeuron'){state.neuron=structuredClone(fresh.neuron);save();render();}if(b.dataset.neuronLine!==undefined){const i=Number(b.dataset.neuronLine);document.querySelectorAll('[data-neuron-line]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('neuronLineDetail').innerHTML='<h3>Line '+(i+1)+'</h3><pre class="code">'+esc(neuronLines[i][0])+'</pre><p>'+neuronLines[i][1]+'</p>';}if(b.id==='searchStep'){stepSearch(state.engine);save();updateSearch();}if(b.id==='searchRun'){for(let i=0;i<50&&!state.engine.result;i++)stepSearch(state.engine);save();updateSearch();}if(b.id==='searchReset'){resetSearch();updateSearch();}if(b.dataset.mapNode){const id=b.dataset.mapNode;document.getElementById('nodeDetail').textContent=mapNodes[id].name+': '+(neighbours(id,state.costMode,roadSets[state.roads]).map(n=>n.node+' (cost '+n.cost+')').join(', ')||'no open neighbours');}if(b.id==='checkSort'){state.sortChecked=true;save();updateSort();}if(b.id==='resetSort'){state.sort={};state.sortChecked=false;save();updateSort();}if(b.id==='useCardCounts'){state.counts=correctCounts();state.metricScenario='cards';save();go(25);}if(['cardMetricCase','imbalanceCase','emptyMetricCase'].includes(b.id)){state.counts=b.id==='cardMetricCase'?correctCounts():b.id==='imbalanceCase'?{tp:0,fp:0,fn:5,tn:95}:{tp:0,fp:0,fn:0,tn:0};state.metricScenario=b.id==='imbalanceCase'?'imbalance':b.id==='emptyMetricCase'?'empty':'cards';save();render();}if(b.id==='checkRepairs')updateRepair(true);if(b.id==='runCapstone'){state.capstoneResult=capstoneAnswer(state.capstone);save();const f=document.getElementById('capstoneOutput');f.textContent=state.capstoneResult.text;f.classList.toggle('bad',['unknown','blocked','unreachable'].includes(state.capstoneResult.kind));}if(b.id==='openCoverage')openDrawer('coverage');if(b.id==='downloadFinal'||b.id==='downloadWork')downloadWork();if(b.id==='sourcesBtn')openDrawer('sources');});
stage.addEventListener('input',e=>{const t=e.target;if(t.dataset.field){state.worksheet[t.dataset.field]=t.value;save();}if(t.dataset.neuron){state.neuron[t.dataset.neuron]=Number(t.value);save();updateNeuron();}if(t.dataset.count){state.counts[t.dataset.count]=t.value===''?null:Number(t.value);state.metricScenario='custom';save();updateMetrics();}});
stage.addEventListener('change',e=>{const t=e.target;if(t.id==='activation'){state.neuron.activation=t.value;save();updateNeuron();}if(t.id==='searchAlgorithm'||t.id==='costMode'||t.id==='roads'){state[t.id==='searchAlgorithm'?'algorithm':t.id]=t.value;resetSearch();updateSearch();document.getElementById('nodeDetail').textContent='Select a node to inspect its available neighbours.';}if(t.dataset.triGroup){state[t.dataset.triGroup][t.dataset.triKey]=t.value==='unknown'?null:t.value==='true';if(t.dataset.triGroup==='facts'){save();updateLogic();}else{state.capstoneResult=null;save();document.getElementById('capstoneOutput').textContent='Predict the answer with the changed facts.';document.getElementById('capstoneOutput').classList.remove('bad');}}if(t.dataset.sort){state.sort[t.dataset.sort]=t.value;state.sortChecked=false;save();document.querySelectorAll('.sort-card06').forEach(card=>{card.classList.remove('correct06','wrong06');card.querySelector('small')?.remove();});const f=document.getElementById('sortResult');f.classList.remove('bad');f.textContent='Choices changed. Check the sorting again.';}if(t.dataset.repair){state.repairs[t.dataset.repair]=t.value;save();updateRepair();}if(t.id==='capstoneQuestion'||t.id==='capstoneRoads'){state.capstone[t.id==='capstoneQuestion'?'question':'roads']=t.value;state.capstoneResult=null;save();document.getElementById('capstoneOutput').textContent='Predict the answer with the changed case.';document.getElementById('capstoneOutput').classList.remove('bad');}if(t.dataset.skill){state.skills[t.dataset.skill]=t.checked;save();}});
document.getElementById('prevBtn').onclick=()=>go(state.slide-1);document.getElementById('nextBtn').onclick=()=>go(state.slide+1);document.getElementById('outlineBtn').onclick=()=>openDrawer('outline');document.getElementById('glossaryBtn').onclick=()=>openDrawer('glossary');document.getElementById('teacherBtn').onclick=()=>openDrawer('notes');document.getElementById('coverageBtn').onclick=()=>openDrawer('coverage');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('fullscreenBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fullscreenBtn').textContent='Use browser full screen';}};
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer();const b=e.target.closest('button');if(!b)return;if(b.dataset.outlineGo!==undefined){closeDrawer();go(b.dataset.outlineGo);}if(b.id==='timerToggle'){timerRunning=!timerRunning;if(timerRunning)timerInterval=setInterval(()=>{if(seconds>0)seconds--;else{timerRunning=false;clearInterval(timerInterval);}updateTimer();},1000);else clearInterval(timerInterval);updateTimer();}if(b.id==='timerReset'){seconds=7200;timerRunning=false;clearInterval(timerInterval);updateTimer();}if(b.id==='exportCoverage')exportCoverage();});
document.getElementById('drawer').addEventListener('input',e=>{const t=e.target;if(t.id==='wordSearch')document.getElementById('wordList').innerHTML=glossaryHTML(t.value);if(t.dataset.officialRef){const n=t.dataset.officialRef;state.official[n]={...(state.official[n]||{}),reference:t.value,covered:false};const checkbox=document.querySelector('[data-official-covered="'+n+'"]');checkbox.checked=false;checkbox.disabled=!t.value.trim();save();updateCoverage();}});
document.getElementById('drawer').addEventListener('change',e=>{const t=e.target;if(t.dataset.officialCovered){const n=t.dataset.officialCovered;state.official[n]={...(state.official[n]||{}),covered:Boolean(t.checked&&state.official[n]?.reference?.trim())};save();updateCoverage();}});
document.addEventListener('keydown',e=>{const drawer=document.getElementById('drawer');if(e.key==='Escape'&&!drawer.hidden){closeDrawer();return;}if(!drawer.hidden){if(e.key==='Tab'){const all=[...drawer.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.slide-1);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(slides.length-1);}if(e.key.toLowerCase()==='n')openDrawer('notes');});
if(!state.engine)resetSearch();state.slide=Math.max(0,Math.min(slides.length-1,Number(state.slide)||0));render();

// Bright and dark themes share a local preference across the course.
function applyTheme(mode){const dark=mode==='dark';document.documentElement.dataset.theme=dark?'dark':'bright';const b=document.getElementById('themeBtn');if(b){b.textContent=dark?'☀ Bright theme':'☾ Dark theme';b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label','Switch to '+(dark?'bright':'dark')+' theme');}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#101c1c':'#f4f2e9';try{localStorage.setItem('aptech-ai-theme',dark?'dark':'bright');}catch(e){}}
let preferredTheme='bright';try{preferredTheme=localStorage.getItem('aptech-ai-theme')||'bright';}catch(e){}applyTheme(preferredTheme);
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'bright':'dark'));
</script></body></html>
