<script>'use strict';
const STORAGE='aptech-ai-session3-v1';
const INITIAL_CODE='frontier = ["Gate"]\ncurrent = frontier.pop(0)\nneighbours = ["Library", "Lab"]\nfrontier.extend(neighbours)\nprint(current)\nprint(frontier)';
const fresh={slide:0,answers:{},worksheet:{},agentType:'reflex',vacuum:{position:'A',dirty:{A:true,B:true},memory:{A:null,B:null},moves:0,cleans:0,steps:0,action:'Ready: the agent sees only its current room.'},algorithm:'bfs',costMode:'unit',roadScenario:'open',engine:null,agentFamily:'reflex',code:INITIAL_CODE,codeOutput:''};
let state;try{state={...structuredClone(fresh),...JSON.parse(localStorage.getItem(STORAGE)||'null')};}catch(e){state=structuredClone(fresh);}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true;}catch(e){return false;}}
const nodes={A:{name:'Gate',x:10,y:50},B:{name:'Library',x:36,y:23},C:{name:'Lab',x:36,y:77},D:{name:'Hall',x:62,y:23},E:{name:'Cafe',x:62,y:77},F:{name:'Delivery',x:88,y:50}};
const edges=[['A','B',1],['A','C',2],['B','C',1],['B','D',1],['C','E',2],['D','E',1],['D','F',8],['E','F',2]];
const algorithms={bfs:'Breadth-first (BFS)',dfs:'Depth-first (DFS)',ucs:'Uniform-cost (UCS)',greedy:'Greedy best-first',astar:'A* (A-star)'};
const heuristics={unit:{A:2,B:1,C:2,D:0,E:1,F:0},weighted:{A:3,B:2,C:3,D:1,E:2,F:0}};
const roadSets={open:[],gate:['A-B'],shortcut:['D-F'],isolated:['D-F','E-F']};
const sections=[{name:'Reconnect and define success',time:10,start:0},{name:'Formulate the problem',time:15,start:3},{name:'Agents and environments',time:15,start:7},{name:'Represent a search problem',time:15,start:12},{name:'Uninformed search',time:20,start:16},{name:'Costs and informed search',time:20,start:20},{name:'Your first search code',time:15,start:28},{name:'Practise and explain',time:10,start:32}];
function sectionFor(i){return sections.filter(s=>s.start<=i).at(-1);}
function panel(title,text,classes=''){return '<article class="panel stack '+classes+'"><h3>'+title+'</h3><p>'+text+'</p></article>';}
function note(text){return '<div class="note">'+text+'</div>';}
function field(key,label,placeholder=''){return '<label>'+label+'<textarea class="answer" data-field="'+key+'" placeholder="'+esc(placeholder)+'">'+esc(state.worksheet[key]||'')+'</textarea></label>';}
const quizData={recall:{q:'Does every AI task require a model trained on examples?',options:['Yes, every AI method must learn from examples.','No. Some tasks can use explicit knowledge, rules, or search.'],correct:1,why:'AI includes approaches beyond machine learning. In this lesson we use a known map and explicit search rules without training a neural model.'},state:{q:'Which describes a state in our simplified map problem?',options:['Being at the Library.','Move from Gate to Library.','Reach Delivery.'],correct:0,why:'A state describes the situation. A move is an action, and reaching Delivery is the goal condition.'},bfs:{q:'When all roads cost 1, what does BFS prioritise?',options:['States reached in fewer moves.','The smallest remaining-cost estimate.','The road that looks shortest in the drawing.'],correct:0,why:'BFS expands by number of steps from the start using a FIFO queue. With equal positive step costs, the fewest-step route is also cheapest.'},greedy:{q:'Greedy reaches a goal quickly. Does that prove its route is cheapest?',options:['Yes. First found always means cheapest.','No. It ignores the cost already spent when choosing by h.'],correct:1,why:'Greedy selects by estimated remaining cost h. On our weighted map it can choose a route costing 10 while a route costing 5 exists.'},exit1:{q:'What must come before choosing a search method?',options:['Choose the most famous algorithm.','Define states, actions, goal, constraints, and cost.'],correct:1,why:'The method needs a problem representation and a measure of success. Fewest moves and lowest cost are different objectives when costs vary.'},exit2:{q:'Why track already discovered or expanded states?',options:['To avoid pointless repeated exploration and cycles.','To give the agent human memory.'],correct:0,why:'Repeated-state handling prevents revisiting the same situation unnecessarily. It is an algorithmic record, not human-like memory.'},exit3:{q:'Which method uses g + h to choose the next candidate?',options:['BFS','Greedy best-first','A*'],correct:2,why:'g is the cost so far; h estimates remaining cost. A* chooses the lowest sum under its implementation’s tie-breaking rule.'}};
function quiz(id){const q=quizData[id],a=state.answers[id];return '<div class="stack"><h3>'+q.q+'</h3><div class="choices">'+q.options.map((o,i)=>'<button data-quiz="'+id+'" data-choice="'+i+'" aria-pressed="'+(a===i)+'">'+o+'</button>').join('')+'</div><div class="feedback '+(a!==undefined&&a!==q.correct?'bad':'')+'" id="feedback-'+id+'" aria-live="polite">'+(a===undefined?'':(a===q.correct?'Yes. ':'Revisit the reason. ')+q.why)+'</div></div>';}
function neighbours(id,mode,blocked=[]){return edges.filter(([a,b])=>(a===id||b===id)&&!blocked.includes(a+'-'+b)).map(([a,b,w])=>({node:a===id?b:a,cost:mode==='unit'?1:w})).sort((a,b)=>a.node.localeCompare(b.node));}
function makeEngine(algorithm='bfs',mode='unit',blocked=[]){return {algorithm,mode,blocked:[...blocked],frontier:[{node:'A',g:0,path:['A'],seq:0}],expanded:[],discovered:['A'],best:{A:0},seq:1,current:null,steps:0,result:null,message:'Start: Gate (A) is waiting in the frontier.'};}
function priority(record,e){const h=heuristics[e.mode][record.node];return e.algorithm==='ucs'?record.g:e.algorithm==='greedy'?h:e.algorithm==='astar'?record.g+h:record.seq;}
function orderedFrontier(e){const copy=e.frontier.slice();if(e.algorithm==='dfs')return copy.reverse();if(['ucs','greedy','astar'].includes(e.algorithm))return copy.sort((a,b)=>priority(a,e)-priority(b,e)||(e.algorithm==='astar'?heuristics[e.mode][a.node]-heuristics[e.mode][b.node]:0)||a.seq-b.seq);return copy;}
function stepEngine(e){if(e.result)return e;if(!e.frontier.length){e.result={found:false,path:[],cost:null};e.message='No route exists with these closures. The frontier is empty.';return e;}const chosen=orderedFrontier(e)[0];e.frontier=e.frontier.filter(r=>r.seq!==chosen.seq);e.current=chosen.node;e.steps++;if(chosen.node==='F'){e.result={found:true,path:chosen.path,cost:chosen.g};e.message='Goal selected: '+chosen.path.join(' → ')+'. Cost '+chosen.g+'.';return e;}if(!e.expanded.includes(chosen.node))e.expanded.push(chosen.node);const added=[];for(const next of neighbours(chosen.node,e.mode,e.blocked)){const g=chosen.g+next.cost,weighted=['ucs','astar'].includes(e.algorithm);if(weighted){if(g>=(e.best[next.node]??Infinity))continue;e.best[next.node]=g;e.frontier=e.frontier.filter(r=>r.node!==next.node);e.expanded=e.expanded.filter(n=>n!==next.node);}else if(e.discovered.includes(next.node))continue;if(!e.discovered.includes(next.node))e.discovered.push(next.node);e.frontier.push({node:next.node,g,path:[...chosen.path,next.node],seq:e.seq++});added.push(next.node);}e.message='Expand '+nodes[chosen.node].name+' ('+chosen.node+'). '+(added.length?'Add or improve '+added.join(', ')+'.':'No new or cheaper candidates.')+' '+(e.algorithm==='dfs'?'The stack selects its last-added item next.':e.algorithm==='bfs'?'The queue selects its oldest item next.':'Select the next candidate by its priority.');return e;}
function runEngine(algorithm,mode,blocked=[]){const e=makeEngine(algorithm,mode,blocked);for(let i=0;i<100&&!e.result;i++)stepEngine(e);return e;}
function resetSearch(){state.engine=makeEngine(state.algorithm,state.costMode,roadSets[state.roadScenario]);save();}
function mapMarkup(e=null,hero=false){const mode=e?.mode||state.costMode,blocked=e?.blocked||roadSets[state.roadScenario],path=hero?['A','B','D','E','F']:(e?.result?.found?e.result.path:[]);const pathEdges=path.slice(1).map((n,i)=>[path[i],n].sort().join('-'));return '<div class="campus-map"><svg class="map-roads" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+edges.map(([a,b])=>'<line class="road '+(blocked.includes(a+'-'+b)?'closed ':'')+(pathEdges.includes(a+'-'+b)?'route-road':'')+'" x1="'+nodes[a].x+'" y1="'+nodes[a].y+'" x2="'+nodes[b].x+'" y2="'+nodes[b].y+'"/>').join('')+'</svg>'+edges.map(([a,b,w])=>{const x=(nodes[a].x+nodes[b].x)/2+(nodes[a].x===nodes[b].x?4:0),y=(nodes[a].y+nodes[b].y)/2,closed=blocked.includes(a+'-'+b);return '<span class="edge-cost '+(closed?'closed':'')+'" style="left:'+x+'%;top:'+y+'%" aria-label="'+a+' to '+b+(closed?' closed':', cost '+(mode==='unit'?1:w))+'">'+(closed?'×':mode==='unit'?1:w)+'</span>';}).join('')+Object.entries(nodes).map(([id,n])=>{const status=path.includes(id)?'route-node':e?.expanded.includes(id)?'expanded-node':e?.frontier.some(r=>r.node===id)?'frontier-node':'';return '<button class="map-node '+status+' '+(e?.current===id?'current-node ':'')+(id==='F'?'goal-node':'')+'" style="left:'+n.x+'%;top:'+n.y+'%" data-node="'+id+'" aria-label="'+n.name+' ('+id+'), '+(id==='A'?'start':id==='F'?'goal':status.replace('-node','')||'unvisited')+'"><b>'+id+'</b><span>'+n.name+'</span></button>';}).join('')+'</div>';}
function searchControls(){return '<div class="search-controls"><label>Search method<select id="searchAlgorithm">'+Object.entries(algorithms).map(([id,label])=>'<option value="'+id+'"'+(state.algorithm===id?' selected':'')+'>'+label+'</option>').join('')+'</select></label><label>Road costs<select id="costMode"><option value="unit"'+(state.costMode==='unit'?' selected':'')+'>Every road costs 1</option><option value="weighted"'+(state.costMode==='weighted'?' selected':'')+'>Different road costs</option></select></label><label class="wide">Road condition<select id="roadScenario">'+[['open','All roads open'],['gate','Close Gate–Library (A–B)'],['shortcut','Close Hall–Delivery (D–F)'],['isolated','Isolate Delivery (close D–F and E–F)']].map(([id,label])=>'<option value="'+id+'"'+(state.roadScenario===id?' selected':'')+'>'+label+'</option>').join('')+'</select></label></div>';}
const agentFamilies={reflex:{name:'Simple reflex',question:'What condition do I observe now?',example:'Clean if the current room is dirty; otherwise move.',limit:'A current observation may omit information needed for a good decision.'},model:{name:'Model-based reflex',question:'What does my internal record suggest?',example:'Remember observations from rooms already visited.',limit:'The record can become outdated if the world changes unseen.'},goal:{name:'Goal-based',question:'Which actions can achieve my goal?',example:'Search for a route that reaches Delivery.',limit:'Reaching the goal alone does not decide every trade-off.'},utility:{name:'Utility-based',question:'Which outcome is preferable?',example:'Compare routes using cost, time, or other explicitly chosen preferences.',limit:'The score must represent what matters; preferences can conflict.'},learning:{name:'Learning agent',question:'How can experience improve my behaviour?',example:'Use feedback to improve a policy or model.',limit:'Learning can enhance other agent designs; these categories are not all mutually exclusive.'}};
const slides=[
{title:'Find a way forward',kicker:'Session 03 · problem solving, agents, and search',html:()=>'<div class="grid hero03"><div class="stack"><h1>Define the goal.<br><em>Find the route.</em></h1><p class="lead">Represent a problem, compare agents, and watch search methods make different choices on the same map.</p><div class="row"><span class="tag">Two book chapters</span><span class="tag">2-hour class</span><span class="tag">Bright + dark</span></div><p class="muted">A good solution starts with understanding the problem.</p></div><div class="hero-map">'+mapMarkup(null,true)+'<p class="map-caption">A fictional campus. Arrows between sessions change lessons; arrows below change slides.</p></div></div>',notes:'This official class combines Book Sessions 3 and 4: problem solving, agents, decomposition, search, and informed/uninformed techniques. The manual outline is the syllabus authority; the textbook detail and questions were not supplied. These are original supplementary activities. Test the local presentation before class. No API or internet is required for the experiments.'},
{title:'Reconnect: AI can solve problems in different ways',kicker:'Retrieval · explain the choice',html:()=>'<div class="grid two">'+quiz('recall')+panel('What carries forward?','From Session 2: choose the task carefully and inspect the result. Today, we can compute routes directly from known states and possible actions.','dark')+'</div>'+note('Tell a partner: when would learning from examples help, and when might a known rule or map be enough?'),notes:'About 3 minutes. Correct: not every AI approach requires machine learning. Search uses a problem model and a strategy for considering candidates. A learned model may supply a heuristic in some systems, but our map uses explicit fixed estimates. Avoid implying search and learning cannot be combined.'},
{title:'The route through this class',kicker:'120 minutes · build the meaning first',html:()=>'<div class="grid two"><div class="panel stack"><h3>You will be able to…</h3><ul><li>Define states, actions, goals, constraints, and costs.</li><li>Explain what an agent observes and does.</li><li>Trace BFS, DFS, uniform-cost, greedy, and A*.</li><li>Explain why fewest moves and cheapest route can differ.</li><li>Use a small Python list as a queue.</li></ul></div><div class="panel">'+sections.map((s,i)=>'<div class="agenda-row"><span class="muted">'+(i+1)+'</span><button data-go="'+s.start+'">'+s.name+'</button><span class="time">'+s.time+' min</span></div>').join('')+'</div></div>',notes:'Timing: reconnect 0–10; formulate 10–25; agents 25–40; representation 40–55; uninformed search 55–75; informed/cost-aware 75–95; Python 95–110; practice/exit 110–120. Core code introduces lists and one queue step. Complete BFS is an optional guided source file because functions, loops, and sets are additional prerequisites.'},
{title:'Deliver a package across campus',kicker:'Try before choosing an algorithm',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>The request</h3><p>“Get this package from Gate to Delivery.”</p><p>Ask what is missing before you plan a route.</p></div><div class="panel stack"><h3>Questions that change the answer</h3><ul><li>Which roads are open?</li><li>Are we minimising moves, time, or effort?</li><li>Can the agent use every road?</li><li>How do we know it has arrived?</li></ul></div></div>'+note('Class activity: invent a route, then explain what information you assumed. Those assumptions belong in the problem definition.'),notes:'About 4 minutes. Invite guesses first. Explain that “best route” is incomplete without a cost measure or goal. The classroom map omits capacity, deadlines, and uncertain traffic so we can inspect the search clearly. For a real system these omitted details might change the representation.'},
{title:'Give the problem a precise foundation',kicker:'Five parts with a purpose',html:()=>'<div class="grid three">'+panel('Initial state','Where the agent starts: at Gate, with the package.')+panel('Possible actions','Move along an open road to an adjacent location.')+panel('Transition','Describe the result of an action: the agent is now at the destination location.')+panel('Goal test','Check whether the agent has reached Delivery with the package.')+panel('Path cost','Add the cost of each action on the route.')+panel('Constraints','Restrictions such as closed roads or access rules.')+'</div>'+note('We simplify the search state to a location because the package is carried throughout. Change the task, and more state information may be necessary.'),notes:'About 3 minutes. Explain transition as how an action changes the state. A goal test is an explicit check. The state representation must retain information needed to decide valid actions and recognise success. Adding a pickup/delivery requirement or limited battery may require a state containing location plus additional facts.'},
{title:'Identify the state, action, and goal',kicker:'Interactive formulation check',html:()=>'<div class="grid two">'+quiz('state')+'<div class="panel stack"><h3>Match the other parts</h3><div class="form-grid">'+formulationField('start','At Gate','Initial state')+formulationField('action','Move along an open road','Action')+formulationField('goal','At Delivery','Goal test')+formulationField('cost','Sum road costs','Path cost')+'</div><button id="checkFormulation" class="primary">Check my matches</button><div id="formulationFeedback" class="feedback" aria-live="polite"></div></div></div>',notes:'About 4 minutes. The matches are: At Gate = initial state; move along open road = action; At Delivery = goal test; sum road costs = path cost. Ask for explanations after checking. Being at Library describes a state; moving there describes an action.'},
{title:'Break a larger problem into useful parts',kicker:'Decomposition with dependencies',html:()=>'<div class="decompose">'+panel('Understand and represent','Identify the package, start, goal, available actions, and restrictions.')+panel('Plan and compare','Find candidate routes and compare them using the chosen cost measure.')+panel('Act and check','Execute a valid route. Observe changes and check the goal.')+'</div><div class="worksheet">'+field('decomposition','Break “organise a class event” into three useful subtasks. Explain one dependency.','Which part needs information or work from an earlier part?')+'</div>'+note('Dividing a problem helps when the parts retain the information and relationships needed for the whole task.'),notes:'About 4 minutes. Example: define event goal/budget; book venue and schedule; organise materials and verify attendance. Dependencies matter: venue selection may depend on expected attendance. Breaking a problem into arbitrary independent chunks can lose important constraints.'},
{title:'An agent observes, decides, and acts',kicker:'Connect the system to its environment',html:()=>'<div class="flow">'+panel('Observe','Sensors or supplied data reveal something about the environment.')+'<span class="flow-arrow">→</span>'+panel('Choose','A rule, model, goal, or preference guides a decision.')+'<span class="flow-arrow">→</span>'+panel('Act','An action changes the environment or produces an effect.')+'</div><div class="grid two">'+panel('Cleaning robot','Observe the current room and choose to clean or move.','dark')+panel('Route-planning agent','Use a map and destination to choose a route; execution can require new observations.')+'</div>'+note('An agent is a system that acts in an environment. The word does not imply consciousness or human understanding.'),notes:'About 2 minutes. Ask students to identify observations and actions for a traffic-control system. “Percept” means observed information; “actuator” means a mechanism for acting. Keep terms grounded in the examples. A software agent’s environment can be another software system.'},
{title:'Different agent designs answer different questions',kicker:'Explore their purpose',compact:true,html:()=>'<div class="agent-type-grid">'+Object.entries(agentFamilies).map(([id,a])=>'<button data-agent-family="'+id+'" aria-pressed="'+(state.agentFamily===id)+'">'+a.name+'</button>').join('')+'</div><div class="panel family-detail" id="agentFamilyDetail" aria-live="polite"></div>'+note('These are useful design categories. Learning can improve several other designs; it is not a mutually exclusive replacement for goals or utility.'),notes:'About 3 minutes. Explain simple reflex, model-based reflex, goal-based, utility-based, and learning agents through their decision questions. Do not equate an internal model with perfect knowledge. The cleaning lab implements two simplified designs; the others are described through appropriate examples.'},
{title:'Does remembering change the robot’s behaviour?',kicker:'Live agent lab · observe one room at a time',compact:true,html:()=>'<div class="search-layout"><div class="stack"><div class="tabs"><button data-vacuum-type="reflex" aria-pressed="'+(state.agentType==='reflex')+'">Simple reflex</button><button data-vacuum-type="model" aria-pressed="'+(state.agentType==='model')+'">With remembered observations</button></div><div class="agent-room-grid" id="agentRooms"></div><p class="map-caption">You can see both rooms. The agent senses only the room it occupies.</p></div><div class="stack"><div class="agent-actions"><button id="agentStep" class="accent">One agent action</button><button id="agentReset">Reset</button></div><div class="trace-result" id="agentAction" aria-live="polite"></div><div class="agent-memory" id="agentMemory" aria-live="polite"></div><div class="search-metrics" id="agentStats" aria-live="polite"></div><p class="lab-note">Clean costs 2 units; move costs 1. Observe how each rule behaves after both rooms are clean.</p></div></div>',notes:'About 5 minutes. Both rooms begin dirty and the agent begins in A. Simple reflex: clean current dirty room, otherwise move to the other. Model-based: record current observation; clean if dirty; if both remembered rooms are clean, wait; otherwise move. The model-based version cleans both rooms in 3 actions and waits on the fourth. The reflex version keeps moving. After memory says both are clean, dirty the other room without informing the agent; its memory can become outdated. The global display is for the class, not additional sensor data.'},
{title:'Goals and preferences change the decision',kicker:'Choose what “good” means',html:()=>'<div class="grid two">'+panel('Goal-based','“Reach Delivery.” Any valid route that arrives can satisfy the goal.')+panel('Utility-based','“Reach Delivery while keeping cost low.” A preference measure helps compare successful routes.')+'</div>'+note('A model may remember observations. A goal specifies success. A utility or preference measure compares outcomes. These roles can coexist.')+'<p class="lead">Pair task: two routes arrive. One costs 10 and another costs 5. What additional preference makes the second route better?</p>',notes:'About 2 minutes. Answer: prefer lower total cost, assuming other relevant factors equal. A goal can include constraints such as a deadline; utility handles preferences among possible outcomes. Avoid implying a single score perfectly captures every human concern. This map uses a deliberately simple cost objective.'},
{title:'The environment determines what the agent needs',kicker:'Name the assumptions',html:()=>'<div class="environment-list">'+panel('Fully or partly observed','A known map can be fully available; the cleaning robot sees only its current room.')+panel('Deterministic or uncertain','Our move outcomes are fixed. Real traffic or obstacles can make outcomes uncertain.')+panel('Static or changing','The search lab holds roads fixed during a run. A live environment can change while the agent plans.')+panel('Discrete or continuous','Our map has a finite set of named locations. A physical robot’s position can vary continuously.')+'</div>'+note('Our delivery example uses one planning agent. In a multi-agent setting, other agents’ actions can affect what happens.'),notes:'About 3 minutes. These are modelling distinctions rather than labels that solve the problem. Ask students to explain which assumptions fail for a robot in a busy hallway. If roads change during execution, it may need to observe and replan. The small lab does not model every real-world complication.'},
{title:'Search means considering possible action sequences',kicker:'A general problem-solving idea',html:()=>'<div class="grid two">'+panel('The search question','Which sequence of valid actions leads from the initial state to a goal?','dark')+panel('A search strategy','Decides which candidate to examine next. Different strategies use different priorities.')+'</div><div class="flow">'+panel('Formulate','Represent states, actions, goal, and cost.')+'<span class="flow-arrow">→</span>'+panel('Search','Consider candidates until a goal or failure is established.')+'<span class="flow-arrow">→</span>'+panel('Execute','Carry out the selected plan and check the result.')+'</div>'+note('Search is a general tool for well-represented problems. It is not a promise that every problem can be solved efficiently.'),notes:'About 3 minutes. Explain the manual’s “universal problem-solving” phrase as a broad reusable framework. It requires a suitable representation; large or poorly understood spaces can be difficult. Searching a state space differs from entering a web search query, though both can involve exploring possible answers.'},
{title:'A graph keeps useful structure',kicker:'Locations and connections',html:()=>'<div class="grid three">'+panel('Node / state','A location such as Gate or Library.')+panel('Edge / action link','An available connection between two locations.')+panel('Path','A sequence of connected locations; its cost adds the action costs.')+'</div><div class="route-line">A → B → D → F</div>'+note('A graph is a representation. Our roads work in both directions. The drawing’s geometry is decorative; the stated edge costs determine the route cost.'),notes:'About 3 minutes. Explain that a state and graph node are associated in this simple example, but a search record also needs a path or parent and its cost. The physical-looking layout does not imply straight-line distances. Edge labels are arbitrary positive teaching costs, not measured campus travel times.'},
{title:'Read the campus map before searching',kicker:'Interactive map · inspect a location',compact:true,html:()=>'<div class="search-layout"><div class="panel stack">'+mapMarkup()+'<p class="map-caption">A is the start. F is the goal. A number on a road is its action cost.</p></div><div class="panel stack"><h3>What can we do from here?</h3><p>Tap a location to inspect its open neighbours.</p><div id="mapInfo" class="node-info" aria-live="polite"></div><p>Start at A. List the first valid actions, then explain why jumping straight to F is invalid.</p><p class="small muted">This map uses '+(state.costMode==='unit'?'unit':'different')+' costs. Change costs in the search lab later.</p></div></div>',notes:'About 4 minutes. Gate A has neighbours B and C if all roads are open. There is no A–F edge, so that jump is not a valid action. Tap nodes and have students list connections before seeing the text. The lab’s current road scenario is reused; restore all roads open when first teaching this slide if needed.'},
{title:'Frontier and expanded states have different jobs',kicker:'Keep track of the search',html:()=>'<div class="grid two">'+panel('Frontier','Candidate states discovered and waiting to be selected. Each candidate also stores its route so far.')+panel('Expanded states','States whose neighbours have already been considered. This record helps avoid unnecessary repeats.')+'</div><div class="queue-big"><span>A: Gate</span><b class="queue-arrow">→ expand →</b><span>B: Library</span><span>C: Lab</span></div>'+note('Discovering the goal and selecting the goal are different events. Cost-aware methods must not stop merely because an expensive goal candidate was first added.'),notes:'About 5 minutes. Define expand as generate or inspect valid successors. Our lab tracks discovered nodes for BFS/DFS/greedy; cost-aware methods can improve a cheaper route to a discovered node and replace its candidate. The terminology matters because stopping when a goal is added can produce a costly route before a cheaper candidate is explored.'},
{title:'Breadth-first search: explore by number of moves',kicker:'Uninformed search · a queue',html:()=>'<div class="grid two"><div class="panel stack"><h3>First in, first out</h3><p>Take the oldest candidate. Add newly discovered candidates at the end.</p><div class="queue-big"><span>B</span><span>C</span><span>D</span></div><p class="small muted">Next: B, because it was added first.</p></div>'+quiz('bfs')+'</div>'+note('BFS uses the problem’s connections, not a remaining-cost estimate. It finds fewest moves; this is cheapest only under suitable step-cost assumptions.'),notes:'About 4 minutes. Here all step costs are positive and equal in unit mode, so BFS is cost-optimal. It does not generally minimise the sum of unequal edge costs. Our finite graph with repeated-state handling permits exhaustive search; avoid general completeness claims without assumptions for infinite graphs.'},
{title:'Depth-first search: follow a branch',kicker:'Uninformed search · a stack',html:()=>'<div class="grid two">'+panel('Last in, first out','Take the newest candidate first. Follow one branch before returning to alternatives.','dark')+panel('The trade-off','A goal can be found without exploring every shallow branch, but the resulting path is not guaranteed to use the fewest moves or the lowest cost.')+'</div><div class="queue-big"><span>B · added first</span><span>C · added last</span><b class="queue-arrow">→ select C</b></div>'+note('Order matters. In our implementation, neighbours are added alphabetically; the DFS stack selects the last one first.'),notes:'About 3 minutes. On our map, Gate adds B then C, so DFS selects C. This finite graph uses repeated-state checks; a DFS without those safeguards can loop. DFS can use less frontier space than BFS in many tree-search settings, but do not claim a universal memory advantage for every graph implementation.'},
{title:'Watch the search make its choices',kicker:'Live lab · predict the next candidate',compact:true,html:()=>'<div class="search-layout"><div class="panel stack" id="searchMapPanel"></div><div class="stack">'+searchControls()+'<div class="search-buttons"><button id="searchStep" class="accent">One search step</button><button id="searchRun" class="primary">Run to result</button><button id="searchReset">Reset</button></div><div class="trace-result" id="searchResult" aria-live="polite"></div><div><p class="frontier-title">Frontier · next candidate first</p><div class="queue-strip" id="frontierList"></div></div><div class="visited-strip" id="expandedList"></div><div class="search-metrics" id="searchStats"></div></div></div>',notes:'About 8 minutes. Start with BFS, unit costs, all roads open. Before each click ask which frontier candidate is oldest. Expand A, B, C, D, E; select F. Route A–B–D–F is 3 moves and cost 3. Switch to DFS and predict why C is selected before B. The methods run locally; route and frontier are computed. Changing method, costs, or road conditions resets the run so incompatible candidate records are not reused.'},
{title:'Explain the BFS trace',kicker:'The result needs a reason',html:()=>'<div class="grid two"><div class="panel stack"><h3>First two expansions</h3><p>Start frontier: [A]<br>Expand A → frontier [B, C]<br>Expand B → frontier [C, D]</p><p class="small muted">C is already discovered. Adding it again is unnecessary for BFS.</p></div><div class="worksheet">'+field('bfsTrace','Continue the trace in unit-cost mode, then explain why the result has three moves.','Frontier changes and final path.')+'</div></div>'+note('A valid route still needs evaluation against the actual objective. Change the costs, and three moves may be expensive.'),notes:'About 5 minutes. After expanding C, frontier [D,E]. After D, [E,F]. After E, [F]. Selecting F finds A–B–D–F. Expanded nodes are A,B,C,D,E; goal selection is not an expansion in this lab. Each edge costs 1, so path cost 3. The goal record carries its path; order affects which equally short path is selected.'},
{title:'Informed search adds a useful estimate',kicker:'Introduce a heuristic',html:()=>'<div class="grid two">'+panel('Uninformed','Choose using the problem’s basic structure and, for uniform-cost, costs so far.')+panel('Informed','Use an additional estimate of remaining cost to guide which candidate looks promising.','green')+'</div><div class="priority-equation"><b>h</b><span>= estimated remaining cost</span></div>'+note('Our h values are chosen lower-bound teaching estimates. They are not measured from the drawing, and they are not automatically exact.'),notes:'About 3 minutes. Explain h as a heuristic, a task-specific estimate. A lower estimate does not mean the route already taken was cheap. In this lab heuristics are explicitly defined for unit and weighted modes and checked for consistency on the available edges.'},
{title:'Greedy best-first can be tempted by the goal',kicker:'Choose by h alone',html:()=>'<div class="grid two">'+panel('Its next-candidate rule','Select the candidate with the smallest estimated remaining cost h.','dark')+quiz('greedy')+'</div><div class="route-line">Weighted map: A → B → D → F = 1 + 1 + 8 = 10</div>'+note('At D, F has h = 0, so greedy selects it. That does not account for the expensive D–F road.')+'<button id="openGreedy" class="primary">Try greedy with different road costs →</button>',notes:'About 3 minutes. Weighted h values: A3 B2 C3 D1 E2 F0. Greedy goes A–B–D–F and returns cost10. A valid route A–B–D–E–F costs5. This is a concrete demonstration, not a claim that greedy is always worse or always faster than other methods.'},
{title:'Uniform-cost search pays attention to cost so far',kicker:'Choose the lowest g',html:()=>'<div class="priority-equation"><b>g</b><span>= total cost from the start so far</span></div><div class="grid two">'+panel('A useful rule','Select the lowest-cost candidate so far. If a cheaper route to a candidate is found, keep that improvement.')+panel('Our weighted result','A → B → D → E → F<br>Cost = 1 + 1 + 1 + 2 = 5','green')+'</div>'+note('Uniform-cost uses no remaining-cost heuristic, so it is an uninformed strategy. Our positive costs and finite graph support its cheapest-route result.')+'<button id="openUCS" class="primary">Trace uniform-cost on the weighted map →</button>',notes:'About 3 minutes. Important implementation detail: goal success is accepted when the goal is selected at the appropriate priority, not on first discovery. The first expensive F record can be replaced by a cheaper route via E. General proofs require assumptions; our graph is finite with positive edge costs.'},
{title:'A* combines cost so far with estimated cost remaining',kicker:'Understand the priority',html:()=>'<div class="priority-equation"><b>f = g + h</b><span>Choose the smallest sum.</span></div><div class="grid three">'+panel('g: what we have spent','At E via A–B–D–E, g = 3.')+panel('h: what remains, estimated','Our weighted estimate at E is h = 2.')+panel('f: estimated total','3 + 2 = 5. The candidate looks better than the expensive goal with g = 10.')+'</div>'+note('The estimate guides the search. Its quality and the search implementation determine which guarantees apply.')+'<button id="openAstar" class="primary">Trace A* on the weighted map →</button>',notes:'About 3 minutes. Our A* uses a consistent heuristic and supports cheaper path updates. It selects minimum f, then smaller h for equal f, then earlier insertion order. Under these finite positive-cost conditions it returns cost5. The result is computed, not a pre-recorded animation. Tie rules can change explored order while preserving the optimal result under the assumptions.'},
{title:'Compare methods on the same problem',kicker:'Interactive comparison · keep the objective fixed',compact:true,html:()=>'<div class="row"><div class="tabs"><button data-compare-mode="unit" aria-pressed="'+(state.costMode==='unit')+'">Every road costs 1</button><button data-compare-mode="weighted" aria-pressed="'+(state.costMode==='weighted')+'">Different road costs</button></div><button id="compareResetRoads">Open all roads</button></div><div class="table-wrap" id="comparisonTable" aria-live="polite"></div><p class="algorithm-notes" id="comparisonNotes"></p>'+note('Moves count actions. Cost adds road costs. Expanded states count whose neighbours were considered; selecting the goal is not counted as expansion.'),notes:'About 4 minutes. In weighted mode, BFS returns cost10, DFS returns cost6 with this neighbour order, greedy returns10, UCS and A* return5. In unit mode all these runs return a 3-move route costing3, but DFS/greedy are not generally optimal. A* tie-breaking reduces expansions in this particular weighted example, not universally. Closures from the main lab persist unless the Open all roads button is clicked.'},
{title:'Why the A* estimate needs conditions',kicker:'A guarantee comes with assumptions',html:()=>'<div class="grid two">'+panel('Admissible estimate','Never overestimate the true cheapest remaining cost. h = 0 is allowed, but gives little guidance.')+panel('Consistent estimate','Across a road, h at the current node is no greater than that road’s cost plus h at the next node.')+'</div><div class="formula">At D: h(D) = 1<br>Road D → E costs 1; h(E) = 2<br>1 ≤ 1 + 2</div>'+note('This lab uses consistent estimates, positive costs, a finite graph, and cheaper-path updates. A* is not “always perfect” with arbitrary estimates or implementation choices.'),notes:'About 2 minutes. The formula explains consistency with one concrete edge. All open undirected edges have been checked in both directions. Closing roads does not create a cheaper remaining route, so these lower bounds remain valid. A* with zero heuristic behaves like uniform-cost. Detailed proof is optional; students should state the practical conditions.'},
{title:'What if no route is possible?',kicker:'A useful failure result',html:()=>'<div class="grid two">'+panel('Close both roads into Delivery','F has no available incoming connection. A search should not invent a path.')+panel('Explore and stop','On this finite graph, exhaust the frontier using repeated-state checks. Return “no route” when candidates run out.')+'</div>'+note('Failure here means no route exists in this model with these closures. It does not prove no solution exists under every possible real-world action.')+'<button id="openFailure" class="primary">Isolate Delivery and investigate →</button>',notes:'About 2 minutes. Close D–F and E–F. The five remaining locations can be explored, then the frontier empties. Returning no route is correct for the represented graph. Repeated-state checks avoid cycles such as A–B–A indefinitely. In real applications, the model or action set may need revisiting.'},
{title:'The same idea appears in other tasks',kicker:'Transfer the representation',html:()=>'<div class="grid three">'+panel('Puzzles','State: a board arrangement. Action: a legal move. Goal: the desired arrangement.')+panel('Robot planning','State: relevant position and environment facts. Action: a valid movement or operation.')+panel('Scheduling','State: a partial schedule. Action: assign another task while satisfying constraints.')+'</div><div class="worksheet">'+field('transfer','Choose a new task. Name a state, an action, a goal, and one restriction.','Use a familiar task and keep it small.')+'</div>'+note('Search can operate over abstract states. A location map is only one way to make the idea visible.'),notes:'About 3 minutes. Other problem-solving techniques include reasoning with rules, constraint satisfaction, planning, optimisation, and learning-based approaches. Choose by the task. Search spaces can become large; decomposition, abstraction, or a useful heuristic can help but do not remove every difficulty.'},
{title:'A Python list can hold candidates in order',kicker:'Programming foundation · build on variables',html:()=>'<pre class="code">frontier = ["Gate"]</pre><div class="grid three">'+panel('Square brackets','[ ] make a list: an ordered collection of values.')+panel('Quoted items','"Gate" is a string. A comma separates items when the list has more than one.')+panel('Position zero','Python counts the first list position as 0. A FIFO queue can remove the item at this position.')+'</div>'+note('Lists let a program remember several candidates. Today’s core code shows one expansion; it is not the complete search algorithm.'),notes:'About 3 minutes. Reuse Session 1 variables and strings. Explain a list as ordered values. Show ["Gate", "Library"] with two items. Position0 means the first item, not “no item”. A Python list is sufficient for this tiny queue demonstration; large FIFO queues often use a more efficient data structure such as deque.'},
{title:'Run one queue step',kicker:'Live code · predict the stored values',compact:true,html:()=>'<div class="grid two"><div class="stack"><label for="codeEditor">Modify the names, then run:</label><textarea id="codeEditor" class="editor code03" spellcheck="false" autocapitalize="off">'+esc(state.code)+'</textarea><div class="row"><button id="runCode" class="accent">Run queue example</button><button id="restoreCode">Restore example</button></div><p class="code-caption">Limited teaching interpreter for lists of strings, assignment, pop(), extend(), append(), and print(). It is not a full Python runtime.</p></div><div class="stack"><h3>Output</h3><div class="console" id="codeOutput" aria-live="polite">'+esc(state.codeOutput||'Predict current and frontier before running.')+'</div>'+panel('What should happen?','Remove Gate from the queue and store it as current. Add Library and Lab. The queue now contains those two candidates.')+'<a href="queue_step.py" download class="small">Download the matching real Python example</a></div></div>',notes:'About 5 minutes. Expected output: Gate then [\'Library\', \'Lab\']. Explain .pop(0): operate on the list named frontier, remove position0 and return that value. .extend(neighbours) adds the items in the neighbours list. This is one queue expansion without a full graph lookup, goal loop, or visited record. Browser output uses a limited subset; real Python is provided separately.'},
{title:'Why each line is needed',kicker:'Inspect the code’s purpose',html:()=>'<div class="line-buttons03">'+queueLines.map((x,i)=>'<button data-code-line="'+i+'">Line '+(i+1)+'</button>').join('')+'</div><div class="panel detail stack" id="lineDetail" aria-live="polite"><h3>Choose a line to inspect.</h3><p>Connect its syntax to the queue operation and explain what would change without it.</p></div><pre class="code">'+esc(INITIAL_CODE)+'</pre>',notes:'About 4 minutes. Explain all six lines and the new dot/method notation. current receives the removed value. extend changes the frontier in place. print makes values observable. If the list is empty, pop raises an error; if a variable was not defined, it cannot be used. Students should change names consistently rather than memorise these exact names.'},
{title:'From one queue step to complete BFS',kicker:'Core idea · optional full implementation',html:()=>'<div class="flow">'+panel('While candidates remain','Select the oldest candidate.')+'<span class="flow-arrow">→</span>'+panel('Check the goal','If it is the goal, return its route.')+'<span class="flow-arrow">→</span>'+panel('Expand safely','Add valid undiscovered neighbours, then repeat.')+'</div>'+note('The full program also needs a graph, a loop, conditions, a discovered-state record, and a way to keep the path. These are extra programming foundations.')+'<div class="row"><a href="breadth_first_search.py" download>Download the commented full BFS example</a><button id="codeGuideBtn">Explain the full program</button></div><p class="small muted">For this equal-cost map, the full program returns A → B → D → F. Core students can trace the algorithm on paper before implementing the complete version.</p>',notes:'About 3 minutes. The downloadable source comments explain each operation. It uses a dictionary for adjacency, a function, a while loop, a condition, a for loop, a set, membership checks, lists of paths, and return. Those are optional additional prerequisites, not silently assumed. Explain the high-level loop first. The core lesson and self-study do not require mastery of every Python construct today.'},
{title:'Make a route—and defend it',kicker:'Independent practical · 4 minutes',html:()=>'<div class="worksheet grid two">'+field('practicalRoute','Find a route with different road costs. Write its moves and total cost.','Try BFS, then compare UCS or A*.')+field('practicalWhy','Explain why the methods may choose different routes.','Which priority does each method use?')+'</div><div class="panel stack"><h3>Then change the problem</h3><p>Close Gate–Library. Find a valid route and explain which assumptions changed. If Delivery is isolated, explain why “no route” is appropriate.</p></div><div class="row"><button data-go="18">Open the search lab</button><button id="downloadWork" class="primary">Download my worksheet</button></div>',notes:'Allow 4 minutes. Weighted all-open optimal path A–B–D–E–F costs5. BFS chosen path A–B–D–F costs10. Closing A–B produces cheapest A–C–E–F cost6. A valid explanation identifies the priority and objective. Students can reuse the lab or work on paper. Do not grade only whether they chose the algorithm name.'},

const queueLines=[['frontier = ["Gate"]','Create an ordered list containing the start. The square brackets make a list; the quoted item is text.'],['current = frontier.pop(0)','The dot selects an operation on frontier. pop(0) removes and returns the item at position0; assignment stores it as current.'],['neighbours = ["Library", "Lab"]','Create a list of newly available candidates. The comma separates the two text values.'],['frontier.extend(neighbours)','Add the items from neighbours to the end of frontier. This changes the existing list and preserves FIFO order.'],['print(current)','Display the value removed from the queue, so we can inspect which candidate was selected.'],['print(frontier)','Display the candidates still waiting, so we can check the queue after the update.']];
function showAgentFamily(){const a=agentFamilies[state.agentFamily];document.querySelectorAll('[data-agent-family]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.agentFamily===state.agentFamily));document.getElementById('agentFamilyDetail').innerHTML='<div class="stack"><h3>'+a.name+'</h3><p>'+a.question+'</p></div><div class="stack"><p><b>Example:</b> '+a.example+'</p><p class="small muted"><b>Limit:</b> '+a.limit+'</p></div>';}
function agentStep(){const v=state.vacuum,current=v.position,other=current==='A'?'B':'A';v.steps++;if(state.agentType==='model')v.memory[current]=v.dirty[current];if(v.dirty[current]){v.dirty[current]=false;if(state.agentType==='model')v.memory[current]=false;v.cleans++;v.action='Observe '+current+' as dirty. Clean it; the agent remains in '+current+'.';}else if(state.agentType==='model'&&v.memory.A===false&&v.memory.B===false){v.action='Both rooms are remembered clean. Wait. This decision uses the internal record.';}else{v.position=other;v.moves++;v.action='Observe '+current+' as clean. Move to '+other+'. The other room is sensed on the next action.';}save();updateAgent();}
function updateAgent(){const v=state.vacuum;document.querySelectorAll('[data-vacuum-type]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.vacuumType===state.agentType));document.getElementById('agentRooms').innerHTML=['A','B'].map(room=>'<div class="agent-room '+(v.position===room?'current-room ':'')+(v.dirty[room]?'dirty-room':'')+'"><h3>Room '+room+'</h3><div class="robot-spot">'+(v.position===room?'<span class="robot-icon" aria-label="Robot here">: ]</span>':'<span aria-hidden="true">·</span>')+'</div><span class="room-tag">World state: '+(v.dirty[room]?'dirty':'clean')+'</span><button data-dirty-room="'+room+'">Make '+room+' '+(v.dirty[room]?'clean':'dirty')+'</button></div>').join('');document.getElementById('agentAction').textContent=v.action;const known=r=>v.memory[r]===null?'unknown':v.memory[r]?'dirty':'clean';document.getElementById('agentMemory').textContent=state.agentType==='model'?'Remembered observations: A '+known('A')+' · B '+known('B'):'Reflex rule uses only the current room observation; no room-history record guides its decision.';document.getElementById('agentStats').innerHTML='<div class="stat">Clean actions<b>'+v.cleans+'</b></div><div class="stat">Move actions<b>'+v.moves+'</b></div><div class="stat">Action cost<b>'+(2*v.cleans+v.moves)+'</b></div>';}
function updateSearch(){const e=state.engine;document.getElementById('searchMapPanel').innerHTML=mapMarkup(e)+'<div class="map-key"><span><i class="key-dot frontier-key"></i>Frontier</span><span><i class="key-dot expanded-key"></i>Expanded</span><span><i class="key-dot route-key"></i>Route found</span></div><div id="nodeInfo" class="node-info" aria-live="polite">Tap a location to inspect neighbours and its estimate.</div><p class="map-caption">Undirected roads · positive costs · drawing not to scale</p>';const result=document.getElementById('searchResult');result.innerHTML='<b>'+esc(e.message)+'</b><span class="small">'+(e.result?(e.result.found?'The goal was selected; inspect the route and total cost.':'No candidates remain in this represented graph.'):e.algorithm==='bfs'?'Select by arrival order.':e.algorithm==='dfs'?'Select last-added candidate.':e.algorithm==='ucs'?'Select the smallest cost so far g.':e.algorithm==='greedy'?'Select the smallest remaining estimate h.':'Select smallest g + h, then smaller h, then insertion order.')+'</span>';result.classList.toggle('bad',e.result?.found===false);document.getElementById('frontierList').innerHTML=orderedFrontier(e).map(r=>'<span class="queue-chip"><b>'+r.node+'</b><span>g '+r.g+(e.algorithm==='greedy'||e.algorithm==='astar'?' · h '+heuristics[e.mode][r.node]:'')+(e.algorithm==='astar'?' · f '+priority(r,e):'')+'</span></span>').join('')||'<span class="empty-frontier">No candidates waiting.</span>';document.getElementById('expandedList').textContent='Expanded: '+(e.expanded.join(' → ')||'none yet');document.getElementById('searchStats').innerHTML='<div class="stat">Selections<b>'+e.steps+'</b></div><div class="stat">Route moves<b>'+(e.result?.found?e.result.path.length-1:'—')+'</b></div><div class="stat">Route cost<b>'+(e.result?.found?e.result.cost:'—')+'</b></div>';document.getElementById('searchStep').disabled=!!e.result;document.getElementById('searchRun').disabled=!!e.result;}
function showNode(id){const el=document.getElementById('nodeInfo')||document.getElementById('mapInfo');if(!el)return;const e=state.engine,mode=state.costMode,blocked=roadSets[state.roadScenario],ns=neighbours(id,mode,blocked);el.textContent=nodes[id].name+' ('+id+'): '+(ns.length?'open neighbours '+ns.map(n=>n.node+' (cost '+n.cost+')').join(', '):'no open neighbours')+'. Remaining-cost estimate h = '+heuristics[mode][id]+'.';}
function updateComparison(){const blocked=roadSets[state.roadScenario],results=Object.keys(algorithms).map(a=>runEngine(a,state.costMode,blocked)),found=results.filter(e=>e.result.found),best=found.length?Math.min(...found.map(e=>e.result.cost)):null;document.querySelectorAll('[data-compare-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.compareMode===state.costMode));document.getElementById('comparisonTable').innerHTML='<table class="algorithm-table"><thead><tr><th>Method</th><th>Route</th><th>Moves</th><th>Cost</th><th>Expanded</th></tr></thead><tbody>'+results.map(e=>'<tr class="'+(e.result.found&&e.result.cost===best?'best-row':'')+'"><td>'+algorithms[e.algorithm]+'</td><td class="route-cell">'+(e.result.found?e.result.path.join(' → '):'No route')+'</td><td>'+(e.result.found?e.result.path.length-1:'—')+'</td><td>'+(e.result.found?e.result.cost:'—')+'</td><td>'+e.expanded.length+'</td></tr>').join('')+'</tbody></table>';document.getElementById('comparisonNotes').textContent='Cost mode: '+(state.costMode==='unit'?'every road costs 1':'different road costs')+'. Road condition: '+state.roadScenario+'. Highlighted rows share the lowest returned cost in this experiment. This does not give every method a general optimality guarantee.';}
function runTeachingCode(source){const env=Object.create(null),output=[];function value(raw,line){const s=raw.trim();if(s.startsWith('[')&&s.endsWith(']')){const inside=s.slice(1,-1),pattern=/^\s*(?:(?:"[^"\\]*"|'[^'\\]*')(?:\s*,\s*(?:"[^"\\]*"|'[^'\\]*'))*)?\s*$/;if(!pattern.test(inside))throw new Error('Line '+line+': use a list of quoted text items separated by commas.');return [...inside.matchAll(/"([^"\\]*)"|'([^'\\]*)'/g)].map(m=>m[1]??m[2]);}if(/^"[^"\\]*"$|^'[^'\\]*'$/.test(s))return s.slice(1,-1);const pop=s.match(/^([A-Za-z_]\w*)\.pop\(\s*(-?\d+)?\s*\)$/);if(pop){const list=env[pop[1]];if(!Array.isArray(list))throw new Error('Line '+line+': '+pop[1]+' must be a defined list.');let index=pop[2]===undefined?list.length-1:Number(pop[2]);if(index<0)index=list.length+index;if(index<0||index>=list.length)throw new Error('Line '+line+': pop index is outside the list, or the list is empty.');return list.splice(index,1)[0];}if(/^[A-Za-z_]\w*$/.test(s)){if(!Object.hasOwn(env,s))throw new Error('Line '+line+': NameError — '+s+' has not been assigned.');return env[s];}throw new Error('Line '+line+': unsupported value. Use a text value, list of text, or assigned name.');}function display(v){return Array.isArray(v)?'['+v.map(s=>"'"+s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'").join(', ')+']':String(v);}try{for(const [index,raw] of source.replace(/\r/g,'').split('\n').entries()){const line=raw.trim(),n=index+1;if(!line||line.startsWith('#'))continue;const assignment=line.match(/^([A-Za-z_]\w*)\s*=\s*(?!=)(.+)$/),operation=line.match(/^([A-Za-z_]\w*)\.(extend|append)\((.*)\)$/),print=line.match(/^print\((.*)\)$/);if(assignment)env[assignment[1]]=value(assignment[2],n);else if(operation){const list=env[operation[1]],arg=value(operation[3],n);if(!Array.isArray(list))throw new Error('Line '+n+': the target must be a defined list.');if(operation[2]==='extend'){if(!Array.isArray(arg))throw new Error('Line '+n+': extend expects another list in this teaching subset.');list.push(...arg);}else {if(typeof arg!=='string')throw new Error('Line '+n+': append expects a text item in this teaching subset.');list.push(arg);}}else if(print)output.push(display(value(print[1],n)));else throw new Error('Line '+n+': unsupported instruction. This page teaches a small list/queue subset.');}return output.length?output.join('\n'):'No output. Use print() to inspect a value.';}catch(e){return (output.length?output.join('\n')+'\n':'')+e.message;}}
const glossary=[['Problem formulation','Choose the states, actions, goal, constraints, and cost relevant to the task.'],['State','A representation of the situation at a point in the problem.'],['Action','A permitted operation that changes the situation.'],['Transition','How an action changes one state into another.'],['Goal test','A check that determines whether a state satisfies the goal.'],['Path cost','The accumulated cost of actions in a route.'],['Agent','A system that observes and acts in an environment.'],['Percept','Information an agent observes.'],['Internal model','A record or representation used to reason about information not directly observed now.'],['Utility','A preference measure for comparing outcomes.'],['Graph','Nodes and connections representing useful relationships.'],['Frontier','Discovered candidates waiting to be selected.'],['Expansion','Consider a selected state’s valid successors.'],['BFS','Breadth-first search: select by depth using a FIFO queue.'],['DFS','Depth-first search: follow a branch using a LIFO stack.'],['Uniform-cost search','Select the candidate with the lowest accumulated path cost g.'],['Heuristic','An estimate used to guide the search, here remaining cost h.'],['Greedy best-first','Select by remaining-cost estimate h alone.'],['A*','Select by accumulated cost g plus estimated remaining cost h.'],['Admissible','A remaining-cost estimate that never overestimates the true cheapest remaining cost.'],['Consistent heuristic','For every transition, current h is no greater than its cost plus the successor h.'],['List','An ordered collection of values in Python.'],['Queue / FIFO','Select the earliest-added candidate first.'],['Stack / LIFO','Select the latest-added candidate first.'],['Method','An operation accessed on a value, such as frontier.pop(0).']];

function timerText(){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function updateTimer(){const v=document.getElementById('timerValue'),b=document.getElementById('timerToggle');if(v)v.textContent=timerText();if(b)b.textContent=timerRunning?'Pause':'Start';}
function openDrawer(type){lastFocus=document.activeElement;document.getElementById('drawer').hidden=false;const title=document.getElementById('drawerTitle'),body=document.getElementById('drawerBody');if(type==='notes'){title.textContent='Teacher notes · '+(state.slide+1);body.innerHTML='<span class="teacher-pill">'+sectionFor(state.slide).name+' · '+sectionFor(state.slide).time+'-minute block</span><h3>'+esc(slides[state.slide].title)+'</h3><p>'+esc(slides[state.slide].notes)+'</p><hr class="divider"><h3>Check the reasoning</h3><p>Ask for the state, next candidate, reason for its priority, and effect of changing an assumption. A route without an explanation is only the starting point.</p>';}else if(type==='outline'){title.textContent='Session contents';body.innerHTML='<div class="panel stack"><div class="row between"><h3>Class timer</h3><b id="timerValue">'+timerText()+'</b></div><div class="row"><button id="timerToggle">'+(timerRunning?'Pause':'Start')+'</button><button id="timerReset">Reset 120 min</button></div></div>'+slides.map((s,i)=>'<button class="outline-button '+(i===state.slide?'current':'')+'" data-outline-go="'+i+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+esc(s.title)+'</button>').join('');}else if(type==='sources'){title.textContent='Sources and coverage';body.innerHTML='<p>Official class 3 combines Book Sessions 3 and 4 from the supplied Aptech outline. Coverage includes problem-solving methods, agents, decomposition, state/action/goal formulation, search applications, and informed versus uninformed search.</p><p>These labs and exercises are original supplements. The full textbook and official questions were not supplied.</p><a class="resource-link" href="https://aima.cs.berkeley.edu/4th-ed/pdfs/newchap03.pdf" target="_blank" rel="noopener">Artificial Intelligence: A Modern Approach · Problem solving by searching</a><a class="resource-link" href="https://aima.cs.berkeley.edu/4th-ed/pdfs/newchap04.pdf" target="_blank" rel="noopener">Artificial Intelligence: A Modern Approach · Informed search</a><p>Teacher references checked on 8 November 2026. The diagrams and graph costs are fictional. Search outcomes are computed locally, not taken from the reference examples.</p>';}else if(type==='code'){title.textContent='Full BFS program · why it works';body.innerHTML='<p>The core lesson demonstrates one queue step. The optional complete program adds these foundations:</p><ul><li><b>Dictionary:</b> maps a location to its neighbours.</li><li><b>Function:</b> packages the search so it can receive graph, start, and goal arguments.</li><li><b>Queue of paths:</b> remembers how each candidate was reached.</li><li><b>Set:</b> records states already discovered.</li><li><b>while:</b> repeats while candidates remain.</li><li><b>if and ==:</b> check whether the selected state is the goal.</li><li><b>for and not in:</b> inspect neighbours and skip known states.</li><li><b>return:</b> supply a found path, or None when no candidate remains.</li></ul><p>Every part of the downloadable file is commented. It ignores unequal road costs; BFS solves the fewest-move objective here.</p><a href="breadth_first_search.py" download>Download the commented Python source</a>';}else{title.textContent='Word bank';body.innerHTML='<label for="wordSearch" class="small">Find a term</label><input id="wordSearch" type="text" placeholder="Frontier, state, heuristic…"><div id="wordList">'+glossaryHTML()+'</div>';}document.getElementById('closeDrawer').focus();}
function closeDrawer(){document.getElementById('drawer').hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)return go(b.dataset.go);if(b.dataset.quiz){const id=b.dataset.quiz,a=Number(b.dataset.choice),q=quizData[id];state.answers[id]=a;save();document.querySelectorAll('[data-quiz="'+id+'"]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.choice)===a));const f=document.getElementById('feedback-'+id);f.textContent=(a===q.correct?'Yes. ':'Revisit the reason. ')+q.why;f.classList.toggle('bad',a!==q.correct);}if(b.id==='checkFormulation'){const selects=[...document.querySelectorAll('[data-form-role]')],ok=selects.every(x=>x.value===x.dataset.correct),f=document.getElementById('formulationFeedback');f.textContent=ok?'Correct. Explain how each part is used before choosing a route.':'At Gate: initial state. Move: action. At Delivery: goal test. Sum road costs: path cost.';f.classList.toggle('bad',!ok);}if(b.dataset.agentFamily){state.agentFamily=b.dataset.agentFamily;save();showAgentFamily();}if(b.dataset.vacuumType){state.agentType=b.dataset.vacuumType;state.vacuum=structuredClone(fresh.vacuum);save();updateAgent();}if(b.id==='agentStep')agentStep();if(b.id==='agentReset'){state.vacuum=structuredClone(fresh.vacuum);save();updateAgent();}if(b.dataset.dirtyRoom){const r=b.dataset.dirtyRoom;state.vacuum.dirty[r]=!state.vacuum.dirty[r];state.vacuum.action='The world changed in room '+r+'. Memory is not updated until the agent observes that room.';save();updateAgent();}if(b.dataset.node)showNode(b.dataset.node);if(b.id==='searchStep'){stepEngine(state.engine);save();updateSearch();}if(b.id==='searchRun'){for(let i=0;i<100&&!state.engine.result;i++)stepEngine(state.engine);save();updateSearch();}if(b.id==='searchReset'){resetSearch();updateSearch();}if(b.id==='openGreedy')openConfiguredSearch('greedy','weighted');if(b.id==='openUCS')openConfiguredSearch('ucs','weighted');if(b.id==='openAstar')openConfiguredSearch('astar','weighted');if(b.id==='openFailure')openConfiguredSearch('bfs','unit','isolated');if(b.dataset.compareMode){state.costMode=b.dataset.compareMode;resetSearch();updateComparison();}if(b.id==='compareResetRoads'){state.roadScenario='open';resetSearch();updateComparison();}if(b.id==='runCode'){state.code=document.getElementById('codeEditor').value;state.codeOutput=runTeachingCode(state.code);save();document.getElementById('codeOutput').textContent=state.codeOutput;}if(b.id==='restoreCode'){state.code=INITIAL_CODE;state.codeOutput='';save();render();}if(b.dataset.codeLine!==undefined){const i=Number(b.dataset.codeLine);document.querySelectorAll('[data-code-line]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('lineDetail').innerHTML='<h3>Line '+(i+1)+'</h3><pre class="code">'+esc(queueLines[i][0])+'</pre><p>'+queueLines[i][1]+'</p>';}if(b.id==='codeGuideBtn')openDrawer('code');if(b.id==='downloadWork'||b.id==='downloadFinal')downloadWork();if(b.id==='sourcesBtn')openDrawer('sources');});
stage.addEventListener('input',e=>{if(e.target.dataset.field){state.worksheet[e.target.dataset.field]=e.target.value;save();}if(e.target.id==='codeEditor'){state.code=e.target.value;save();}});
stage.addEventListener('change',e=>{const t=e.target;if(t.dataset.formRole){state.answers['form-'+t.dataset.formRole]=t.value;save();}if(t.id==='searchAlgorithm'||t.id==='costMode'||t.id==='roadScenario'){state[t.id==='searchAlgorithm'?'algorithm':t.id]=t.value;resetSearch();updateSearch();}});
document.getElementById('prevBtn').onclick=()=>go(state.slide-1);document.getElementById('nextBtn').onclick=()=>go(state.slide+1);document.getElementById('outlineBtn').onclick=()=>openDrawer('outline');document.getElementById('glossaryBtn').onclick=()=>openDrawer('glossary');document.getElementById('teacherBtn').onclick=()=>openDrawer('notes');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('fullscreenBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fullscreenBtn').textContent='Use browser full screen';}};
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer();const b=e.target.closest('button');if(!b)return;if(b.dataset.outlineGo!==undefined){closeDrawer();go(b.dataset.outlineGo);}if(b.id==='timerToggle'){timerRunning=!timerRunning;if(timerRunning)timerInterval=setInterval(()=>{if(seconds>0)seconds--;else{timerRunning=false;clearInterval(timerInterval);}updateTimer();},1000);else clearInterval(timerInterval);updateTimer();}if(b.id==='timerReset'){seconds=7200;timerRunning=false;clearInterval(timerInterval);updateTimer();}});
document.getElementById('drawer').addEventListener('input',e=>{if(e.target.id==='wordSearch')document.getElementById('wordList').innerHTML=glossaryHTML(e.target.value);});
document.addEventListener('keydown',e=>{const drawer=document.getElementById('drawer');if(e.key==='Escape'&&!drawer.hidden){closeDrawer();return;}if(!drawer.hidden){if(e.key==='Tab'){const all=[...drawer.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.slide-1);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(slides.length-1);}if(e.key.toLowerCase()==='n')openDrawer('notes');});
if(!state.engine)resetSearch();state.slide=Math.max(0,Math.min(slides.length-1,Number(state.slide)||0));render();

// Bright and dark themes share a local preference across the course.
function applyTheme(mode){const dark=mode==='dark';document.documentElement.dataset.theme=dark?'dark':'bright';const b=document.getElementById('themeBtn');if(b){b.textContent=dark?'☀ Bright theme':'☾ Dark theme';b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label','Switch to '+(dark?'bright':'dark')+' theme');}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#101c1c':'#f4f2e9';try{localStorage.setItem('aptech-ai-theme',dark?'dark':'bright');}catch(e){}}
let preferredTheme='bright';try{preferredTheme=localStorage.getItem('aptech-ai-theme')||'bright';}catch(e){}applyTheme(preferredTheme);
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'bright':'dark'));
</script></body></html>
