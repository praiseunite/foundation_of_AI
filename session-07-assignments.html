</style></head><body><header class="top"><div class="brand">APTECH <span>/</span> FOUNDATIONS OF AI<br><span class="small muted">SESSION 07 · STUDENT ASSIGNMENT PACK</span></div><div class="toolbar"><a class="upload-label" href="session-07.html">Back to Session 7</a><button id="themeBtn" aria-pressed="false">☾ Dark theme</button></div></header><main class="assign-app"><div id="intro"></div><nav id="taskTabs" class="task-tabs" aria-label="Assignment navigation"></nav><section id="taskPanel" class="task-panel" aria-label="Current task"></section></main><footer class="pack-bottom"><button id="previousTask">← Previous</button><div class="pack-status"><div id="progressLabel"></div><div id="saveStatus" class="save-message" aria-live="polite"></div></div><button id="nextTask">Next task →</button></footer><div id="printContent"></div><script>'use strict';
const KEY='aptech-ai-session7-assignments-v1',LAB_KEY='aptech-ai-session7-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numberKeys=['p3','p5','p0','r1p','r1e','r1s','r2p','r2e','r2s','r3p','r3e','r3s','r4p','r4e','r4s','mae','mse','trial001w','trial001b','trial001mae','trial03w','trial03b','trial03mae','baselineMean','baselineMae','testMae'];
const textKeys=['predictionWhy','fixedCode','codeWhy','expression','output','errorWhy','comparison','choice','selectionWhy','freezeEvidence','testWhy','rateFailure','shiftEvidence','shiftWhy','newTask','newPairs','newBaseline','newChange','pythonEvidence','pythonWhy','newDataEvidence','newDataWhy'];
const knownKeys=[...numberKeys,...textKeys];
const fmt=(n,d=6)=>Number.isFinite(n)?n.toFixed(d):'—';
function textField(key,label,placeholder=''){return '<label class="answer-field">'+label+'<textarea data-answer="'+key+'" placeholder="'+esc(placeholder)+'">'+esc(state.answers[key]||'')+'</textarea></label>';}
function numeric(key,label){return '<label class="answer-field">'+label+'<input type="number" step="any" data-answer="'+key+'" value="'+esc(state.answers[key]||'')+'"></label>';}
function selectField(key,label,options){return '<label class="answer-field">'+label+'<select data-answer="'+key+'">'+options.map(([v,n])=>'<option value="'+v+'" '+(state.answers[key]===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label>';}
function hint(text){return '<details class="hint"><summary>Need a starting hint?</summary><p>'+text+'</p></details>';}
function labLink(n,label='Open the Session 7 lab'){return '<a class="upload-label" href="session-07.html?slide='+n+'" target="_blank" rel="noopener">'+label+'</a>';}
function feedback(id){return '<div id="feedback-'+id+'" class="feedback-pack" aria-live="polite">'+esc(state.checks[id]||'')+'</div>';}
function instructions(steps,deliverable){return '<div class="instructions"><h3>What to do</h3><ol>'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><div class="deliverable"><b>What to submit:</b> '+deliverable+'</div></div>';}
function predictionTask(){return '<div class="assignment-grid">'+instructions(['Use the model <b>prediction = 2 × hours + 1</b>. Calculate its outputs for 3, 5, and 0 hours.','Explain the job of 2 and the job of 1. State both units.','At 3 hours, change the slope from 2 to 3 while keeping bias 1. Explain the new prediction.','Explain why a model output at 0 hours is not automatically an official price policy.'],'Three calculations, parameter meanings, and the changed case.')+'<div class="fields"><div class="number-grid">'+numeric('p3','Prediction at 3 hours · credits')+numeric('p5','Prediction at 5 hours · credits')+numeric('p0','Prediction at 0 hours · credits')+'</div>'+textField('predictionWhy','Explain the parameters, changed slope, and zero-hour limit','Show the multiplication and addition, then explain their purpose.')+'<button id="checkPredictions">Check my arithmetic</button>'+feedback('t1')+hint('Substitute each input into w × x + b. A slope changes the amount per extra hour; a bias adds the same offset.')+'</div></div>';}
function codeTask(){return '<div class="assignment-grid"><div class="fields">'+instructions(['Read this code before running anything. Find the two mistakes.','Write a corrected version that prints the computed numeric quote.','Explain what quotation marks mean, why the first bug causes a runtime error, and why the other can print the wrong text.'],'Corrected code plus reasons for both fixes.')+'<pre class="code pack-code">hours = 3\nslope = 2\nbias = 1\nprediction = "slope" * hours + bias\nprint("prediction")</pre>'+hint('"slope" is a string, while slope retrieves a numeric value. Multiplying a string repeats it; adding an integer to that repeated string raises a TypeError.')+'</div><div class="fields">'+textField('fixedCode','Your corrected Python code','Write all five lines.')+textField('codeWhy','Why each fix works','Distinguish a runtime type error from printing a literal word.')+'<details class="hint"><summary>Inspect the two choices locally</summary><div class="inspector">'+selectField('expression','Prediction expression',[['','Choose'],['literal','"slope" * hours + bias'],['value','slope * hours + bias']])+selectField('output','Printed value',[['','Choose'],['literal','print("prediction")'],['value','print(prediction)']])+'<div id="codeInspector" class="feedback-pack" aria-live="polite"></div><p class="assignment-caption">This inspects known values in JavaScript. It does not execute Python.</p></div></details></div></div>';}
function errorsTask(){const rows=[{x:1,y:3},{x:2,y:5},{x:3,y:7},{x:4,y:9}];return instructions(['Use <b>prediction = 1 × hours + 1</b> for the four examples below.','For each row, calculate the prediction, signed error = prediction − actual, and squared error.','Calculate MAE and MSE. Show their denominators and units. Explain what a negative error means.'],'Four completed rows, both averages, and an interpretation.')+'<div class="error-cards">'+rows.map((r,i)=>'<div class="error-card"><h3>Example '+(i+1)+' · '+r.x+' hour'+(r.x>1?'s':'')+'</h3><p class="assignment-caption">Actual cost: '+r.y+' credits</p><div class="number-grid">'+numeric('r'+(i+1)+'p','Prediction')+numeric('r'+(i+1)+'e','Signed error')+numeric('r'+(i+1)+'s','Error²')+'</div></div>').join('')+'</div><div class="assignment-grid"><div class="fields"><div class="number-grid">'+numeric('mae','MAE · credits')+numeric('mse','MSE · squared credits')+'</div><button id="checkErrors">Check my calculations</button>'+feedback('t3')+'</div><div class="fields">'+textField('errorWhy','Show both averages and explain the signed errors','Which values are added? How many examples are averaged?')+hint('MAE averages absolute errors. MSE averages squared errors. The recorded actual target stays fixed while the prediction changes.')+'</div></div>';}
function comparisonTable(){return '<div class="observations-wrap"><table class="observations"><thead><tr><th>Rate</th><th>Updates</th><th>Slope w</th><th>Bias b</th><th>Val MAE</th></tr></thead><tbody>'+[['001','0.001'],['03','0.03']].map(([k,rate])=>'<tr><td>'+rate+'</td><td>500</td>'+['w','b','mae'].map((suffix,i)=>'<td><input type="number" step="any" data-answer="trial'+k+suffix+'" aria-label="'+['Slope','Bias','Validation MAE'][i]+' at rate '+rate+'" value="'+esc(state.answers['trial'+k+suffix]||'')+'"></td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function trainTask(){return '<div class="assignment-grid"><div class="fields">'+instructions(['Open the training lab. Use <b>Same straight pattern</b>. Reset to slope 0 and bias 0.','Choose rate 0.001. Run exactly 500 updates. Record the slope, bias, and validation MAE.','Reset again. Choose rate 0.03. Run exactly 500 updates and record validation.','Compare the two trials. Explain why keeping the data, starting model, and update count the same makes this comparison useful.','Trace the first starter-rate update using the supplied sensitivities: dw = −35, db = −12, rate = 0.03. Explain why both gradients use the old model.'],'Both trial records, the fair-comparison explanation, and the first-update arithmetic.')+'<div class="pack-links">'+labLink(19)+labLink(24,'Open validation')+'</div>'+hint('At each run, check the update counter says 500. Record validation before freezing or using test answers to choose.')+'</div><div class="fields">'+comparisonTable()+'<button id="captureTrial" class="accent">Read the current validation trial</button><p class="assignment-caption">Open the lab in the same browser, record validation there, then return. You can also enter the displayed values manually.</p>'+feedback('captureTrial')+textField('comparison','Explain the fair comparison and the first update','Show w − rate × dw and b − rate × db. Deriving gradients is optional.')+'</div></div>';}
function testTask(){return '<div class="assignment-grid"><div class="fields">'+instructions(['Choose between the two trials using validation. Write your reason <b>before</b> inspecting the test result.','Recreate the selected candidate: straight pattern, zero starting parameters, chosen rate, exactly 500 updates. Freeze it in the lab, then reveal test.','Record the frozen parameters and test MAE. Calculate a constant baseline from the mean training target, then its MAE on the <b>same</b> test rows.','Compare the model and baseline. Explain why this tiny synthetic test does not prove real campus pricing reliability.','If the test answers were already viewed, label the work exploratory. You may still complete and explain the exercise.'],'Selection reason, frozen-model evidence, model/baseline results, and a limitation.')+'<div class="pack-links">'+labLink(25,'Open freeze and test')+'</div>'+hint('Fit the constant baseline using training targets only. Average its absolute errors on the revealed test rows. A new independent evaluation after test-informed tuning needs fresh data.')+'</div><div class="fields">'+selectField('choice','Selected rate',[['','Choose a rate'],['0.001','0.001'],['0.03','0.03']])+textField('selectionWhy','Why did validation support this choice?','Write this before looking at the test result.')+'<button id="captureTest" class="accent">Read the frozen lab result</button>'+feedback('captureTest')+'<div id="testEvidence"></div>'+textField('freezeEvidence','Frozen-model evidence','Scenario, rate, update count, slope, bias, and whether this is exploratory.')+'<div class="number-grid">'+numeric('baselineMean','Training-mean baseline · credits')+numeric('baselineMae','Baseline test MAE · credits')+numeric('testMae','Model test MAE · credits')+'</div>'+textField('testWhy','Compare results and explain a limitation','Name the evaluated examples and why the score is not a future guarantee.')+'</div></div>';}
function failureTask(){return '<div class="assignment-grid"><div class="fields">'+instructions(['Reset the straight-pattern model. Choose rate 0.5 and request 50 updates. Record the warning and completed update count. Explain why bigger steps can fail.','Reset. Choose <b>Later prices change</b>, rate 0.03, and exactly 500 updates. Freeze and inspect the test result.','Record training MAE and test MAE. Explain how low training error can coexist with poor later predictions.','Propose a useful next investigation, and explain why repeatedly tuning against the same test answers would not give a new independent score.'],'Warning evidence, changed-policy results, and a reasoned explanation.')+labLink(19)+hint('Separate an optimisation problem (oversized updates) from a changed relationship in later data. More confidence does not repair either cause.')+'</div><div class="fields">'+textField('rateFailure','Oversized-rate evidence and explanation','Record the rate, requested/completed updates, warning, and remedy.')+textField('shiftEvidence','Changed-policy evidence','Record the parameters, training MAE, test MAE, and one prediction/actual pair.')+textField('shiftWhy','Why did it fail, and what would you investigate?','Explain a changed policy and the need for a suitable new evaluation.')+'</div></div>';}
function designTask(){return '<div class="assignment-grid">'+instructions(['Choose a different <b>numeric prediction</b> task, such as event attendance or equipment rental cost.','Define an input available at prediction time, a numeric target, and their units.','Write two small synthetic input/target examples. Label them as invented.','Choose a simple baseline and describe how you would separate training, validation, and test examples.','Describe one change that could make earlier data misleading. Explain which program parts would need to change.'],'Task definition, two example pairs, baseline/split plan, and a changed case.')+'<div class="fields">'+textField('newTask','Your input, numeric target, and units','Explain when the input becomes available.')+textField('newPairs','Two synthetic example pairs','Label them as fictional rather than actual observations.')+textField('newBaseline','Baseline and data-split plan','Explain which data would fit the baseline and support evaluation.')+textField('newChange','Changed case and program changes','What relationship could change, and what would you recheck?')+'</div></div>';}
function pythonTask(){return '<div class="assignment-grid"><div class="fields">'+instructions(['Download and extract the student bundle. Use an existing Python 3 installation.','Run the training program and save its model JSON. Use the prediction program to quote 3 and 4 hours from those saved parameters.','Explain why the second program is inference rather than another training run.','Submit the two commands, terminal results, and one line-by-line explanation. No key or internet is needed.'],'Commands/results, saved model JSON if available, and an explanation.')+'<pre class="code pack-code">python session07_train.py --output my_model.json\npython session07_predict.py my_model.json --hours 3\npython session07_predict.py my_model.json --hours 4</pre><p class="assignment-caption">On Windows, py may replace python. Saved parameters are rounded only for display.</p><a href="session-07-student-bundle.zip" download>Download student bundle</a></div><div class="fields">'+textField('pythonEvidence','Commands and observed outputs','Paste or describe your terminal results.')+textField('pythonWhy','Explain training versus inference','Which parameters are reused, and which code no longer runs?')+'</div></div>';}
function newDataTask(){return '<div class="assignment-grid"><div class="fields">'+instructions(['Open session07_tasks_starter.py from the bundle. Complete its small predict function first.','For the optional new-data challenge, enable the clearly labelled training block. The synthetic pairs use a different relationship from the classroom example.','State input/target units, choose a validation setting, and report the held-out result.','Explain which data and code changed. Do not claim real performance from invented examples.'],'Completed starter, observed outputs, and changed-data reasoning.')+'<a href="session07_tasks_starter.py" download>Download the commented starter</a>'+hint('Begin with the multiplication and addition in predict. The optional training helper is imported from session07_train.py in the same extracted folder.')+'</div><div class="fields">'+textField('newDataEvidence','Your code changes and output evidence','Record the scenario, rate, updates, parameters, and metric.')+textField('newDataWhy','Explain the new relationship and evaluation limits','Show why the changed targets require different fitted parameters.')+'</div></div>';}

];
const fresh={page:0,name:'',group:'',answers:{},ready:{},checks:{},trials:{},test:null,testRevealed:false};
function numericRecord(r,keys){return r&&typeof r==='object'&&keys.every(k=>typeof r[k]==='number'&&Number.isFinite(r[k]));}
function normalize(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Choose an exported assignment draft.');const clean=structuredClone(fresh);clean.page=Number.isInteger(raw.page)?Math.max(0,Math.min(tasks.length-1,raw.page)):0;for(const k of ['name','group'])if(typeof raw[k]==='string')clean[k]=raw[k].slice(0,200);for(const k of knownKeys)if(typeof raw.answers?.[k]==='string')clean.answers[k]=raw.answers[k].slice(0,20000);for(const t of tasks)clean.ready[t.id]=raw.ready?.[t.id]===true;for(const k of ['001','03']){const r=raw.trials?.[k];if(numericRecord(r,['rate','steps','w','b','mae']))clean.trials[k]={rate:r.rate,steps:r.steps,w:r.w,b:r.b,mae:r.mae,source:'Local lab snapshot'};}if(numericRecord(raw.test,['rate','steps','w','b','mae','trainMae','valMae'])&&['0.001','0.03'].includes(String(raw.test.rate)))clean.test={...raw.test,repeat:raw.test.repeat===true};clean.testRevealed=raw.testRevealed===true;return clean;}
let state;try{state=normalize(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){state=structuredClone(fresh);}
function save(){let ok;try{localStorage.setItem(KEY,JSON.stringify(state));ok=true;}catch(e){ok=false;}const el=document.getElementById('saveStatus');if(el)el.textContent=ok?'Draft saved in this browser · export to hand in.':'Browser storage unavailable · export a draft to keep your work.';return ok;}
function filled(key){const value=state.answers[key];return typeof value==='string'&&value.trim()!==''&&(!numberKeys.includes(key)||Number.isFinite(Number(value)));}
function readyEligible(task){return task.required.length>0&&task.required.every(filled);}
function coreTasks(){return tasks.filter(t=>/^t[1-7]$/.test(t.id));}
function overview(){return '<div class="assignment-grid"><div class="instructions"><h3>Seven core tasks · suggested 50 points</h3><p>About 100 minutes of expanded practice, completed in teacher-selected class time or follow-up time. The two Python stretch tasks are optional and ungraded in this pack.</p><p>This expands Session 7’s short missions. It adds practice beyond the original two-hour workshop and is not an official textbook question bank.</p><ol><li>Attempt the calculation or explanation first.</li><li>Use a hint or lab when needed.</li><li>Explain the result in your own words.</li><li>Mark a task ready only after reviewing its required responses.</li></ol></div><div class="instructions"><h3>What your teacher will assess</h3><p>Your task definition, calculations, code reasoning, fair comparison, evaluation evidence, and changed-case explanation.</p><p>Arithmetic feedback and ready checkboxes are learning aids. Your teacher gives the marks; the app does not award an exam grade.</p><p>No deadline or submission channel is assumed. Use the instructions your teacher provides.</p><div class="pack-links"><a href="session-07-student-bundle.zip" download>Student bundle</a>'+labLink(19)+'</div></div></div>'+hint('If you are new to Python, complete the core tasks in the browser first. Python installation is not needed for those tasks.');}
function submission(){const missing=coreTasks().filter(t=>!readyEligible(t));return '<div class="assignment-grid"><div class="instructions"><h3>Your submission checklist</h3><ul class="submission-list"><li>Student name or agreed identifier, plus class/group if requested.</li><li>All seven core responses with calculations and explanations.</li><li>Both validation trials and the frozen-model evidence.</li><li>Optional Python source/model files only if you completed the stretch tasks.</li></ul><p>Hand in the exported text report through your teacher’s chosen channel. The JSON draft lets you restore your work later.</p><div class="feedback-pack '+(missing.length?'bad':'')+'">'+(missing.length?'Required responses still missing in: '+missing.map(t=>esc(t.title)).join('; ')+'.':'All core response fields are filled. Review their meaning before handing in; this is not a correctness grade.')+'</div></div><div class="instructions"><h3>Keep and hand in your work</h3><button id="exportReport" class="accent">Download text submission</button><button id="exportDraft">Download draft JSON</button><button id="printWork">Print all tasks and answers</button><label class="upload-label">Restore an exported draft<input id="restoreDraft" type="file" accept=".json,application/json" style="width:1px;height:1px;opacity:0"></label><p class="assignment-caption">Restoring replaces the draft in this browser. Keep a backup export first if it contains work you need.</p>'+feedback('restore')+'<p>Local drafts do not send themselves to your teacher. Export and hand in the file.</p></div></div>';}
function renderIntro(){const identity='<div class="identity"><label>Student name or agreed identifier<input id="studentName" type="text" maxlength="200" value="'+esc(state.name)+'" placeholder="Name or identifier"></label><label>Class / group · if requested<input id="studentGroup" type="text" maxlength="200" value="'+esc(state.group)+'" placeholder="Class or group"></label></div>';const details=state.page===0?identity:'<details class="student-details"><summary>Student details · '+esc(state.name||'add your name or identifier')+(state.group?' · '+esc(state.group):'')+'</summary>'+identity+'</details>';document.getElementById('intro').innerHTML='<div class="assignment-intro '+(state.page===0?'':'compact-intro')+'"><span class="eyebrow">Session 7 · original practice assignments</span><h1>'+(state.page===0?'Show the calculation.<br>Explain the reason.':'Your assignment workbook')+'</h1>'+(state.page===0?'<p class="lead">Seven core tasks and two optional Python challenges. Use the labs, keep the evidence, and make the meaning clear.</p>':'')+details+'<div class="pack-progress" role="progressbar" aria-label="Tasks marked ready for review" aria-valuemin="0" aria-valuemax="7"><div id="readyFill"></div></div></div>';}

function render(){renderIntro();const task=tasks[state.page];document.title='Session 7 assignments · '+task.title;document.getElementById('taskTabs').innerHTML=tasks.map((t,i)=>'<button data-page="'+i+'" aria-pressed="'+(i===state.page)+'">'+esc(t.title)+'</button>').join('');document.getElementById('taskPanel').innerHTML='<div class="task-meta"><span class="tag">'+(task.points?task.points+' suggested points':task.id.startsWith('s')&&task.id!=='submit'?'Optional · ungraded':'Assignment pack')+'</span>'+(task.minutes?'<span class="tag">About '+task.minutes+' min</span>':'')+'</div><h2>'+esc(task.title)+'</h2>'+task.body()+(task.required.length?'<label class="task-ready"><input id="markReady" type="checkbox" '+(state.ready[task.id]?'checked':'')+'> I reviewed this task and am ready to explain it to my teacher.</label><p id="requiredStatus" class="assignment-caption"></p>':'');document.getElementById('previousTask').disabled=state.page===0;document.getElementById('nextTask').disabled=state.page===tasks.length-1;updateProgress();if(task.id==='t2')updateInspector();if(task.id==='t5')updateTestEvidence();save();}
function updateProgress(){const core=coreTasks(),count=core.filter(t=>state.ready[t.id]&&readyEligible(t)).length;document.getElementById('progressLabel').textContent=count+' / 7 core tasks marked ready · '+(state.page+1)+' / '+tasks.length;document.getElementById('readyFill').style.width=count/7*100+'%';document.querySelector('.pack-progress').setAttribute('aria-valuenow',count);const task=tasks[state.page],box=document.getElementById('markReady');if(box){const eligible=readyEligible(task);box.disabled=!eligible;if(!eligible)state.ready[task.id]=false;box.checked=Boolean(state.ready[task.id]&&eligible);document.getElementById('requiredStatus').textContent=eligible?'Response fields are filled. Readiness is a self-check, not a correctness score.':'Fill the required response fields before marking this task ready.';}}
function go(page){state.page=Math.max(0,Math.min(tasks.length-1,Number(page)||0));save();render();window.scrollTo({top:0,behavior:'instant'});}
function updateInspector(){const e=state.answers.expression,o=state.answers.output,el=document.getElementById('codeInspector');if(!el)return;el.textContent=e==='literal'?'The repeated string cannot be added to the numeric bias: Python would raise TypeError before print.':e==='value'&&o==='literal'?'The calculation stores the number 7, but print("prediction") displays the literal word prediction.':e==='value'&&o==='value'?'The numeric calculation is displayed: 7. Explain why both changes matter.':'Choose an expression and printed value to inspect.';}
function checkArithmetic(id,expected){const answered=Object.keys(expected).filter(filled),right=answered.filter(k=>Math.abs(Number(state.answers[k])-expected[k])<1e-9),message=answered.length!==Object.keys(expected).length?'Fill all calculation fields first. Explain the operations as well as entering numbers.':right.length===answered.length?'All numeric checks match. Now explain the operations, denominators, units, and limits.':right.length+' / '+answered.length+' numeric checks match. Revisit the formula and signed errors; your teacher will assess the explanation.';state.checks[id]=message;const el=document.getElementById('feedback-'+id);el.textContent=message;el.classList.toggle('bad',answered.length!==Object.keys(expected).length||right.length!==answered.length);save();}
function labState(){const raw=localStorage.getItem(LAB_KEY);if(!raw)throw Error('Open the Session 7 lab in this browser and complete the requested step, then return. You can also record values manually.');return JSON.parse(raw);}
function showMessage(id,message,bad=false){state.checks[id]=message;const el=document.getElementById('feedback-'+id);if(el){el.textContent=message;el.classList.toggle('bad',bad);}save();}
function captureTrial(){try{const lab=labState(),m=lab.model,v=lab.validation;if(!numericRecord(m,['rate','steps','w','b'])||!numericRecord(v,['w','b','steps','mae'])||m.kind!=='straight'||m.steps!==500||m.stopped||![.001,.03].includes(m.rate)||v.steps!==m.steps||Math.abs(v.w-m.w)>1e-10||Math.abs(v.b-m.b)>1e-10)throw Error('Use the straight pattern, start from reset, run exactly 500 updates at 0.001 or 0.03, and record validation in the lab first.');const key=m.rate===.001?'001':'03';state.trials[key]={rate:m.rate,steps:m.steps,w:m.w,b:m.b,mae:v.mae,source:'Local lab snapshot'};for(const [suffix,value] of [['w',m.w],['b',m.b],['mae',v.mae]])state.answers['trial'+key+suffix]=fmt(value);state.ready.t4=false;save();render();showMessage('captureTrial','Recorded the '+m.rate+' validation trial. Complete the other trial and explain the fair comparison.');}catch(e){showMessage('captureTrial',e.message,true);}}
function captureTest(){try{if(!filled('choice')||!filled('selectionWhy'))throw Error('Record a selected rate and its validation-based reason before importing the frozen test result.');const lab=labState(),f=lab.sealed;if(!numericRecord(f,['w','b','rate','steps'])||f.kind!=='straight'||f.steps!==500||f.rate!==Number(state.answers.choice)||!numericRecord(f.test,['mae'])||!numericRecord(f.train,['mae'])||!numericRecord(f.validation,['mae']))throw Error('Recreate the chosen straight-pattern model for exactly 500 updates and freeze it in the lab. Its rate must match your recorded selection.');state.test={rate:f.rate,steps:f.steps,w:f.w,b:f.b,mae:f.test.mae,trainMae:f.train.mae,valMae:f.validation.mae,repeat:Boolean(f.repeat||state.testRevealed)};state.testRevealed=true;state.answers.testMae=fmt(f.test.mae);state.answers.freezeEvidence='Straight pattern; rate '+f.rate+'; '+f.steps+' updates; slope '+fmt(f.w)+'; bias '+fmt(f.b)+'. '+(state.test.repeat?'Exploratory: these test answers were already viewed.':'Frozen snapshot evaluated on two held-out examples.');state.ready.t5=false;save();render();showMessage('captureTest','Frozen result recorded. Calculate the baseline and explain the comparison.');}catch(e){showMessage('captureTest',e.message,true);}}
function updateTestEvidence(){const el=document.getElementById('testEvidence');if(!el)return;if(!state.test){el.innerHTML='<p class="assignment-caption">No frozen result imported. You may record the lab evidence manually.</p>';return;}const m=state.test;el.innerHTML='<div class="feedback-pack"><b>Frozen snapshot:</b> slope '+fmt(m.w)+', bias '+fmt(m.b)+', '+m.steps+' updates. '+(m.repeat?'Further work is exploratory after viewing test answers.':'Interpret this tiny evaluation with care.')+'</div><table class="observations"><thead><tr><th>Hours</th><th>Actual</th><th>Model prediction</th></tr></thead><tbody>'+[7,8].map(x=>'<tr><td>'+x+'</td><td>'+(2*x+1)+'</td><td>'+fmt(m.w*x+m.b)+'</td></tr>').join('')+'</tbody></table>';}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function answerLabel(key){const labels={p3:'Prediction at 3 hours',p5:'Prediction at 5 hours',p0:'Prediction at 0 hours',predictionWhy:'Parameter meanings and changed case',fixedCode:'Corrected code',codeWhy:'Reasons for the fixes',mae:'MAE in credits',mse:'MSE in squared credits',errorWhy:'Error calculations and interpretation',comparison:'Trial comparison and first update',choice:'Selected learning rate',selectionWhy:'Reason for selection',freezeEvidence:'Frozen-model evidence',baselineMean:'Training-mean baseline',baselineMae:'Baseline test MAE',testMae:'Model test MAE',testWhy:'Evaluation interpretation and limit',rateFailure:'Oversized-rate investigation',shiftEvidence:'Changed-policy evidence',shiftWhy:'Changed-policy explanation',newTask:'New task/input/target',newPairs:'Synthetic example pairs',newBaseline:'Baseline and split plan',newChange:'Changed case and program review',pythonEvidence:'Python commands and outputs',pythonWhy:'Training versus inference',newDataEvidence:'New-data code and outputs',newDataWhy:'New-data explanation'};const row=key.match(/^r([1-4])([pes])$/);if(row)return 'Example '+row[1]+' '+({p:'prediction',e:'signed error',s:'squared error'}[row[2]]);const trial=key.match(/^trial(001|03)(w|b|mae)$/);if(trial)return 'Rate '+(trial[1]==='001'?'0.001':'0.03')+' '+({w:'slope',b:'bias',mae:'validation MAE'}[trial[2]]);return labels[key]||key;}
function exportReport(){const lines=['SESSION 7 · STUDENT ASSIGNMENT SUBMISSION','Original supplementary tasks · suggested 50-point rubric','Student: '+(state.name||'[Not recorded]'),'Class/group: '+(state.group||'[Not recorded]'),'Exported: '+new Date().toLocaleString(),''];for(const task of tasks.filter(t=>t.required.length||['s1','s2'].includes(t.id))){lines.push(task.title+' · '+(task.points?task.points+' suggested points':'Optional, ungraded'));const keys=task.required.length?task.required:task.id==='s1'?['pythonEvidence','pythonWhy']:['newDataEvidence','newDataWhy'];for(const key of keys)lines.push(answerLabel(key)+':\n'+(state.answers[key]||'[Not answered]'));lines.push('Marked ready: '+Boolean(state.ready[task.id]&&readyEligible(task)),'');}lines.push('LOCAL LAB SNAPSHOTS\n'+JSON.stringify({trials:state.trials,frozenTest:state.test,testAnswersViewed:state.testRevealed},null,2),'Readiness and numeric checks are formative aids, not teacher-awarded marks. Tiny synthetic data is not real deployment evidence.');download('session-07-assignment-submission.txt',lines.join('\n\n'));}
function exportDraft(){download('session-07-assignment-draft.json',JSON.stringify({format:'aptech-session7-assignment-draft-v1',state},null,2),'application/json');}
function preparePrint(){document.getElementById('printContent').innerHTML='<h1>Session 7 · Student assignment pack</h1><p>Student: '+esc(state.name||'________________')+' · Class/group: '+esc(state.group||'________________')+'</p><p>Seven core tasks: suggested 50 points. Optional Python tasks are ungraded.</p>'+tasks.filter(t=>t.id!=='overview'&&t.id!=='submit').map(t=>'<section class="task-panel"><h2>'+esc(t.title)+'</h2><p>'+t.points+' suggested points · about '+t.minutes+' minutes</p>'+t.body()+'</section>').join('');document.querySelectorAll('#printContent textarea').forEach(t=>{const answer=document.createElement('div');answer.className='printed-answer';answer.textContent=t.value||'[Blank answer]';t.replaceWith(answer);});}
document.getElementById('taskTabs').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page);});
document.querySelector('.assign-app').addEventListener('input',e=>{const t=e.target;if(t.id==='markReady'||t.id==='restoreDraft')return;if(t.id==='studentName')state.name=t.value;if(t.id==='studentGroup')state.group=t.value;if(t.dataset.answer){const key=t.dataset.answer;state.answers[key]=t.value;for(const task of tasks)if(task.required.includes(key))state.ready[task.id]=false;if(key==='choice'){state.test=null;state.answers.freezeEvidence='';state.answers.testMae='';state.checks.captureTest='';const status=document.getElementById('feedback-captureTest');if(status)status.textContent='';for(const k of ['freezeEvidence','testMae']){const field=document.querySelector('.assign-app [data-answer="'+k+'"]');if(field)field.value='';}}for(const id of ['t1','t3']){state.checks[id]='';const el=document.getElementById('feedback-'+id);if(el)el.textContent='';}if(['expression','output'].includes(key))updateInspector();if(key==='choice')updateTestEvidence();}updateProgress();save();});
document.getElementById('taskPanel').addEventListener('change',async e=>{const t=e.target;if(t.id==='markReady'){state.ready[tasks[state.page].id]=Boolean(t.checked&&readyEligible(tasks[state.page]));updateProgress();save();}if(t.id==='restoreDraft'&&t.files?.length){try{const file=t.files[0];if(file.size>1000000)throw Error('Choose an assignment JSON file smaller than 1 MB.');const parsed=JSON.parse(await file.text());if(parsed.format!=='aptech-session7-assignment-draft-v1')throw Error('Choose a draft exported from this assignment pack.');state=normalize(parsed.state);save();render();go(tasks.length-1);showMessage('restore','Draft restored. Review the student identifier and answers.');}catch(err){showMessage('restore',err.message,true);}}});
document.getElementById('taskPanel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='checkPredictions')checkArithmetic('t1',{p3:7,p5:11,p0:1});if(b.id==='checkErrors')checkArithmetic('t3',{r1p:2,r1e:-1,r1s:1,r2p:3,r2e:-2,r2s:4,r3p:4,r3e:-3,r3s:9,r4p:5,r4e:-4,r4s:16,mae:2.5,mse:7.5});if(b.id==='captureTrial')captureTrial();if(b.id==='captureTest')captureTest();if(b.id==='exportReport')exportReport();if(b.id==='exportDraft')exportDraft();if(b.id==='printWork'){preparePrint();window.print();}});
document.getElementById('previousTask').onclick=()=>go(state.page-1);document.getElementById('nextTask').onclick=()=>go(state.page+1);
window.addEventListener('afterprint',()=>{document.getElementById('printContent').innerHTML='';});
render();

// Bright and dark themes share a local preference across the course.
function applyTheme(mode){const dark=mode==='dark';document.documentElement.dataset.theme=dark?'dark':'bright';const b=document.getElementById('themeBtn');if(b){b.textContent=dark?'☀ Bright theme':'☾ Dark theme';b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label','Switch to '+(dark?'bright':'dark')+' theme');}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#101c1c':'#f4f2e9';try{localStorage.setItem('aptech-ai-theme',dark?'dark':'bright');}catch(e){}}
let preferredTheme='bright';try{preferredTheme=localStorage.getItem('aptech-ai-theme')||'bright';}catch(e){}applyTheme(preferredTheme);
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'bright':'dark'));
</script></body></html>
