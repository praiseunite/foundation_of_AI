<script>'use strict';
const STORAGE='aptech-ai-session2-v1';
const INITIAL_CODE='colour = 0.8\nshape = 0.4\nweight_colour = 0.6\nweight_shape = 0.3\nbias = -0.5\nscore = colour * weight_colour + shape * weight_shape + bias\nprint(round(score, 3))\nprint(score >= 0)';
const fresh={slide:0,answers:{},worksheet:{},neuron:{x1:.8,x2:.4,w1:.6,w2:.3,b:-.5},activationX:-1,activation:'relu',trace:0,netX1:.8,netX2:.4,nonlinear:true,train:{w:0,b:0,rate:.1,steps:0,history:[.295]},stockMethod:'baseline',stockSplit:8,family:'mlp',code:INITIAL_CODE,codeOutput:''};
let state;try{state={...structuredClone(fresh),...JSON.parse(localStorage.getItem(STORAGE)||'null')};}catch(e){state=structuredClone(fresh);}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=3)=>Number.isFinite(n)?Number(n.toFixed(d)).toString():'out of range';
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true;}catch(e){return false;}}
function panel(title,text,classes=''){return '<article class="panel stack '+classes+'"><h3>'+title+'</h3><p>'+text+'</p></article>';}
function note(text){return '<div class="note">'+text+'</div>';}
function field(key,label,placeholder=''){return '<label>'+label+'<textarea class="answer" data-field="'+key+'" placeholder="'+esc(placeholder)+'">'+esc(state.worksheet[key]||'')+'</textarea></label>';}
function control(id,label,value,min,max,step='.1',wide=false){return '<div class="control '+(wide?'wide':'')+'"><label for="'+id+'">'+label+'<output id="'+id+'Value">'+fmt(value)+'</output></label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+value+'"></div>';}
const sections=[{name:'Reconnect and wonder',time:10,start:0},{name:'What deep learning means',time:15,start:3},{name:'Inside a neural network',time:25,start:7},{name:'How training changes a model',time:15,start:17},{name:'Families and applications',time:10,start:22},{name:'Stock-prediction case study',time:15,start:24},{name:'Understand the Python',time:15,start:27},{name:'Practise and explain',time:15,start:31}];
function sectionFor(i){return sections.filter(s=>s.start<=i).at(-1);}
const quizzes={recall:{q:'A feature is…',options:['The known answer attached to an example.','An input characteristic used by a method.'],correct:1,why:'Weight was an input feature in Session 1; Orange or Mango was its label. Today we combine more than one input.'},deep:{q:'What makes this a deep-learning approach?',options:['It uses a very large computer.','It learns representations through multiple neural processing layers.','It always gives a correct answer.'],correct:1,why:'Depth refers to the chain of layers that transform representations. Bigger hardware and correct answers do not define deep learning.'},loss:{q:'Prediction 4, known answer 6. What is the squared error?',options:['2','4','10'],correct:1,why:'The difference is 4 − 6 = −2. Squaring gives (−2) × (−2) = 4. Squaring makes this error non-negative and emphasises larger misses.'},leak:{q:'For a prediction made before Day 9 ends, which input is invalid?',options:['The closing price from Day 8.','The known day number.','The closing price from Day 9.'],correct:2,why:'Day 9’s closing price is the answer you are trying to predict. Using it as input gives the model information unavailable at prediction time.'},exit1:{q:'What does a weight do?',options:['Scales an input’s contribution.','Stores the known answer for every case.'],correct:0,why:'Each input is multiplied by its weight. Its effect depends on both the input value and the weight, plus the rest of the network.'},exit2:{q:'What is training?',options:['Running new inputs through fixed parameters.','Adjusting parameters using examples and an objective.'],correct:1,why:'Training changes parameters in response to an objective such as reducing loss. Inference uses the resulting parameters for a prediction.'},exit3:{q:'Which is evidence worth checking?',options:['Only perfect training performance.','A complex model name.','Performance on appropriate unseen cases against a baseline.'],correct:2,why:'Useful generalisation needs a suitable evaluation. For time series, preserve the direction of time and avoid future information.'}};
function quiz(id){const q=quizzes[id],a=state.answers[id];return '<div class="stack"><h3>'+q.q+'</h3><div class="choices">'+q.options.map((o,i)=>'<button data-quiz="'+id+'" data-choice="'+i+'" aria-pressed="'+(a===i)+'">'+o+'</button>').join('')+'</div><div class="feedback '+(a!==undefined&&a!==q.correct?'bad':'')+'" id="feedback-'+id+'" aria-live="polite">'+(a===undefined?'':(a===q.correct?'Yes. ':'Revisit the reason. ')+q.why)+'</div></div>';}
function networkMarkup(hero=false){const nodes=[['x1','x2'],['h1','h2'],['g1','g2'],['out']],labels=['Inputs','Hidden 1','Hidden 2','Output'];let edges='';const ys=[25,75];for(let c=0;c<3;c++)for(let a=0;a<2;a++)for(let b=0;b<(c===2?1:2);b++)edges+='<line data-edge="'+(c+1)+'" x1="'+(12.5+25*c)+'" y1="'+ys[a]+'" x2="'+(37.5+25*c)+'" y2="'+(c===2?50:ys[b])+'"/>';return '<div class="network"><svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+edges+'</svg>'+nodes.map((ns,i)=>'<div class="net-col" data-layer="'+i+'">'+ns.map(n=>'<div class="node" data-node="'+n+'"><span>'+n+'</span><span class="node-value">'+(hero?'•':'0')+'</span></div>').join('')+'<span class="net-label">'+labels[i]+'</span></div>').join('')+'</div>';}
const slides=[
{title:'Inside a neural network',kicker:'Session 02 · understand what happens inside',html:()=>'<div class="grid hero02"><div class="stack"><h1>Small calculations.<br><em>Powerful patterns.</em></h1><p class="lead">Build a neuron. Trace a network. Change its parameters. Discover why predictions still need testing.</p><div class="row"><span class="tag">Beginner friendly</span><span class="tag">2-hour class</span><span class="tag">Bright + dark themes</span></div><p class="muted">You can inspect every step in today’s experiments.</p></div><div class="hero-diagram">'+networkMarkup(true)+'<div class="row between small"><span>Inputs → representations → output</span><span>2 hidden layers</span></div></div></div>',notes:'Welcome back. This lesson follows the manual’s Book Session 2: definition, ML comparison, neural networks, applications, representative algorithm families, and the stock-prediction case study. All examples are original supplementary material. The full book’s exact algorithm list was not supplied. The presentation works offline; no API account or large deep-learning framework is required. Themes are available throughout the course.'},
{title:'Reconnect with Session 1',kicker:'Retrieval · explain before you click',html:()=>'<div class="grid two">'+quiz('recall')+panel('The question we left with','Weight alone confused a small mango with an orange. What if our model could combine several measurements—and learn useful combinations?','dark')+'</div>'+note('Tell a partner why testing on new fruit mattered. A model can perform well on familiar cases and struggle with new ones.'),notes:'About 3 minutes. Ask everyone to answer privately, then compare. Expected: a feature is an input characteristic; labels are known answers. Revisit training/test separation. A new feature may help but does not guarantee reliable identification. This lesson introduces multiple transformations and explains their purpose.'},
{title:'The route—and what you will demonstrate',kicker:'120 minutes · eight connected blocks',html:()=>'<div class="grid two"><div class="panel stack"><h3>By the end, you can…</h3><ul><li>Explain deep learning and its relationship to ML.</li><li>Calculate a neuron’s output.</li><li>Explain weights, bias, activation, and layers.</li><li>Distinguish training from inference.</li><li>Inspect a prediction and compare a baseline.</li></ul></div><div class="panel">'+sections.map((s,i)=>'<div class="agenda-row"><span class="muted">'+(i+1)+'</span><button data-go="'+s.start+'">'+s.name+'</button><span class="time">'+s.time+' min</span></div>').join('')+'</div></div>',notes:'Timing: reconnect 0–10; meaning 10–25; neuron/network 25–50; training 50–65; families/applications 65–75; case study 75–90; Python 90–105; practice/exit 105–120. Use short explanations and active checks. The timer in Contents is optional. Core implementation is arithmetic and forward computation; differentiation and architecture details remain conceptual or optional.'},
{title:'How could a computer recognise a fruit photo?',kicker:'Start with a problem',html:()=>'<div class="grid three">'+panel('What a person sees','A fruit with colour, texture, outline, and context. Ask: which visual clues helped you?')+panel('What a program receives','Numbers describing pixel values. A pixel is one small picture element.')+panel('What it must produce','A proposed category such as Orange or Mango, based on a learned method.')+'</div>'+note('Class challenge: describe a complete rule that recognises every mango in every photo. What happens with shadows, rotation, or a partly hidden fruit?')+'<p class="lead">The difficulty motivates learning useful representations from examples.</p>',notes:'About 4 minutes. Let learners propose rules and invent counterexamples. Explain pixels without using an unexplained image tensor. A trained system may learn useful combinations of image features; it does not literally inspect fruit with human understanding. Our later numerical examples are simplified illustrations, not a working image recogniser.'},
{title:'Deep learning: build representations through layers',kicker:'Meaning before terminology',html:()=>'<div class="grid two">'+panel('Everyday explanation','A neural network can transform input information several times, learning combinations useful for its task.','dark')+panel('Precise definition','Deep learning uses neural networks with multiple processing layers to learn representations that support tasks such as recognition, prediction, or generation.')+'</div><div class="flow">'+panel('Input','Original information.')+'<span class="flow-arrow">→</span>'+panel('Hidden layers','Intermediate transformations.')+'<span class="flow-arrow">→</span>'+panel('Output','Task-specific result.')+'</div><p class="small muted">Depth is about layers. A large dataset, a long program, or impressive output alone does not define it.</p>',notes:'About 3 minutes. Explain representation as a way of expressing information so the next calculation can use it. Hidden means intermediate, not intentionally secret. Depth conventions vary; avoid a universal minimum-layer claim. Our trace demo has two hidden layers. Further teacher reading: Goodfellow, Bengio and Courville, Deep Learning, Chapter 6 (linked in Contents).'},
{title:'Deep learning belongs inside machine learning',kicker:'Compare choices, not hype',html:()=>'<div class="table-wrap"><table class="comparison"><thead><tr><th>Question</th><th>Conventional ML examples</th><th>Deep learning</th></tr></thead><tbody><tr><td>How does it represent inputs?</td><td>Often uses selected or engineered features.</td><td>Can learn multiple levels of representation.</td></tr><tr><td>Where can it help?</td><td>Many table-based tasks and simpler datasets.</td><td>Complex signals such as images, audio, and language.</td></tr><tr><td>What does it need?</td><td>Suitable data, method, and evaluation.</td><td>Suitable data and evaluation; often substantial training computation.</td></tr><tr><td>Is it always better?</td><td colspan="2">Choose based on the task and evidence. Simpler methods can be sufficient.</td></tr></tbody></table></div>'+quiz('deep'),notes:'About 4 minutes. Explain that the comparison describes tendencies, not strict boundaries. Conventional methods can learn representations too; deep models can use engineered features. Training a large model differs from using a pre-trained model for inference. Ask students to explain why dataset size alone does not define deep learning.'},
{title:'A useful picture of representations',kicker:'From details to useful combinations',html:()=>'<div class="flow">'+panel('Picture numbers','Pixel values represent the original image.')+'<span class="flow-arrow">→</span>'+panel('Local patterns','Some early units may respond to features such as boundaries or contrast.')+'<span class="flow-arrow">→</span>'+panel('Combinations','Later transformations can combine information useful for a category.')+'</div><div class="worksheet">'+field('representation','Explain “representation” using your own everyday example.','Example: a map represents roads using lines and symbols.')+'</div>'+note('“Edges → shapes → objects” is a helpful illustration for some image networks. It is not a guaranteed description of what every layer learns.'),notes:'About 4 minutes. Use a map as a representation: it keeps useful structure while leaving out some detail. Ask what a photo representation must preserve for fruit recognition. Do not assign fixed human meanings to every hidden neuron. Networks learn task-dependent representations; this is an illustration.'},
{title:'An artificial neuron is a mathematical unit',kicker:'A limited analogy',html:()=>'<div class="grid two">'+panel('The useful analogy','Many connected units contribute to a result. Each artificial unit receives values and calculates an output.','green')+panel('Where the analogy stops','An artificial neural network is not a complete model of a human brain. Numerical outputs do not establish feelings or human understanding.')+'</div><div class="role-cards">'+['Inputs|Values entering the unit.','Weights|Multipliers for those values.','Bias|An added offset.','Activation|The rule that transforms the combined value.'].map(x=>{const [a,b]=x.split('|');return '<div class="panel"><b>'+a+'</b>'+b+'</div>';}).join('')+'</div>',notes:'About 2 minutes. ANN means artificial neural network. Describe each unit as a computation. Avoid language that says it knows, feels, or thinks in the biological sense. The basic weighted-sum-plus-activation unit is a building block; different architectures contain additional operations.'},
{title:'Why does a neuron have these parts?',kicker:'Each part has a job',html:()=>'<div class="grid two">'+panel('Inputs and weights','Inputs describe a case. Multiplying each input by a weight controls how it contributes to the combined score.')+panel('Bias','An extra added value shifts the score. It lets the unit respond at a different level without changing every input multiplier.')+panel('Activation','A transformation such as ReLU introduces a bend into the calculation. This helps networks express more than a single straight-line relationship.')+panel('Output','The resulting value can feed another unit or contribute to the final result.')+'</div>'+note('A weight is not a universal importance score. Its effect depends on the input, scaling, and other calculations.'),notes:'About 2 minutes. Ask which part multiplies and which adds. Use negative weights to illustrate that an input can reduce a combined score. Emphasise feature scaling; a large numerical input with a small multiplier may contribute more than a small input with a large multiplier.'},
{title:'First, make the arithmetic familiar',kicker:'Two small operations',html:()=>'<div class="grid two"><div class="panel stack"><h3>Multiply: scale a contribution</h3><p class="number-chip">0.8 × 0.6 = 0.48</p><p>The input is 0.8. Its weight is 0.6. Their contribution is 0.48.</p></div><div class="panel stack"><h3>Add: combine contributions</h3><p class="number-chip">0.48 + 0.12 − 0.5 = 0.10</p><p>The contributions combine with a negative bias of −0.5.</p></div></div>'+note('Our two toy input signals use a 0-to-1 scale: 0 means absent and 1 means full strength. They are fictional measurements, not a validated fruit detector.'),notes:'About 2 minutes. Briefly explain decimals and negative numbers if needed. A negative bias reduces the sum. The input signals have been deliberately scaled for the illustration. Ask students to calculate 0.4 × 0.3 before showing 0.12 on the next slide.'},
{title:'Calculate one score by hand',kicker:'Work through the entire example',html:()=>'<div class="grid two"><div class="formula">colour contribution = 0.8 × 0.6 = 0.48<br>shape contribution = 0.4 × 0.3 = 0.12<br>combined score = 0.48 + 0.12 − 0.5<br><span class="accent-text">score = 0.10</span></div><div class="panel stack"><h3>A toy decision rule</h3><p>If the score is at least zero, output “Mango”. Otherwise output “Orange”.</p><p>At 0.10, the rule outputs Mango.</p><p class="small muted">These parameters were chosen for teaching. This is a calculation, not evidence of a trained or reliable fruit model.</p></div></div>'+note('Predict: if the bias changes from −0.5 to −0.8, which output should we get?'),notes:'About 2 minutes. New score = 0.48 + 0.12 − 0.8 = −0.2, hence Orange under the chosen rule. Explain ≥ as “at least” before using it in Python later. A score is not automatically a probability or confidence level.'},
{title:'Build and change your own neuron',kicker:'Live lab · every contribution is visible',compact:true,html:()=>'<div class="lab-split"><div class="controls"><div class="control-grid">'+control('x1','Colour signal',state.neuron.x1,0,1,'.05')+control('x2','Shape signal',state.neuron.x2,0,1,'.05')+control('w1','Colour weight',state.neuron.w1,-2,2,'.1')+control('w2','Shape weight',state.neuron.w2,-2,2,'.1')+control('bias','Bias',state.neuron.b,-2,2,'.1',true)+'</div><button id="resetNeuron">Restore the worked example</button></div><div class="stack"><div class="panel calculation" id="neuronCalc" aria-live="polite"></div><div class="result-block" id="neuronResult" aria-live="polite"></div><p class="lab-note">Change one value. Predict its effect. Check the numbers. Explain what happened.</p></div></div>',notes:'About 4 minutes. Default contributions are 0.48 and 0.12; bias −0.5; score approximately 0.1, decision Mango. Move bias to −0.8 to change the decision. Set colour weight to −1 and predict the effect before moving it. The lab uses actual browser arithmetic, with rounded display values. Manually chosen parameter changes are experiments, not a training algorithm.'},
{title:'Bias moves the starting point',kicker:'Why an added offset helps',html:()=>'<div class="grid two">'+panel('Without a bias','A weighted sum of zero inputs is zero. The model cannot freely shift that starting value.')+panel('With a bias','The unit can have a different score even when inputs are zero. A threshold decision can therefore shift.')+'</div><div class="formula">score = input₁ × weight₁ + input₂ × weight₂ + bias</div>'+note('Try in the neuron lab: set both inputs to zero, then change the bias. Describe the result.')+'<button data-go="11" class="primary">Return to the neuron experiment →</button>',notes:'About 1 minute. Explain subscripts 1 and 2 as labels for the first and second input, not powers. In a linear model, bias is an intercept. Do not confuse model bias (an offset parameter) with social or statistical bias; the same word is used for different concepts.'},
{title:'Activation: what happens after the sum?',kicker:'Live lab · introduce a bend',compact:true,html:()=>'<div class="lab-split"><div class="stack">'+control('activationX','Combined value',state.activationX,-3,3,'.1')+'<div class="tabs"><button data-activation="relu" aria-pressed="'+(state.activation==='relu')+'">ReLU</button><button data-activation="linear" aria-pressed="'+(state.activation==='linear')+'">No transformation</button></div><div class="formula">ReLU(value) = max(0, value)</div><p class="lab-note">max chooses the larger value. ReLU returns zero for a negative input and keeps a positive input.</p></div><div class="panel stack"><svg id="activationChart" class="chart" role="img" aria-label="Activation function and selected value"></svg><div id="activationResult" class="trend-result" aria-live="polite"></div></div></div>'+note('ReLU is one activation, not the only one. Sigmoid maps values between 0 and 1; its output still needs an appropriate interpretation and evaluation.'),notes:'About 3 minutes. At −1, ReLU gives 0 and the linear transformation gives −1. At 2 both give 2. Ask why the ReLU graph has a bend. Introduce max() and commas as function arguments, but full implementation appears only where appropriate. Sigmoid and other activations are a brief overview; do not describe every 0-to-1 output as calibrated confidence.'},
{title:'Connect units into layers',kicker:'A network is a chain of transformations',html:()=>'<div class="panel">'+networkMarkup()+'</div><div class="grid three">'+panel('Input layer','Holds the supplied feature values.')+panel('Hidden layers','Calculate intermediate representations. Our diagram contains two hidden layers.')+panel('Output layer','Produces a task-specific value or decision.')+'</div>'+note('Depth counts layers in the chain. Width counts units within a layer. Different conventions may count input layers differently.'),notes:'About 2 minutes. Ask learners to count two inputs, two units in each hidden layer, and one output. There are two hidden layers. Explain that arrows show which outputs are used as inputs for the next stage. This is a feedforward network: computation flows through the stages for one pass.'},
{title:'Follow one forward pass',kicker:'Live lab · trace two hidden layers',compact:true,html:()=>'<div class="lab-split"><div class="stack"><div class="control-grid">'+control('netX1','Input x1',state.netX1,0,1,'.05')+control('netX2','Input x2',state.netX2,0,1,'.05')+'</div><div class="phase">'+['Inputs','Hidden 1','Hidden 2','Output'].map((t,i)=>'<button data-trace="'+i+'" aria-pressed="'+(state.trace===i)+'">'+(i+1)+'. '+t+'</button>').join('')+'</div><button id="nextTrace" class="primary">Next calculation →</button><div class="panel trace-box stack" id="traceText" aria-live="polite"></div></div><div class="panel stack">'+networkMarkup()+'<p class="lab-note">Two hidden layers · ReLU in hidden units · chosen teaching parameters</p></div></div>',notes:'About 4 minutes. Default x1=0.8 and x2=0.4. h1=max(0,0.8x1+0.2x2−0.1)=0.62; h2=max(0,−0.4x1+0.9x2+0.05)=0.09; g1=max(0,0.7h1+0.3h2−0.05)=0.411; g2=max(0,−0.2h1+0.8h2+0.1)=0.048; out=0.9g1−0.3g2+0.02=0.3755. Each stage transforms prior outputs. Do not imply these chosen parameters learned to recognise fruit. The displayed intermediate values are computed, not scripted.'},
{title:'Why multiple linear layers are not enough',kicker:'A small experiment with a bend',compact:true,html:()=>'<div class="lab-split"><div class="stack"><p>Target: a V-shaped output. Positive and negative inputs should both produce a positive magnitude.</p><div class="tabs"><button data-nonlinear="true" aria-pressed="'+state.nonlinear+'">With ReLU</button><button data-nonlinear="false" aria-pressed="'+!state.nonlinear+'">Without ReLU</button></div><div class="formula">Unit A: transform(x)<br>Unit B: transform(−x)<br>Output: A + B</div><p class="lab-note">With ReLU: max(0, x) + max(0, −x). Without it: x + (−x) = 0.</p></div><div class="panel stack"><svg class="chart" id="nonlinearChart" role="img" aria-label="V-shaped target compared with a network with or without nonlinear activations"></svg><div class="legend"><span><i class="swatch green-line"></i>Target</span><span><i class="swatch"></i>Computed output</span></div><div class="trend-result" id="nonlinearResult" aria-live="polite"></div></div></div>'+note('A chain of only affine transformations can collapse to one affine transformation. Nonlinear activations expand what a network can express.'),notes:'About 2 minutes. This small demonstration uses one hidden layer with two units, not a deep network. Its purpose is the role of nonlinearity. With ReLU the sum equals |x|; without it the sum is zero. A deeper network is not automatically better, and this target does not need many layers. Say “affine” means a scaled sum plus an offset; the formal term is optional.'},
{title:'Changing a value is not the same as training',kicker:'Separate the two jobs',html:()=>'<div class="grid two">'+panel('Training','Use examples and an objective to adjust parameters. A training algorithm decides how weights and biases should change.','green')+panel('Inference','Supply a case and compute an output using the current parameters. The forward-pass lab demonstrates this.')+'</div><div class="flow">'+panel('Predict','Run a training example.')+'<span class="flow-arrow">→</span>'+panel('Measure error','Compare with its known answer.')+'<span class="flow-arrow">→</span>'+panel('Update','Adjust parameters using a method.')+'</div>'+note('Manually moving a slider explores sensitivity. The next training lab applies an actual update rule from data.'),notes:'About 2 minutes. Connect to Session 1: the nearest-neighbour method stores examples; this new linear neuron adjusts numeric parameters. Both can be ML despite different training procedures. Explain that ordinary use of a trained model is inference.'},
{title:'A loss tells us how far a prediction misses',kicker:'Meaning before the formula',html:()=>'<div class="grid two"><div class="panel stack"><h3>Numerical prediction</h3><p>Known answer: 6<br>Model prediction: 4<br>Difference: −2</p><p class="number-chip">Squared error = (−2) × (−2) = 4</p><p class="small muted">Mean squared error averages these squared differences across examples.</p></div>'+quiz('loss')+'</div>'+note('Loss is the objective used to guide training. The right objective depends on the task; numerical prediction and classification need different choices.'),notes:'About 3 minutes. Define mean as the total divided by the count. Explain the square without exponents first. MAE comes in the stock case as an easier-to-interpret evaluation measure. Do not make students differentiate formulas in this foundational lesson.'},
{title:'Train one neuron and watch its error change',kicker:'Live lab · real parameter updates',compact:true,html:()=>'<div class="lab-split"><div class="stack"><div class="formula">prediction = input × weight + bias</div>'+control('learningRate','Learning rate',state.train.rate,.02,1,'.02')+'<div class="row"><button id="trainOne" class="accent">Train 1 step</button><button id="trainTwenty" class="primary">Train 20 steps</button><button id="resetTraining">Reset</button></div><div class="live-stats" id="trainingStats" aria-live="polite"></div><div class="loss-change" id="lossChange" aria-live="polite"></div><p class="lab-note">Five synthetic training pairs: 0→0.2, 0.25→0.35, 0.5→0.5, 0.75→0.65, 1→0.8. No test cases are used for these updates.</p></div><div class="panel stack"><svg id="trainingChart" class="chart" role="img" aria-label="Training targets and current learned line"></svg><div class="legend"><span><i class="swatch green-line"></i>Known training targets</span><span><i class="swatch"></i>Current neuron</span></div><svg id="lossChart" class="chart small-chart" role="img" aria-label="Mean squared training error over update steps"></svg></div></div>'+note('This trains one linear neuron to expose the process. It is not a trained deep network. Training error alone does not establish generalisation.'),notes:'About 5 minutes. Default mean squared error is 0.295 (targets squared and averaged). First batch-gradient update at rate 0.1: weight=0.065, bias=0.1; error decreases. The data follow y=0.6x+0.2, so repeated small updates approach those parameters. Actual batch gradients are computed from the five examples. Reset, set rate 1, and train 20 steps; this large rate can destabilise updates. Explain why bigger steps are not always better. Stop if display values become very large; the reset is always available.'},
{title:'How does the update know which way to move?',kicker:'Gradient descent and backpropagation',html:()=>'<div class="grid two">'+panel('Gradient descent','Use information about how the loss changes to adjust parameters in a direction intended to reduce it. The learning rate controls step size.','dark')+panel('Backpropagation','Compute how parameters in earlier layers affect the loss by working backwards through the calculations. An optimiser then uses those gradients.')+'</div>'+note('Backpropagation computes gradients. Gradient descent uses them to update parameters. These are related jobs, not the same operation.')+'<details><summary>Optional: inspect our one-neuron update rule</summary><p>For each example, error = prediction − target. The weight gradient is the average of 2 × error × input. The bias gradient is the average of 2 × error. Update each parameter by subtracting learning rate × its gradient.</p></details>',notes:'About 3 minutes. Explain a gradient as information about local change, not a magical instruction that guarantees a global best solution. The one-neuron lab computes gradients directly because the model is simple; it does not run multi-layer backpropagation. For multilayer networks, backpropagation efficiently applies the chain rule. Formal derivatives remain optional.'},
{title:'Good training results need another check',kicker:'Overfitting and generalisation',html:()=>'<div class="grid three">'+panel('Underfitting','The chosen model or training may capture too little useful structure. It performs poorly even on training examples.')+panel('Overfitting','It fits peculiar details of training examples that do not transfer well to new cases.')+panel('Generalisation','Evaluate on appropriate examples outside training. Compare a useful baseline and inspect failures.')+'</div><div class="worksheet">'+field('trainingReflection','After the training lab: what changed, and what would you still need before trusting the model?','Mention parameters, error, and new examples.')+'</div>'+note('For real training, validation guides development and a separate final test can assess the chosen model. Repeatedly tuning to the test set weakens that test.'),notes:'About 2 minutes. Avoid pretending the simple linear lab demonstrates overfitting by itself; these are separate concepts. Explain training, validation, and final test roles simply. Examples must represent the setting of use, and time series must respect time. More depth does not prevent overfitting.'},
{title:'Meet the main neural-network families',kicker:'Explore the purpose of each design',compact:true,html:()=>'<div class="family-grid">'+Object.entries(families).map(([id,f])=>'<button data-family="'+id+'" aria-pressed="'+(state.family===id)+'">'+f.short+'<br><span class="small muted">'+f.tag+'</span></button>').join('')+'</div><div class="panel family-detail" id="familyDetail" aria-live="polite"></div>'+note('Representative overview: the full textbook’s exact algorithm list was not supplied. Learn each design’s purpose; implementing all these architectures is beyond this two-hour class.'),notes:'About 5 minutes. Core examples: feedforward/MLP, CNN, RNN/LSTM, Transformer, autoencoder, GAN, diffusion. These are architecture or model families, while gradient descent/backpropagation are training methods. Read the short purpose and example for each. Avoid saying one family exclusively handles one kind of data. LSTM is a gated recurrent architecture, not a separate learning category.'},
{title:'Choose an application—and explain its limits',kicker:'Purpose across sectors',html:()=>'<div class="grid three">'+panel('Vision and agriculture','Recognise patterns in crop images. Test changes in light, backgrounds, and plant varieties.')+panel('Audio and education','Convert spoken lessons to text. Check accents, background noise, and subject vocabulary.')+panel('Language and services','Translate or generate text. Check meaning, factual errors, and suitability for the task.')+panel('Manufacturing','Inspect product images for defects. Evaluate both missed defects and false alarms.')+panel('Health research','Analyse patterns in medical images. Reliable use requires careful validation and expert judgement.')+panel('Finance','Model sequences such as historical prices. Changing conditions and future information can undermine evaluation.')+'</div>',notes:'About 5 minutes including pair task. Ask pairs to select one application, describe input/output, and name a plausible failure. These are examples of possible uses, not a claim of clinical readiness or guaranteed effectiveness. Prominent modern examples such as speech recognition and language generation illustrate the task; do not imply every implementation uses the same architecture.'},
{title:'Case study: can we predict tomorrow’s price?',kicker:'The question before the model',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>Our fictional market</h3><p>We have 12 daily closing prices. We want a rolling one-day-ahead prediction.</p><p>Earlier observations teach a model. Later observations check it.</p><p class="small muted">Synthetic numbers in arbitrary price units. This is an evaluation exercise, not investment guidance.</p></div><div class="panel stack"><h3>Define the task</h3><ul><li>Input must be available before the predicted close.</li><li>Target is the next closing price.</li><li>Training uses earlier days.</li><li>Compare with a simple baseline.</li><li>Measure errors on later days.</li></ul></div></div>'+note('Our baseline predicts the last observed closing price. A neural model must earn its extra complexity by outperforming useful alternatives.'),notes:'About 3 minutes. Explain time series as observations in time order. Tomorrow’s closing price cannot be an input to today’s forecast. In the live exercise, the prior close becomes known before each new forecast. The trend model is fitted only to days up to the split and remains fixed during evaluation. This keeps the distinction between training and later information clear.'},
{title:'Compare predictions on later days',kicker:'Live case study · time order matters',compact:true,html:()=>'<div class="tabs stock-tabs"><button data-stock="baseline" aria-pressed="'+(state.stockMethod==='baseline')+'">Last observed price</button><button data-stock="trend" aria-pressed="'+(state.stockMethod==='trend')+'">One-neuron trend</button><button data-stock="leak" aria-pressed="'+(state.stockMethod==='leak')+'">Copies the future · invalid</button></div><div class="lab-split"><div class="panel stack"><svg id="stockChart" class="chart" role="img" aria-label="Synthetic prices and model predictions with a chronological training/test split"></svg><div class="legend"><span><i class="swatch green-line"></i>Observed price</span><span><i class="swatch"></i>Prediction</span></div><p class="stock-caption" id="stockCaption"></p></div><div class="stack">'+control('stockSplit','Train through day',state.stockSplit,6,9,'1')+'<div class="live-stats" id="stockStats" aria-live="polite"></div><div id="stockInsight" class="trend-result" aria-live="polite"></div><div class="table-wrap" id="stockTable"></div></div></div>',notes:'About 8 minutes. Default split is after Day 8. Baseline later MAE is 3 price units. The fitted trend extrapolates the earlier rise and performs worse after the drop. Fitting a straight line by least squares yields the same representational form as a one-input linear neuron, not a deep neural network. The future-copy option returns observed targets directly and therefore gets zero error; it is explicitly invalid leakage, not a trained model. Moving the split changes which examples are used for fitting and evaluation; repeated inspection is exploration, not a pristine final test.'},
{title:'What would a deeper stock model require?',kicker:'Architecture cannot repair the experiment',html:()=>'<div class="grid two"><div class="panel stack"><h3>A possible project design</h3><ul class="purpose-list"><li>Create windows of past observations and next-step targets.</li><li>Fit preprocessing only on earlier training data.</li><li>Consider an appropriate sequence model, such as an LSTM, alongside simpler methods.</li><li>Use chronological validation and a later final test.</li></ul></div>'+quiz('leak')+'</div>'+note('Twelve synthetic prices are too small for a meaningful deep-learning performance claim. A good prediction score alone also does not establish profitable trading.'),notes:'About 4 minutes. The case study introduces how to evaluate a potential deep-learning project; it does not claim a deep stock model has been trained. Discuss uncertainty, changing conditions, leakage, and the need for representative historical examples. Transaction costs and other assumptions matter for trading claims, which are outside this exercise. A simple baseline can be hard to beat.'},
{title:'Translate the calculation into Python',kicker:'Reuse Session 1—and add arithmetic',html:()=>'<div class="grid three">'+panel('Numbers','0.8 is a numerical value. Quotation marks would make "0.8" text instead.')+panel('Operators','* multiplies; + adds; a minus sign can express a negative value. Parentheses can control grouping.')+panel('Comparison','score >= 0 checks whether the score is at least zero. Its result is True or False.')+'</div><div class="grid two">'+panel('Assignment','name = value stores a value. Later expressions can use that name.')+panel('Function arguments','round(score, 3) asks for the score rounded to 3 decimal places. The comma separates its two arguments.')+'</div>'+note('First understand each part. Then run the program. The output is a calculation and a boolean, not a trained model.'),notes:'About 3 minutes. All new syntax is introduced before the full example: multiplication, arithmetic precedence, negative numbers, comparison, booleans, round, comma-separated arguments. In score = ... multiplication occurs before addition. Parentheses can make grouping explicit. Explain that rounding changes display, not the underlying decision score.'},
{title:'Run a complete neuron calculation',kicker:'Live code · change one thing and predict',compact:true,html:()=>'<div class="grid two"><div class="stack"><label for="codeEditor">Edit the values or expression:</label><textarea id="codeEditor" class="editor code02" spellcheck="false" autocapitalize="off">'+esc(state.code)+'</textarea><div class="row"><button id="runCode" class="accent">Run calculation</button><button id="restoreCode">Restore example</button></div></div><div class="stack"><h3>Output</h3><div class="console" id="codeOutput" aria-live="polite">'+esc(state.codeOutput||'Predict the score and comparison result.')+'</div>'+panel('Trace the values','0.8 × 0.6 = 0.48<br>0.4 × 0.3 = 0.12<br>0.48 + 0.12 − 0.5 = 0.10<br>0.10 is at least zero → True.')+'<p class="code-caption">This page runs a limited teaching interpreter for the shown arithmetic subset. It is not a full Python runtime. The matching real-Python file is available below.</p><a href="neuron_foundations.py" download class="small">Download the real Python example</a></div></div>',notes:'About 5 minutes. Expected output: 0.1 then True. Default arithmetic uses floating-point numbers; round makes the display easier to read. Change bias to −0.8 and predict −0.2 then False. A missing assignment operator or unknown name should produce an explanation. The browser parser supports the shown arithmetic, comparisons, simple function calls, and print; loops, imports, and custom functions are outside its scope. Run the supplied .py file in real Python for the actual language.'},
{title:'Explain why every line exists',kicker:'Choose a line to inspect',html:()=>'<div class="line-buttons">'+codeLines.map((x,i)=>'<button data-line="'+i+'">Line '+(i+1)+'</button>').join('')+'</div><div class="panel stack detail" id="lineDetail" aria-live="polite"><h3>Each line has a purpose.</h3><p>Choose a line. Explain its role, its syntax, and what changes if it is removed or altered.</p></div><pre class="code">'+esc(INITIAL_CODE)+'</pre>',notes:'About 4 minutes. Inspect all eight lines quickly, asking learners to explain the purpose. Removing an input assignment leaves an undefined name; removing a weight changes whether the score can be calculated; removing print hides the result; changing the comparison changes the decision question. The model parameters in this file are chosen for demonstration, not learned from a fruit dataset.'},
{title:'Investigate a running program as well as an error',kicker:'Predict → run → compare → explain',html:()=>'<div class="grid three">'+panel('Change the bias','Set bias = −0.8. Predict the score and True/False result before running.')+panel('Change the contribution','Set weight_colour = 0.0. Which contribution disappears, and why?')+panel('Change the question','Replace score >= 0 with score < 0. Does the numeric score change? Why does the boolean change?')+'</div><div class="worksheet">'+field('codeWhy','Record one change, your prediction, the actual result, and your explanation:')+'</div><button data-go="28" class="primary">Return to the code lab →</button>',notes:'About 3 minutes. Bias −0.8 gives −0.2 and False. Colour weight zero with other defaults gives −0.38 and False. Changing >= to < changes the boolean question but does not change the numeric score. If code contains colour_signal instead of colour without assigning that name, a name error is appropriate. Let students diagnose the cause from the line.'},
{title:'Become the network',kicker:'Practical team challenge · 5 minutes',html:()=>'<div class="role-cards">'+['Inputs|Supply x1 = 0.5 and x2 = 0.5.','Hidden layer 1|Calculate h1 and h2 with the displayed rules.','Hidden layer 2|Use h1 and h2 to calculate g1 and g2.','Output|Calculate 0.9 × g1 − 0.3 × g2 + 0.02.'].map(x=>{const [a,b]=x.split('|');return '<div class="panel"><b>'+a+'</b>'+b+'</div>';}).join('')+'</div><div class="worksheet grid two">'+field('networkTrace','Write the intermediate values and final output.','h1, h2, g1, g2, out')+field('networkWhy','Explain why each layer must wait for the previous values.')+'</div><div class="row"><button data-go="15">Open the network and formulas</button><button id="downloadWork" class="primary">Download my worksheet</button></div>',notes:'Allow 5 minutes. This uses the same chosen parameters as the trace lab. With x1=x2=0.5: h1=0.4; h2=0.3; g1=0.32; g2=0.26; out=0.23. Teams should calculate in order and explain dependencies. Students without devices can use cards and paper. Use a tolerance for rounded intermediate values, not exact floating-point strings.'},
{title:'Design an experiment that teaches you something',kicker:'Independent task · 4 minutes',html:()=>'<div class="worksheet grid two">'+field('experiment','Choose one parameter to change. Predict and record its effect.','Use the neuron, training, or stock lab.')+field('limits','Explain one limitation and how you would investigate it.','Which new examples, comparison, or checks would you need?')+'</div><div class="panel stack"><h3>Success criteria</h3><p>You identify the input and parameter, predict a change, report the observed result, explain the cause, and propose a useful next check.</p><details><summary>Optional stretch</summary><p>Reset training. Compare 20 updates at learning rates 0.1 and 1.0. Explain the difference without claiming that a bigger rate is always better.</p></details></div>',notes:'Allow 4 minutes. Suggested supplementary rubric: explanation 40%, practical execution 30%, testing 20%, reflection 10%, subject to institutional rules. Hints: first state the formula; identify what your chosen value changes; alter only that value; compare numbers; test a new case. Accept multiple well-supported experiments. Do not require implementing all surveyed architectures.'},
{title:'Exit ticket: defend the idea',kicker:'Individual check · 4 minutes',html:()=>'<div class="grid three">'+quiz('exit1')+quiz('exit2')+quiz('exit3')+'</div><div class="worksheet">'+field('exitWhy','Why can a model fit earlier stock prices well and still predict later prices poorly?','Explain in your own words.')+'</div>',notes:'Allow 4 minutes. Correct: a weight scales a contribution; training adjusts parameters from examples/objective; unseen evaluation and baseline matter. Written answer should mention changing conditions, unrepresentative data, overfitting, or unavailable future information. Reteach unclear concepts with a concrete example and a new prediction rather than repeating definitions.'},
{title:'A stronger foundation—built one step at a time',kicker:'Keep the meaning with the calculation',html:()=>'<div class="grid two"><div class="panel dark stack"><h3>What you can inspect now</h3><p>A weighted sum. An activation. Two hidden layers. Parameter updates. A prediction tested against a baseline.</p><p class="small muted">Next: define a problem, compare agents, and search for a solution.</p></div><div class="panel stack"><h3>Finish Self-study Block S1 · 45 minutes</h3><ul><li><b>30 min:</b> repeat the neuron calculation and one network trace; change an input and explain the result.</li><li><b>15 min:</b> reflect on training, inference, and the stock-case failure.</li></ul><p class="small muted">Together with Session 1’s 75 minutes, this completes the 120-minute S1 block.</p><button id="downloadFinal" class="primary">Download my work and reflection</button></div></div><div class="portfolio"><a href="session-01.html">← Revisit Session 1</a><a href="neuron_foundations.py" download>Real Python example</a><button id="sourcesBtn">Sources and coverage</button></div><p class="copyright">Original supplementary lesson aligned with the supplied Aptech presenter’s outline, April 2026 v1.0. Textbook questions and exact algorithm list were not supplied.</p>',notes:'Allow 2 minutes to close. Encourage students to download work before changing computers. It is stored locally, not submitted to the teacher. When official ProConnect questions become available, replace overlapping supplementary tasks to keep within the total self-study allocation. The main class outcomes are implemented at introductory depth; broad architecture families are a survey.'}
];
const families={mlp:{short:'MLP / feedforward',tag:'Combine features',symbol:'Σ → f',title:'Feedforward network / multilayer perceptron',meaning:'Values move from inputs through learned transformations to an output.',example:'A table-based numerical prediction or classification task.',limit:'Choose features, capacity, data, and evaluation carefully.'},cnn:{short:'CNN',tag:'Local patterns',symbol:'▦ → ▣',title:'Convolutional neural network',meaning:'Shared filters process local regions, helping detect useful spatial patterns.',example:'Image recognition or visual defect inspection.',limit:'Changes in viewpoint, lighting, and training coverage can affect results.'},rnn:{short:'RNN / LSTM',tag:'Sequences',symbol:'t−1 → t',title:'Recurrent network and LSTM',meaning:'Sequence processing uses a changing internal state; LSTM uses gates to regulate information.',example:'Time-series or language sequences.',limit:'Long-term dependencies, data quality, and changing conditions still matter.'},transformer:{short:'Transformer',tag:'Attention',symbol:'a ↔ b',title:'Transformer',meaning:'Attention combines information from other positions to build context-dependent representations.',example:'Translation, language modelling, and many other signal tasks.',limit:'The learned representation is not a guarantee of factual correctness.'},autoencoder:{short:'Autoencoder',tag:'Reconstruct inputs',symbol:'▦ → · → ▦',title:'Autoencoder',meaning:'Learn an encoding and a reconstruction of the input under a chosen objective.',example:'Representation learning or reconstruction-based anomaly detection.',limit:'A reconstruction error needs careful interpretation and evaluation.'},gan:{short:'GAN',tag:'Adversarial learning',symbol:'G ↔ D',title:'Generative adversarial network',meaning:'A generator and discriminator are trained with competing objectives.',example:'Generating image-like samples.',limit:'Training can be difficult and may fail to cover diverse outputs.'},diffusion:{short:'Diffusion',tag:'Learn denoising',symbol:'░ → ▓',title:'Diffusion model',meaning:'Learn to reverse a noise-corruption process, enabling iterative generation.',example:'Image generation and other generative tasks.',limit:'Output quality and suitability require checks; sampling can require many computations.'}};
const codeLines=[['colour = 0.8','Store a numeric input under a descriptive name. No quotes: this is a number, not text.'],['shape = 0.4','Store the second input independently so it can have its own contribution.'],['weight_colour = 0.6','Store a multiplier for the colour input. This parameter scales that contribution.'],['weight_shape = 0.3','Give the second input a separate multiplier.'],['bias = -0.5','Store a negative offset. It shifts the total without changing the input multipliers.'],['score = colour * weight_colour + shape * weight_shape + bias','Multiply each input by its weight, add the contributions and bias, then store the resulting score. Multiplication takes precedence over addition.'],['print(round(score, 3))','round receives two arguments: score and 3 decimal places. print displays the rounded result. This changes the display, not the stored score.'],['print(score >= 0)','The comparison asks whether score is at least zero. Its boolean result, True or False, is passed to print.']];
const trainX=[0,.25,.5,.75,1],trainY=[.2,.35,.5,.65,.8];
const prices=[100,102,101,104,106,107,108,110,103,101,99,100];
function loss(w,b){return trainX.reduce((s,x,i)=>s+(w*x+b-trainY[i])**2,0)/trainX.length;}
state.train.history[0]=loss(0,0);
function neuronValues(){const n=state.neuron,a=n.x1*n.w1,b=n.x2*n.w2,z=a+b+n.b;return {a,b,z,decision:z>=0?'Mango':'Orange'};}
function updateNeuron(){const n=state.neuron,v=neuronValues();['x1','x2','w1','w2'].forEach(k=>document.getElementById(k+'Value').textContent=fmt(n[k]));document.getElementById('biasValue').textContent=fmt(n.b);document.getElementById('neuronCalc').innerHTML='<h3>Trace the contributions</h3><div class="calc-row"><span>Colour: '+fmt(n.x1)+' × '+fmt(n.w1)+'</span><b>'+fmt(v.a)+'</b></div><div class="calc-row"><span>Shape: '+fmt(n.x2)+' × '+fmt(n.w2)+'</span><b>'+fmt(v.b)+'</b></div><div class="calc-row"><span>Add the bias</span><b>'+fmt(n.b)+'</b></div><div class="calc-row"><span>Combined score</span><b>'+fmt(v.z)+'</b></div>';document.getElementById('neuronResult').innerHTML='<span class="small">Toy rule: score ≥ 0 → Mango; otherwise Orange.</span><p class="big-number">'+v.decision+'</p><p class="small">Computed from the current values. This score is not a probability.</p>';}

// Round the exact binary floating-point value with Python's ties-to-even rule.
function pythonRound(value,places){
  if(!Number.isFinite(value)||value===0)return value;
  const view=new DataView(new ArrayBuffer(8));view.setFloat64(0,Math.abs(value));
  const bits=view.getBigUint64(0),exponent=Number((bits>>52n)&2047n),fraction=bits&((1n<<52n)-1n);
  const significand=exponent===0?fraction:(1n<<52n)|fraction,shift=(exponent===0?-1022:exponent-1023)-52;
  let numerator=significand*(10n**BigInt(places)),denominator=1n;
  if(shift>=0)numerator<<=BigInt(shift);else denominator<<=BigInt(-shift);
  let rounded=numerator/denominator;const remainder=numerator%denominator;
  if(remainder*2n>denominator||(remainder*2n===denominator&&rounded%2n!==0n))rounded++;
  return (value<0?-1:1)*Number(rounded)/(10**places);
}

stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)return go(b.dataset.go);if(b.dataset.quiz){const id=b.dataset.quiz,a=Number(b.dataset.choice),q=quizzes[id];state.answers[id]=a;save();document.querySelectorAll('[data-quiz="'+id+'"]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.choice)===a));const f=document.getElementById('feedback-'+id);f.textContent=(a===q.correct?'Yes. ':'Revisit the reason. ')+q.why;f.classList.toggle('bad',a!==q.correct);}if(b.id==='resetNeuron'){state.neuron=structuredClone(fresh.neuron);save();render();}if(b.dataset.activation){state.activation=b.dataset.activation;save();updateActivation();}if(b.dataset.trace!==undefined){state.trace=Number(b.dataset.trace);save();updateNetwork();}if(b.id==='nextTrace'){state.trace=(state.trace+1)%4;save();updateNetwork();}if(b.dataset.nonlinear!==undefined){state.nonlinear=b.dataset.nonlinear==='true';save();updateNonlinear();}if(b.id==='trainOne')train(1);if(b.id==='trainTwenty')train(20);if(b.id==='resetTraining'){state.train=structuredClone(fresh.train);state.train.history=[loss(0,0)];save();updateTraining();document.getElementById('learningRate').value=state.train.rate;document.getElementById('lossChange').textContent='Reset to zero parameters.';}if(b.dataset.family){state.family=b.dataset.family;save();showFamily();}if(b.dataset.stock){state.stockMethod=b.dataset.stock;save();updateStock();}if(b.id==='runCode'){state.code=document.getElementById('codeEditor').value;state.codeOutput=runTeachingCode(state.code);save();document.getElementById('codeOutput').textContent=state.codeOutput;}if(b.id==='restoreCode'){state.code=INITIAL_CODE;state.codeOutput='';save();render();}if(b.dataset.line!==undefined){const i=Number(b.dataset.line);document.querySelectorAll('[data-line]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('lineDetail').innerHTML='<h3>Line '+(i+1)+'</h3><pre class="code">'+esc(codeLines[i][0])+'</pre><p>'+codeLines[i][1]+'</p>';}if(b.id==='downloadWork'||b.id==='downloadFinal')downloadWork();if(b.id==='sourcesBtn')openDrawer('sources');});
stage.addEventListener('input',e=>{const t=e.target,id=t.id;if(['x1','x2','w1','w2','bias'].includes(id)){state.neuron[id==='bias'?'b':id]=Number(t.value);save();updateNeuron();}if(id==='activationX'){state.activationX=Number(t.value);save();updateActivation();}if(id==='netX1'||id==='netX2'){state[id]=Number(t.value);save();updateNetwork();}if(id==='learningRate'){state.train.rate=Number(t.value);save();document.getElementById('learningRateValue').textContent=fmt(state.train.rate,2);}if(id==='stockSplit'){state.stockSplit=Number(t.value);save();updateStock();}if(id==='codeEditor'){state.code=t.value;save();}if(t.dataset.field){state.worksheet[t.dataset.field]=t.value;save();}});
document.getElementById('prevBtn').onclick=()=>go(state.slide-1);document.getElementById('nextBtn').onclick=()=>go(state.slide+1);document.getElementById('outlineBtn').onclick=()=>openDrawer('outline');document.getElementById('glossaryBtn').onclick=()=>openDrawer('glossary');document.getElementById('teacherBtn').onclick=()=>openDrawer('notes');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('fullscreenBtn').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fullscreenBtn').textContent='Use browser full screen';}};
document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer();const b=e.target.closest('button');if(!b)return;if(b.dataset.outlineGo!==undefined){closeDrawer();go(b.dataset.outlineGo);}if(b.id==='timerToggle'){timerRunning=!timerRunning;if(timerRunning)timerInterval=setInterval(()=>{if(seconds>0)seconds--;else{timerRunning=false;clearInterval(timerInterval);}updateTimer();},1000);else clearInterval(timerInterval);updateTimer();}if(b.id==='timerReset'){seconds=7200;timerRunning=false;clearInterval(timerInterval);updateTimer();}});
document.getElementById('drawer').addEventListener('input',e=>{if(e.target.id==='wordSearch')document.getElementById('wordList').innerHTML=glossaryHTML(e.target.value);});
document.addEventListener('keydown',e=>{const drawer=document.getElementById('drawer');if(e.key==='Escape'&&!drawer.hidden){closeDrawer();return;}if(!drawer.hidden){if(e.key==='Tab'){const all=[...drawer.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'){e.preventDefault();go(state.slide+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.slide-1);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(slides.length-1);}if(e.key.toLowerCase()==='n')openDrawer('notes');});
window.addEventListener('resize',()=>{if(state.slide===13)updateActivation();if(state.slide===16)updateNonlinear();if(state.slide===19)updateTraining();if(state.slide===25)updateStock();});
state.slide=Math.max(0,Math.min(slides.length-1,Number(state.slide)||0));render();


// Bright and dark themes share a local preference across the course.
function applyTheme(mode){const dark=mode==='dark';document.documentElement.dataset.theme=dark?'dark':'bright';const b=document.getElementById('themeBtn');if(b){b.textContent=dark?'☀ Bright theme':'☾ Dark theme';b.setAttribute('aria-pressed',String(dark));b.setAttribute('aria-label','Switch to '+(dark?'bright':'dark')+' theme');}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#101c1c':'#f4f2e9';try{localStorage.setItem('aptech-ai-theme',dark?'dark':'bright');}catch(e){}}
let preferredTheme='bright';try{preferredTheme=localStorage.getItem('aptech-ai-theme')||'bright';}catch(e){}applyTheme(preferredTheme);
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'bright':'dark'));
</script></body></html>
